<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 8 - Trung Bình</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
    color: #222;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer:disabled {
    cursor: not-allowed;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.result p {
    font-size: 19px;
}

.win {
    color: #2ecc71 !important;
}

.lose {
    color: #e74c3c !important;
}

.draw {
    color: #f39c12 !important;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_van_khoi8.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">
    <div class="title">📚 NGỮ VĂN 8 - CẤP ĐỘ TRUNG BÌNH</div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>
</div>

<script>
const cauHoi = [
{
    q: "Văn bản tự sự chủ yếu dùng phương thức biểu đạt nào?",
    a: ["Miêu tả", "Tự sự", "Biểu cảm", "Nghị luận"],
    d: 1
},
{
    q: "Nhân vật chính trong truyện là ai?",
    a: ["Nhân vật xuất hiện ít nhất", "Nhân vật giữ vai trò trung tâm", "Nhân vật không có lời thoại", "Nhân vật phụ"],
    d: 1
},
{
    q: "Cốt truyện là gì?",
    a: ["Hệ thống sự việc trong tác phẩm", "Tên của tác phẩm", "Lời giới thiệu nhân vật", "Cách trình bày văn bản"],
    d: 0
},
{
    q: "Ngôi kể thứ nhất thường sử dụng đại từ nào?",
    a: ["Nó", "Hắn", "Tôi", "Họ"],
    d: 2
},
{
    q: "Ngôi kể thứ ba có đặc điểm nào?",
    a: ["Người kể xưng tôi", "Người kể giấu mình", "Chỉ kể về bản thân", "Không có người kể chuyện"],
    d: 1
},
{
    q: "Chi tiết tiêu biểu trong truyện có tác dụng gì?",
    a: ["Làm văn bản dài hơn", "Góp phần thể hiện nội dung và tính cách nhân vật", "Thay thế nhan đề", "Không có tác dụng"],
    d: 1
},
{
    q: "Chủ đề của một tác phẩm là gì?",
    a: ["Vấn đề chính được tác phẩm đề cập", "Số lượng nhân vật", "Tên tác giả", "Độ dài văn bản"],
    d: 0
},
{
    q: "Tình huống truyện là gì?",
    a: ["Hoàn cảnh đặc biệt làm nảy sinh sự kiện", "Phần kết thúc truyện", "Tên nhân vật", "Một câu văn miêu tả"],
    d: 0
},
{
    q: "Nhân vật được khắc họa chủ yếu thông qua yếu tố nào?",
    a: ["Ngoại hình, hành động, lời nói và suy nghĩ", "Số trang sách", "Tên tác giả", "Màu sắc trang giấy"],
    d: 0
},
{
    q: "Văn bản nghị luận thường tập trung vào điều gì?",
    a: ["Kể lại một câu chuyện", "Trình bày ý kiến và lí lẽ về một vấn đề", "Miêu tả cảnh vật", "Ghi lại cuộc hội thoại"],
    d: 1
},
{
    q: "Luận điểm là gì?",
    a: ["Ý kiến chính cần làm sáng tỏ", "Một câu hỏi tu từ", "Một hình ảnh miêu tả", "Tên văn bản"],
    d: 0
},
{
    q: "Luận cứ trong văn bản nghị luận gồm những gì?",
    a: ["Lí lẽ và bằng chứng", "Nhan đề và tên tác giả", "Nhân vật và cốt truyện", "Vần và nhịp"],
    d: 0
},
{
    q: "Bằng chứng trong bài nghị luận có tác dụng gì?",
    a: ["Làm bài viết khó hiểu", "Tăng sức thuyết phục cho luận điểm", "Thay thế toàn bộ luận điểm", "Kéo dài văn bản"],
    d: 1
},
{
    q: "Văn bản thông tin chủ yếu nhằm mục đích gì?",
    a: ["Cung cấp thông tin về sự vật, hiện tượng", "Bộc lộ tình cảm cá nhân", "Kể chuyện tưởng tượng", "Sáng tác thơ"],
    d: 0
},
{
    q: "Nhan đề văn bản thường có vai trò gì?",
    a: ["Gợi nội dung hoặc chủ đề văn bản", "Thay thế phần kết", "Chỉ ghi tên người đọc", "Không liên quan đến văn bản"],
    d: 0
},
{
    q: "Thông điệp của văn bản là gì?",
    a: ["Điều tác giả muốn gửi gắm đến người đọc", "Số lượng đoạn văn", "Tên nhà xuất bản", "Danh sách nhân vật"],
    d: 0
},
{
    q: "Đọc hiểu văn bản cần chú ý điều gì?",
    a: ["Chỉ đọc nhan đề", "Nội dung, hình thức và ý nghĩa văn bản", "Chỉ đếm số câu", "Bỏ qua chi tiết"],
    d: 1
},
{
    q: "Văn bản biểu cảm chủ yếu thể hiện điều gì?",
    a: ["Tình cảm và cảm xúc", "Số liệu thống kê", "Các công thức toán học", "Quy trình sản xuất"],
    d: 0
},
{
    q: "Yếu tố miêu tả trong văn bản có tác dụng gì?",
    a: ["Giúp sự vật, con người hiện lên cụ thể", "Chỉ dùng để kết thúc bài", "Thay thế mọi lời thoại", "Không có tác dụng"],
    d: 0
},
{
    q: "Khi phân tích một tác phẩm văn học, cần làm rõ điều gì?",
    a: ["Nội dung và nghệ thuật", "Giá tiền cuốn sách", "Số trang in", "Tên nhà sách"],
    d: 0
},
];

let ds = [...cauHoi].sort(() => Math.random() - 0.5).slice(0, 10);
let cau = 0;
let diemBan = 0;
let diemBot = 0;
let tg = 15;
let timer;
let daTraLoi = false;

function hienThiCau() {
    clearInterval(timer);
    daTraLoi = false;
    tg = 15;

    document.getElementById("timer").textContent = tg;
    document.getElementById("playerScore").textContent = diemBan;
    document.getElementById("botScore").textContent = diemBot;
    document.getElementById("number").textContent = cau + 1;

    let c = ds[cau];

    document.getElementById("question").textContent =
        "Câu " + (cau + 1) + "/10: " + c.q;

    document.getElementById("answers").innerHTML = c.a.map((x, j) => `
        <button class="answer" onclick="traLoi(${j}, this)">
            ${String.fromCharCode(65 + j)}. ${x}
        </button>
    `).join("");

    timer = setInterval(() => {
        tg--;
        document.getElementById("timer").textContent = tg;

        if (tg <= 0) {
            hetThoiGian();
        }
    }, 1000);
}

function traLoi(chon, el) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    if (chon === c.d) {
        diemBan++;
        el.classList.add("correct");
    } else {
        el.classList.add("wrong");
        nut[c.d].classList.add("correct");
    }

    document.getElementById("playerScore").textContent = diemBan;

    setTimeout(botTraLoi, 700);
}

function hetThoiGian() {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);
    nut[c.d].classList.add("correct");

    setTimeout(botTraLoi, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").textContent = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        <p>Bot có 25% xác suất trả lời đúng mỗi câu.</p>
        <br>
        <button onclick="location.reload()">🔄 Chơi lại</button>
        <button onclick="location.href='capdo_van_khoi8.html'">🎚️ Chọn cấp độ</button>
        <button onclick="location.href='khoi8.html'">🏠 Về chọn môn</button>
    `;
}

hienThiCau();
</script>

</body>
</html>
