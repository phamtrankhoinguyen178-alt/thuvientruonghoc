<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHTN 6 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.back:hover {
    background: #333;
}
.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}
.player {
    color: #2878e8;
}
.bot {
    color: #e74c3c;
}
.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}
.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}
.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}
.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}
.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}
.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}
.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}
.result h1 {
    color: #2878e8;
}
.win {
    color: #2ecc71;
}
.lose {
    color: #e74c3c;
}
.draw {
    color: #f39c12;
}
.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_khtn_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ KHTN KHỐI 6 - CHẾ ĐỘ HUYỀN THOẠI
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
    {
        q: "Một tế bào phân chia liên tiếp 3 lần tạo ra bao nhiêu tế bào con?",
        a: ["4", "6", "8", "16"],
        d: 2
    },
    {
        q: "Trong tế bào thực vật, bào quan nào chứa diệp lục?",
        a: ["Ti thể", "Lục lạp", "Không bào", "Nhân"],
        d: 1
    },
    {
        q: "Quá trình quang hợp hấp thụ khí nào?",
        a: ["Oxi", "Nitơ", "Cacbonic", "Hiđro"],
        d: 2
    },
    {
        q: "Vì sao khi lên cao không khí thường loãng hơn?",
        a: ["Áp suất khí quyển giảm", "Nhiệt độ luôn tăng", "Oxi biến mất hoàn toàn", "Trọng lực mất đi"],
        d: 0
    },
    {
        q: "Trong các chất sau, chất nào là chất tinh khiết?",
        a: ["Nước biển", "Không khí", "Nước cất", "Nước đường"],
        d: 2
    },
    {
        q: "Phương pháp nào phù hợp để tách cát ra khỏi nước?",
        a: ["Cô cạn", "Lọc", "Chưng cất", "Chiết"],
        d: 1
    },
    {
        q: "Một vật có khối lượng 200g và thể tích 100cm³. Khối lượng riêng là bao nhiêu?",
        a: ["0,5 g/cm³", "2 g/cm³", "20 g/cm³", "200 g/cm³"],
        d: 1
    },
    {
        q: "Lực nào giữ cho các hành tinh chuyển động quanh Mặt Trời?",
        a: ["Lực ma sát", "Lực đàn hồi", "Lực hấp dẫn", "Lực đẩy Ác-si-mét"],
        d: 2
    },
    {
        q: "Hiện tượng nào sau đây là sự ngưng tụ?",
        a: ["Nước đá tan", "Hơi nước tạo thành giọt nước", "Nước sôi", "Sáp nến nóng chảy"],
        d: 1
    },
    {
        q: "Cơ quan nào là trung tâm điều khiển hoạt động của tế bào?",
        a: ["Màng tế bào", "Nhân tế bào", "Tế bào chất", "Thành tế bào"],
        d: 1
    },
    {
        q: "Đơn vị đo cường độ dòng điện là gì?",
        a: ["Vôn", "Oát", "Ampe", "Niutơn"],
        d: 2
    },
    {
        q: "Trong chuỗi thức ăn, sinh vật sản xuất thường là gì?",
        a: ["Động vật ăn thịt", "Thực vật xanh", "Nấm", "Vi khuẩn gây bệnh"],
        d: 1
    },
    {
        q: "Hỗn hợp nào sau đây là huyền phù?",
        a: ["Nước muối", "Nước đường", "Nước phù sa", "Không khí"],
        d: 2
    },
    {
        q: "Cơ quan nào của thực vật có chức năng thoát hơi nước chủ yếu?",
        a: ["Rễ", "Lá", "Hoa", "Quả"],
        d: 1
    },
    {
        q: "Vật liệu nào sau đây có khả năng cách điện tốt?",
        a: ["Đồng", "Nhôm", "Sắt", "Cao su"],
        d: 3
    },
    {
        q: "Một năm trên Trái Đất có khoảng bao nhiêu ngày?",
        a: ["180", "270", "365", "400"],
        d: 2
    },
    {
        q: "Sinh vật nào sau đây thuộc nhóm vi khuẩn?",
        a: ["Nấm rơm", "Vi khuẩn lactic", "Rêu", "Trùng roi"],
        d: 1
    },
    {
        q: "Khi nhiệt độ tăng, thể tích của hầu hết chất khí sẽ như thế nào nếu áp suất không đổi?",
        a: ["Tăng", "Giảm", "Không đổi", "Biến mất"],
        d: 0
    },
    {
        q: "Trong hệ sinh thái, sinh vật tiêu thụ bậc 1 thường ăn gì?",
        a: ["Sinh vật sản xuất", "Động vật ăn thịt", "Sinh vật phân giải", "Động vật tiêu thụ bậc 2"],
        d: 0
    },
    {
        q: "Đâu là vai trò chính của sinh vật phân giải?",
        a: ["Tạo ánh sáng", "Phân hủy xác sinh vật và chất thải", "Tạo ra nước biển", "Ngăn cản quang hợp"],
        d: 1
    }
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.75;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        
        <br>
        <button onclick="location.href='capdo_khtn_khoi6_kho.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_khtn_khoi6.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
