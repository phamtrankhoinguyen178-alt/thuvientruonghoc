
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toán 7 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

/* GIAO DIỆN ĐIỆN THOẠI */
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_toan_khoi7.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>

    <div class="time">
        ⏱ <span id="timer">15</span>
    </div>

    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ TOÁN KHỐI 7 - CHẾ ĐỘ Tân binh
    </div>

    <div id="game" class="card">

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [
    {
        q: "3 + 5 = ?",
        a: ["6", "7", "8", "9"],
        d: 2
    },
    {
        q: "7 - 12 = ?",
        a: ["-5", "5", "-19", "19"],
        d: 0
    },
    {
        q: "2/3 + 1/3 = ?",
        a: ["1/3", "2/3", "1", "4/3"],
        d: 2
    },
    {
        q: "(-4) × 3 = ?",
        a: ["-12", "-7", "7", "12"],
        d: 0
    },
    {
        q: "√49 = ?",
        a: ["5", "6", "7", "8"],
        d: 2
    },
    {
        q: "2⁵ = ?",
        a: ["10", "16", "25", "32"],
        d: 3
    },
    {
        q: "Nếu x = 3 thì 2x + 1 = ?",
        a: ["5", "6", "7", "8"],
        d: 2
    },
    {
        q: "Góc có số đo 90° là góc gì?",
        a: ["Góc nhọn", "Góc vuông", "Góc tù", "Góc bẹt"],
        d: 1
    },
    {
        q: "Tổng ba góc của một tam giác bằng?",
        a: ["90°", "180°", "270°", "360°"],
        d: 1
    },
    {
        q: "Nếu a = 5 thì a² bằng?",
        a: ["10", "15", "20", "25"],
        d: 3
    },
    {
        q: "Số nào sau đây là số hữu tỉ?",
        a: ["√2", "π", "3/4", "√5"],
        d: 2
    },
    {
        q: "(-8) + 13 = ?",
        a: ["-5", "5", "21", "-21"],
        d: 1
    },
    {
        q: "3² + 4² = ?",
        a: ["7", "12", "25", "49"],
        d: 2
    },
    {
        q: "15/20 rút gọn bằng?",
        a: ["1/2", "2/3", "3/4", "4/5"],
        d: 2
    },
    {
        q: "Một tam giác có hai góc 50° và 60°. Góc còn lại bằng?",
        a: ["60°", "70°", "80°", "90°"],
        d: 1
    }
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {

    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;

    document.getElementById("timer").innerText = thoiGian;

    document.getElementById("question").innerText =
        danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {

        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;

    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {

        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {

            clearInterval(timer);

            ketThucCau();

        }

    }, 1000);
}

function traLoi(chon, element) {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {

        diemBan++;

        element.classList.add("correct");

    } else {

        element.classList.add("wrong");

        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");

    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {

    if (!daTraLoi) {

        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");

    }

    setTimeout(() => {

        botTraLoi();

    }, 700);
}

function botTraLoi() {

    let dung = Math.random() < 0.25;

    if (dung) {

        diemBot++;

    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {

        ketThucTran();

    } else {

        hienThiCau();

    }
}

function ketThucTran() {

    clearInterval(timer);

    document.getElementById("game").style.display = "none";

    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;

    }

    result.innerHTML = `
        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

       

        <br>

        <button onclick="location.href='capdo_toan_khoi7.html'">
            Chơi lại
        </button>

        <button onclick="location.href='khoi7.html'">
            Về chọn môn
        </button>
    `;
}

hienThiCau();

</script>

</body>
</html>
