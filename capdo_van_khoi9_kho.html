<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 9 - Khó</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #00695c, #00897b, #26a69a);
    min-height: 100vh;
}

.top {
    background: #111;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 3px 15px #000;
    font-size: 20px;
    font-weight: bold;
}

.player { color: #4da6ff; }
.bot { color: #ff3333; }

.time, .bot-time {
    background: #333;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.bot-time {
    background: #555;
}

.main {
    max-width: 950px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: #fff;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
    text-shadow: 0 0 10px #00ffff;
}

.card {
    background: #171717;
    color: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px #000;
    border: 2px solid #00897b;
}

.question {
    font-size: 23px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 30px;
    line-height: 1.5;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #555;
    border-radius: 12px;
    background: #242424;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #004d40;
    border-color: #00e5ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #155d25;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #700000;
    border-color: #ff3333;
}

.answer:disabled {
    cursor: default;
}

.status {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: #171717;
    color: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 30px #000;
    border: 2px solid #00897b;
}

.result h1 {
    font-size: 40px;
}

.win { color: #2ecc71; }
.lose { color: #ff3333; }
.draw { color: #f39c12; }

.result h2 {
    margin: 12px;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #00897b;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #00bfa5;
}

@media(max-width:600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 15px;
    }

    .title {
        font-size: 25px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="top">

    <div class="player">
        👤 Bạn: <span id="playerScore">0</span>
    </div>

    <div class="time">
        ⏱ Bạn: <span id="timer">15</span>s
    </div>

    <div class="bot">
        🤖 Bot: <span id="botScore">0</span>
    </div>

    <div class="bot-time">
        🤖 Bot: <span id="botTimer">15</span>s
    </div>

</div>

<div class="main">

    <div class="title">
        📚 NGỮ VĂN 9 - CẤP ĐỘ KHÓ 📚
    </div>

    <div id="game" class="card">

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="status" id="status">
            🤖 Bot đang suy nghĩ...
        </div>

    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [

{
q: "Trong đoạn trích Kiều ở lầu Ngưng Bích, nghệ thuật tả cảnh ngụ tình được thể hiện rõ nhất qua điều gì?",
a: ["Cảnh vật phản ánh tâm trạng cô đơn, buồn tủi và lo âu của Thúy Kiều", "Cảnh vật chỉ nhằm giới thiệu địa điểm", "Thiên nhiên được miêu tả hoàn toàn khách quan", "Cảnh vật thể hiện niềm vui của nhân vật"],
d: 0
},

{
q: "Giá trị hiện thực của Truyện Kiều thể hiện chủ yếu ở phương diện nào?",
a: ["Phản ánh vẻ đẹp thiên nhiên", "Phản ánh xã hội bất công và số phận đau khổ của con người", "Ca ngợi tầng lớp thống trị", "Miêu tả cuộc sống thần tiên"],
d: 1
},

{
q: "Trong đoạn trích Chị em Thúy Kiều, Nguyễn Du dự báo điều gì qua vẻ đẹp của Thúy Kiều?",
a: ["Cuộc sống hoàn toàn bình yên", "Tương lai nhiều sóng gió, bất hạnh", "Cuộc sống giàu sang mãi mãi", "Không có biến cố"],
d: 1
},

{
q: "Điểm nổi bật trong nghệ thuật xây dựng nhân vật của Nguyễn Du là gì?",
a: ["Chỉ miêu tả ngoại hình", "Kết hợp miêu tả ngoại hình, hành động, tâm lí và ngôn ngữ", "Chỉ dùng lời kể trực tiếp", "Không thể hiện nội tâm"],
d: 1
},

{
q: "Trong bài thơ Đồng chí, hình ảnh 'Đầu súng trăng treo' mang ý nghĩa gì?",
a: ["Chỉ miêu tả vũ khí", "Sự kết hợp giữa hiện thực chiến đấu và vẻ đẹp lãng mạn", "Thể hiện sự sợ hãi", "Miêu tả cảnh thiên nhiên ban ngày"],
d: 1
},

{
q: "Trong bài thơ Ánh trăng, sự xuất hiện của vầng trăng ở cuối bài có ý nghĩa gì?",
a: ["Chỉ báo hiệu thời gian ban đêm", "Gợi nhắc con người về quá khứ nghĩa tình và sự thủy chung", "Thể hiện sự giàu sang", "Miêu tả thiên nhiên đơn thuần"],
d: 1
},

{
q: "Trong bài thơ Sang thu, hình ảnh 'Sấm cũng bớt bất ngờ trên hàng cây đứng tuổi' còn gợi liên tưởng gì?",
a: ["Con người trưởng thành, từng trải sẽ bình tĩnh hơn trước biến động", "Thiên nhiên không còn tồn tại", "Mùa hè bắt đầu", "Cây cối ngừng phát triển"],
d: 0
},

{
q: "Thông điệp nổi bật trong bài thơ Mùa xuân nho nhỏ là gì?",
a: ["Sống chỉ vì lợi ích cá nhân", "Sống đẹp, cống hiến âm thầm cho đất nước và cuộc đời", "Tránh tham gia các hoạt động xã hội", "Chỉ quan tâm đến quá khứ"],
d: 1
},

{
q: "Trong bài thơ Viếng lăng Bác, hình ảnh 'mặt trời trong lăng' là biện pháp tu từ nào?",
a: ["So sánh", "Ẩn dụ", "Hoán dụ", "Nói quá"],
d: 1
},

{
q: "Tác phẩm Làng của Kim Lân thể hiện tình cảm nổi bật nào?",
a: ["Tình yêu gia đình đơn thuần", "Tình yêu làng quê gắn bó với tình yêu đất nước", "Tình yêu thiên nhiên", "Tình yêu cuộc sống thành thị"],
d: 1
},

{
q: "Tình huống truyện trong tác phẩm Làng có tác dụng gì?",
a: ["Thử thách tình yêu làng và lòng yêu nước của ông Hai", "Giới thiệu phong cảnh làng quê", "Miêu tả cuộc sống thành thị", "Tạo yếu tố hài hước"],
d: 0
},

{
q: "Trong truyện ngắn Lặng lẽ Sa Pa, nhân vật anh thanh niên tiêu biểu cho phẩm chất nào?",
a: ["Sống ích kỉ và lười biếng", "Yêu nghề, có trách nhiệm và sống có lí tưởng", "Chỉ quan tâm vật chất", "Ngại giao tiếp và thiếu trách nhiệm"],
d: 1
},

{
q: "Trong truyện Chiếc lược ngà, chiếc lược có ý nghĩa biểu tượng gì?",
a: ["Sự giàu có của gia đình", "Tình yêu thương sâu nặng của người cha dành cho con", "Sự chia cách vĩnh viễn", "Kỉ niệm về chiến trường"],
d: 1
},

{
q: "Điểm đặc sắc trong nghệ thuật kể chuyện của Chiếc lược ngà là gì?",
a: ["Ngôi kể thứ nhất qua nhân vật bác Ba", "Ngôi kể thứ ba toàn tri", "Chỉ dùng lời đối thoại", "Không có người kể chuyện"],
d: 0
},

{
q: "Trong văn bản nghị luận, thao tác bác bỏ được sử dụng nhằm mục đích gì?",
a: ["Khẳng định mọi ý kiến đều đúng", "Phủ nhận những ý kiến sai trái bằng lí lẽ và bằng chứng", "Chỉ kể lại sự việc", "Miêu tả nhân vật"],
d: 1
},

{
q: "Yếu tố nào làm nên sức thuyết phục của một bài nghị luận xã hội?",
a: ["Luận điểm rõ ràng, lí lẽ chặt chẽ và dẫn chứng xác thực", "Sử dụng nhiều từ ngữ khó", "Viết thật dài", "Không cần dẫn chứng"],
d: 0
},

{
q: "Trong phân tích thơ, việc chú ý đến nhịp điệu và vần có ý nghĩa gì?",
a: ["Giúp nhận ra cách tổ chức âm thanh và cảm xúc của bài thơ", "Chỉ giúp đếm số chữ", "Không có tác dụng", "Chỉ để xác định tên tác giả"],
d: 0
},

{
q: "Sự khác nhau cơ bản giữa lời người kể chuyện và lời nhân vật là gì?",
a: ["Lời người kể dùng để dẫn dắt câu chuyện, lời nhân vật thể hiện tiếng nói của nhân vật", "Hai loại lời hoàn toàn giống nhau", "Lời nhân vật luôn dài hơn", "Lời người kể chỉ xuất hiện trong thơ"],
d: 0
},

{
q: "Khi phân tích một chi tiết nghệ thuật đặc sắc trong truyện, cần làm rõ điều gì?",
a: ["Vị trí, ý nghĩa và tác dụng của chi tiết đối với chủ đề, nhân vật", "Chỉ số lần chi tiết xuất hiện", "Chỉ độ dài của câu văn", "Chỉ tên nhân vật"],
d: 0
},

{
q: "Mối quan hệ giữa chủ đề và tư tưởng của tác phẩm văn học được hiểu như thế nào?",
a: ["Chủ đề là vấn đề được phản ánh, tư tưởng là nhận thức và thái độ của nhà văn về vấn đề ấy", "Hai khái niệm hoàn toàn không liên quan", "Tư tưởng chỉ là tên tác phẩm", "Chủ đề chỉ là số lượng nhân vật"],
d: 0
}

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;

let thoiGianBan = 15;
let thoiGianBot = 15;

let timerBan;
let timerBot;

let daTraLoi = false;
let botDaTraLoi = false;

function hienThiCau() {

    daTraLoi = false;
    botDaTraLoi = false;

    thoiGianBan = 15;
    thoiGianBot = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = 15;
    document.getElementById("botTimer").innerText = 15;

    document.getElementById("question").innerText =
        danhSach[cau].q;

    document.getElementById("status").innerText =
        "🤖 Bot đang suy nghĩ...";

    let html = "";

    danhSach[cau].a.forEach((x, i) => {

        html += `
        <button class="answer" onclick="traLoi(${i}, this)">
            ${String.fromCharCode(65 + i)}. ${x}
        </button>
        `;

    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timerBan);
    clearInterval(timerBot);

    timerBan = setInterval(() => {

        thoiGianBan--;

        document.getElementById("timer").innerText =
            thoiGianBan;

        if (thoiGianBan <= 0) {

            clearInterval(timerBan);
            hetThoiGian();

        }

    }, 1000);

    timerBot = setInterval(() => {

        thoiGianBot--;

        document.getElementById("botTimer").innerText =
            thoiGianBot;

        if (thoiGianBot <= 0) {

            clearInterval(timerBot);
            botTraLoi();

        }

    }, 1000);
}

function traLoi(chon, element) {

    if (daTraLoi || botDaTraLoi) return;

    daTraLoi = true;

    clearInterval(timerBan);

    let dung = danhSach[cau].d;
    let cacNut = document.querySelectorAll(".answer");

    if (chon === dung) {

        diemBan++;

        element.classList.add("correct");

        document.getElementById("status").innerText =
            "✅ Bạn trả lời chính xác!";

    } else {

        element.classList.add("wrong");

        cacNut[dung].classList.add("correct");

        document.getElementById("status").innerText =
            "❌ Bạn trả lời chưa chính xác!";

    }

    cacNut.forEach(nut => nut.disabled = true);

    document.getElementById("playerScore").innerText =
        diemBan;

}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    let dung = danhSach[cau].d;

    let cacNut = document.querySelectorAll(".answer");

    cacNut[dung].classList.add("correct");

    cacNut.forEach(nut => nut.disabled = true);

    document.getElementById("status").innerText =
        "⏰ Bạn hết thời gian!";

}

function botTraLoi() {

    if (botDaTraLoi) return;

    botDaTraLoi = true;

    let dung = Math.random() < 0.75;

    if (dung) {

        diemBot++;

        document.getElementById("status").innerText =
            "🤖 Bot trả lời đúng!";

    } else {

        document.getElementById("status").innerText =
            "🤖 Bot trả lời sai!";

    }

    document.getElementById("botScore").innerText =
        diemBot;

    setTimeout(() => {

        cau++;

        if (cau >= 10) {

            ketThucTran();

        } else {

            hienThiCau();

        }

    }, 1000);
}

function ketThucTran() {

    clearInterval(timerBan);
    clearInterval(timerBot);

    document.getElementById("game").style.display =
        "none";

    document.querySelector(".info").style.display =
        "none";

    document.querySelector(".title").style.display =
        "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>🎉 Bạn đã đánh bại Bot!</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>🤖 Bot đã chiến thắng!</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🔥 HÒA!</h1>
            <p>Hai bên có cùng số điểm!</p>
        `;

    }

    result.innerHTML = `

        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>⏱ Bạn: 15 giây/câu</p>

        <p>🤖 Bot: 15 giây/câu</p>

        <p>📚 Bộ câu hỏi: 20 câu</p>

        <p>🎯 Bot có 75% khả năng trả lời đúng</p>

        <br>

        <button onclick="location.href='capdo_van_khoi9.html'">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='khoi9.html'">
            🏠 Về chọn môn
        </button>

    `;
}

hienThiCau();

</script>

</body>
</html>
