
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 9 - Khó</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
    color: #222;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer:disabled {
    cursor: not-allowed;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.result p {
    font-size: 19px;
}

.win {
    color: #2ecc71 !important;
}

.lose {
    color: #e74c3c !important;
}

.draw {
    color: #f39c12 !important;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_van_khoi9.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">📚 NGỮ VĂN 9 - CẤP ĐỘ KHÓ</div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [

{
    q: "Trong Truyện Kiều, bút pháp ước lệ tượng trưng được Nguyễn Du sử dụng chủ yếu nhằm mục đích gì?",
    a: ["Khắc họa vẻ đẹp nhân vật thông qua hình ảnh thiên nhiên mang tính quy ước", "Miêu tả chính xác địa danh", "Kể lại các sự kiện lịch sử", "Tạo yếu tố hài hước"],
    d: 0
},

{
    q: "Qua đoạn trích Kiều ở lầu Ngưng Bích, nghệ thuật tả cảnh ngụ tình thể hiện rõ nhất điều gì?",
    a: ["Tâm trạng cô đơn, buồn tủi và nỗi nhớ của Thúy Kiều", "Niềm vui đoàn tụ", "Sự giàu có của gia đình Kiều", "Không khí vui tươi của lễ hội"],
    d: 0
},

{
    q: "Giá trị nhân đạo nổi bật của Truyện Kiều là gì?",
    a: ["Trân trọng vẻ đẹp con người, cảm thương số phận bất hạnh và lên án bất công", "Ca ngợi chiến tranh", "Đề cao tiền bạc", "Phê phán tình yêu đôi lứa"],
    d: 0
},

{
    q: "Trong bài thơ Đồng chí, cơ sở hình thành tình đồng chí là gì?",
    a: ["Cùng cảnh ngộ, cùng lí tưởng và nhiệm vụ chiến đấu", "Cùng sở thích giải trí", "Cùng quê hương và nghề nghiệp", "Cùng địa vị xã hội"],
    d: 0
},

{
    q: "Hình ảnh 'đầu súng trăng treo' trong bài Đồng chí có ý nghĩa nghệ thuật nổi bật nào?",
    a: ["Kết hợp chất hiện thực và lãng mạn, biểu tượng cho tâm hồn người lính", "Chỉ miêu tả hoạt động quân sự", "Thể hiện sự nguy hiểm của thiên nhiên", "Miêu tả cảnh sinh hoạt"],
    d: 0
},

{
    q: "Trong bài thơ Bài thơ về tiểu đội xe không kính, giọng điệu nổi bật của tác phẩm là gì?",
    a: ["Trẻ trung, ngang tàng, sôi nổi và giàu chất lính", "Buồn bã, bi lụy", "Trang nghiêm, cổ kính", "Châm biếm và cay nghiệt"],
    d: 0
},

{
    q: "Qua hình ảnh người lính lái xe, Phạm Tiến Duật muốn làm nổi bật phẩm chất nào?",
    a: ["Lòng dũng cảm, tinh thần lạc quan và ý chí chiến đấu", "Sự giàu có và quyền lực", "Tính ích kỉ", "Sự sợ hãi trước khó khăn"],
    d: 0
},

{
    q: "Trong bài thơ Ánh trăng, tình huống bất ngờ khi mất điện có ý nghĩa gì?",
    a: ["Tạo cơ hội để nhân vật trữ tình đối diện với quá khứ và nhận ra sự lãng quên", "Thể hiện niềm vui của cuộc sống hiện đại", "Miêu tả sự thay đổi thời tiết", "Tạo không khí vui nhộn"],
    d: 0
},

{
    q: "Hình ảnh vầng trăng trong bài Ánh trăng mang ý nghĩa biểu tượng nào?",
    a: ["Quá khứ nghĩa tình, thiên nhiên và những giá trị thủy chung", "Sự giàu sang", "Quyền lực", "Cuộc sống đô thị"],
    d: 0
},

{
    q: "Trong bài thơ Sang thu, hình ảnh 'sấm cũng bớt bất ngờ trên hàng cây đứng tuổi' còn gợi liên tưởng nào?",
    a: ["Con người từng trải sẽ bình tĩnh hơn trước những biến động cuộc đời", "Mùa hè bắt đầu", "Thiên nhiên không còn tồn tại", "Con người luôn sợ hãi"],
    d: 0
},

{
    q: "Nét đặc sắc trong nghệ thuật của bài thơ Mùa xuân nho nhỏ là gì?",
    a: ["Hình ảnh giản dị, giàu sức gợi và giọng thơ tha thiết, chân thành", "Ngôn ngữ khoa học khô khan", "Cốt truyện phức tạp", "Giọng điệu châm biếm"],
    d: 0
},

{
    q: "Nhan đề Những ngôi sao xa xôi gợi liên tưởng sâu sắc nhất đến điều gì?",
    a: ["Vẻ đẹp tâm hồn và phẩm chất cao quý của những cô gái thanh niên xung phong", "Sự giàu sang của nhân vật", "Cuộc sống thành thị", "Những chuyến du lịch"],
    d: 0
},

{
    q: "Điểm nhìn trần thuật trong truyện Những ngôi sao xa xôi được đặt ở đâu?",
    a: ["Ngôi thứ nhất, qua lời kể của nhân vật Phương Định", "Ngôi thứ ba toàn tri", "Ngôi thứ hai", "Qua lời kể của Nho"],
    d: 0
},

{
    q: "Trong truyện ngắn Làng, việc ông Hai nghe tin làng Chợ Dầu theo giặc đã tạo ra tình huống truyện như thế nào?",
    a: ["Thử thách tình yêu làng và lòng yêu nước của nhân vật", "Tạo tình huống gây cười", "Miêu tả cuộc sống sung túc", "Giới thiệu một chuyến đi xa"],
    d: 0
},

{
    q: "Nghệ thuật xây dựng nhân vật ông Hai trong truyện Làng có điểm nổi bật nào?",
    a: ["Miêu tả tâm lí tinh tế qua lời nói, hành động và diễn biến nội tâm", "Chỉ miêu tả ngoại hình", "Chỉ sử dụng lời kể gián tiếp", "Không có diễn biến tâm trạng"],
    d: 0
},

{
    q: "Thành phần biệt lập phụ chú có tác dụng gì?",
    a: ["Bổ sung, giải thích thêm một số thông tin cho câu", "Dùng để hỏi", "Dùng để ra lệnh", "Dùng để kết thúc đoạn văn"],
    d: 0
},

{
    q: "Sự khác nhau cơ bản giữa ẩn dụ và hoán dụ là gì?",
    a: ["Ẩn dụ dựa trên nét tương đồng, hoán dụ dựa trên quan hệ gần gũi", "Cả hai đều chỉ dựa trên quan hệ đối lập", "Ẩn dụ dựa trên quan hệ thời gian", "Hoán dụ dựa trên quan hệ âm thanh"],
    d: 0
},

{
    q: "Trong văn nghị luận, thao tác lập luận bác bỏ nhằm mục đích gì?",
    a: ["Chỉ ra sự sai lầm, thiếu hợp lí của một ý kiến hoặc quan điểm", "Kể lại một câu chuyện", "Miêu tả nhân vật", "Liệt kê các sự vật"],
    d: 0
},

{
    q: "Một luận điểm thuyết phục cần đáp ứng yêu cầu nào?",
    a: ["Rõ ràng, phù hợp vấn đề và được hỗ trợ bằng lí lẽ, bằng chứng", "Càng dài càng tốt", "Chỉ cần có cảm xúc", "Không cần liên quan đến vấn đề"],
    d: 0
},

{
    q: "Ý nghĩa của việc sử dụng yếu tố biểu cảm trong văn nghị luận là gì?",
    a: ["Tạo sự đồng cảm và tăng sức thuyết phục cho bài viết", "Thay thế hoàn toàn lí lẽ", "Làm mất tính logic", "Chỉ để tăng số lượng câu"],
    d: 0
}

];

let ds = [...cauHoi].sort(() => Math.random() - 0.5).slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let tg = 15;
let timer;
let daTraLoi = false;

function hienThiCau() {

    clearInterval(timer);
    daTraLoi = false;
    tg = 15;

    document.getElementById("timer").textContent = tg;
    document.getElementById("playerScore").textContent = diemBan;
    document.getElementById("botScore").textContent = diemBot;
    document.getElementById("number").textContent = cau + 1;

    let c = ds[cau];

    document.getElementById("question").textContent =
        "Câu " + (cau + 1) + "/10: " + c.q;

    document.getElementById("answers").innerHTML = c.a.map((x, j) => `
        <button class="answer" onclick="traLoi(${j}, this)">
            ${String.fromCharCode(65 + j)}. ${x}
        </button>
    `).join("");

    timer = setInterval(() => {

        tg--;

        document.getElementById("timer").textContent = tg;

        if (tg <= 0) {
            hetThoiGian();
        }

    }, 1000);
}

function traLoi(chon, el) {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    if (chon === c.d) {

        diemBan++;
        el.classList.add("correct");

    } else {

        el.classList.add("wrong");
        nut[c.d].classList.add("correct");

    }

    document.getElementById("playerScore").textContent = diemBan;

    setTimeout(botTraLoi, 700);
}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    nut[c.d].classList.add("correct");

    setTimeout(botTraLoi, 700);
}

function botTraLoi() {

    let dung = Math.random() < 0.70;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").textContent = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {

    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Xuất sắc! Bạn đã đánh bại Bot ở cấp độ khó.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này. Hãy cố gắng hơn nhé!</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;

    }

    result.innerHTML = `
        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>🔥 Cấp độ: KHÓ</p>
        

        <br>

        <button onclick="location.reload()">🔄 Chơi lại</button>

        <button onclick="location.href='capdo_van_khoi9.html'">
            🎚️ Chọn cấp độ
        </button>

        <button onclick="location.href='khoi9.html'">
            🏠 Về chọn môn
        </button>
    `;
}

hienThiCau();

</script>

</body>
</html>
