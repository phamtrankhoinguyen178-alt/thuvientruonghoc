
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiếng Anh 9 - HUYỀN THOẠI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 10px 18px;
    background: white;
    color: #2878e8;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 3px 8px #0002;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    align-items: center;
    text-align: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px;
    border-radius: 12px;
}

.main {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer.disabled {
    pointer-events: none;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.status {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    font-size: 36px;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result h2 {
    margin: 12px;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width:600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 14px;
        gap: 5px;
    }

    .time {
        padding: 9px 4px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }

    .answer {
        font-size: 16px;
    }

    .result {
        padding: 20px;
    }
}
</style>
</head>

<body>

<a class="back" href="capdo_anh_khoi9.html">
    ⬅ Quay về
</a>

<div class="top">

    <div class="player">
        👤 Bạn: <span id="playerScore">0</span>
    </div>

    <div class="time">
        ⏱ Bạn: <span id="timer">15</span>s
    </div>

    <div class="bot">
        🤖 Bot: <span id="botScore">0</span>
    </div>

</div>

<div class="main">

    <div class="title">
        ⚔️ TIẾNG ANH KHỐI 9 - HUYỀN THOẠI
    </div>

    <div id="game" class="card">

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="status" id="status">
            🤖 Bot đang suy nghĩ...
        </div>

    </div>

    <div class="info">
        Câu <span id="number">1</span>/20
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [

{
    q: "Choose the correct answer: Had I known about the meeting, I _____ there.",
    a: ["would go", "would have gone", "will go", "went"],
    d: 1
},

{
    q: "Choose the correct answer: Not only _____ late, but he also forgot his homework.",
    a: ["he was", "was he", "he is", "is he"],
    d: 1
},

{
    q: "Choose the correct form: The project _____ by the students before the deadline.",
    a: ["completed", "was completed", "has completing", "is complete"],
    d: 1
},

{
    q: "Choose the correct answer: I regret _____ you that your application was unsuccessful.",
    a: ["tell", "to tell", "telling", "told"],
    d: 1
},

{
    q: "Choose the correct answer: The man, _____ car was stolen, called the police.",
    a: ["who", "whom", "whose", "which"],
    d: 2
},

{
    q: "Choose the correct answer: No sooner _____ home than it started to rain.",
    a: ["I arrived", "had I arrived", "I had arrived", "did I arrive"],
    d: 1
},

{
    q: "What does 'meticulous' mean?",
    a: ["Careless", "Very careful and precise", "Angry", "Confused"],
    d: 1
},

{
    q: "Choose the correct answer: If she had studied harder, she _____ the exam.",
    a: ["would pass", "will pass", "would have passed", "passed"],
    d: 2
},

{
    q: "Choose the correct answer: He denied _____ the window.",
    a: ["break", "to break", "breaking", "broke"],
    d: 2
},

{
    q: "Choose the correct answer: The book _____ I borrowed from the library is very interesting.",
    a: ["who", "where", "which", "whose"],
    d: 2
},

{
    q: "Choose the correct answer: Despite _____ tired, she continued working.",
    a: ["be", "being", "was", "to be"],
    d: 1
},

{
    q: "Choose the correct answer: It is essential that every student _____ on time.",
    a: ["is", "be", "was", "being"],
    d: 1
},

{
    q: "Which word is closest in meaning to 'inevitable'?",
    a: ["Unavoidable", "Unusual", "Unimportant", "Uncertain"],
    d: 0
},

{
    q: "Choose the correct answer: He asked me how long I _____ English.",
    a: ["study", "am studying", "had studied", "will study"],
    d: 2
},

{
    q: "Choose the correct answer: The harder you work, _____ results you will get.",
    a: ["the good", "the better", "better", "the best"],
    d: 1
},

{
    q: "Choose the correct answer: Were I in your position, I _____ the offer.",
    a: ["accept", "will accept", "would accept", "accepted"],
    d: 2
},

{
    q: "Choose the correct answer: She is believed _____ the competition.",
    a: ["to win", "winning", "to have won", "won"],
    d: 2
},

{
    q: "Choose the correct answer: I would rather you _____ here tomorrow.",
    a: ["come", "came", "will come", "coming"],
    d: 1
},

{
    q: "What does 'deteriorate' mean?",
    a: ["Improve", "Become worse", "Disappear", "Develop"],
    d: 1
},

{
    q: "Choose the correct sentence.",
    a: [
        "Although he was tired, but he continued working.",
        "Despite he was tired, he continued working.",
        "Although he was tired, he continued working.",
        "In spite he was tired, he continued working."
    ],
    d: 2
},

{
    q: "Choose the correct answer: She suggested that he _____ a doctor.",
    a: ["sees", "see", "saw", "seeing"],
    d: 1
},

{
    q: "Choose the correct answer: By next June, I _____ here for five years.",
    a: ["will work", "will have worked", "worked", "have worked"],
    d: 1
},

{
    q: "Choose the correct answer: The speech was so _____ that everyone listened carefully.",
    a: ["inspiring", "inspired", "inspiration", "inspire"],
    d: 0
},

{
    q: "Choose the correct answer: Little _____ that the decision would change his life.",
    a: ["he knew", "did he know", "he did know", "knew he"],
    d: 1
}

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);

danhSach = danhSach.slice(0, 20);

let cau = 0;

let diemBan = 0;
let diemBot = 0;

let thoiGianBan = 15;

let timerBan;
let timerBot;
let timerChuyenCau;

let daTraLoi = false;
let botDaTraLoi = false;

function hienThiCau() {

    daTraLoi = false;
    botDaTraLoi = false;

    thoiGianBan = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = 15;

    document.getElementById("question").innerText =
        danhSach[cau].q;

    document.getElementById("status").innerText =
        "🤖 Bot đang suy nghĩ...";

    let html = "";

    danhSach[cau].a.forEach((x, i) => {

        html += `
            <div class="answer"
                onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;

    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timerBan);
    clearTimeout(timerBot);
    clearTimeout(timerChuyenCau);

    timerBan = setInterval(() => {

        thoiGianBan--;

        document.getElementById("timer").innerText =
            thoiGianBan;

        if (thoiGianBan <= 0) {

            clearInterval(timerBan);

            hetThoiGian();

        }

    }, 1000);

    timerBot = setTimeout(() => {

        botTraLoi();

    }, 10000);

}

function traLoi(chon, element) {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timerBan);

    let dung = danhSach[cau].d;

    if (chon === dung) {

        diemBan++;

        element.classList.add("correct");

    } else {

        element.classList.add("wrong");

        document.querySelectorAll(".answer")[dung]
        .classList.add("correct");

    }

    document.getElementById("playerScore").innerText =
        diemBan;

    document.getElementById("status").innerText =
        "👤 Bạn đã trả lời! Bot vẫn đang suy nghĩ...";

}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    let dung = danhSach[cau].d;

    document.querySelectorAll(".answer")[dung]
    .classList.add("correct");

    document.getElementById("status").innerText =
        "⏰ Bạn hết thời gian! Bot vẫn đang suy nghĩ...";

}

function botTraLoi() {

    if (botDaTraLoi) return;

    botDaTraLoi = true;

    let dung = Math.random() < 0.85;

    if (dung) {

        diemBot++;

        document.getElementById("status").innerText =
            "🤖 Bot trả lời đúng!";

    } else {

        document.getElementById("status").innerText =
            "🤖 Bot trả lời sai!";

    }

    document.getElementById("botScore").innerText =
        diemBot;

    timerChuyenCau = setTimeout(() => {

        cau++;

        if (cau >= 20) {

            ketThucTran();

        } else {

            hienThiCau();

        }

    }, 1000);

}

function ketThucTran() {

    clearInterval(timerBan);
    clearTimeout(timerBot);
    clearTimeout(timerChuyenCau);

    document.getElementById("game").style.display =
        "none";

    document.querySelector(".info").style.display =
        "none";

    document.querySelector(".title").style.display =
        "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có cùng số điểm.</p>
        `;

    }

    result.innerHTML = `

        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>⏱ Bạn: 15 giây/câu</p>

        

        <br>

        <button onclick="location.reload()">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='khoi9.html'">
            🏠 Về chọn môn
        </button>

    `;

}

hienThiCau();

</script>

</body>
</html>
