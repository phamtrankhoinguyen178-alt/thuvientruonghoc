<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - Thư viện THCS Quảng Trạch</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b2a88, #ff6a00);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.login-box {
    width: 100%;
    max-width: 550px;
    background: white;
    padding: 45px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

h1 {
    text-align: center;
    color: #0b2a88;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 16px;
    margin-bottom: 20px;
    border: 2px solid #eee;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #0b2a88;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #ff6a00;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.register {
    text-align: center;
    margin-top: 25px;
    color: #777;
}

.register a {
    color: #0b2a88;
    font-weight: bold;
    text-decoration: none;
}

.home {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #777;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>🔑 Đăng nhập</h1>

    <p class="subtitle">
        Thư viện THCS Quảng Trạch
    </p>

    <form id="loginForm">

        <label>Email</label>
        <input type="email" id="email" placeholder="Nhập email" required>

        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" required>

        <button type="submit">Đăng nhập</button>

    </form>

    <p class="register">
        Chưa có tài khoản?
        <a href="dangky.html">Đăng ký</a>
    </p>

    <a href="index.html" class="home">
        ← Quay về trang chủ
    </a>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    let accounts = JSON.parse(localStorage.getItem("accounts")) || [];

    let account = accounts.find(
        acc => acc.email === email && acc.password === password
    );

    if (account) {

        localStorage.setItem("currentUser", JSON.stringify(account));

        alert("✅ Đăng nhập thành công!");

        window.location.href = "index.html";

    } else {

        alert("❌ Email hoặc mật khẩu không đúng!");

    }

});
</script>

</body>
</html>
