<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lịch Sử và Địa Lý KHỐI 9 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_lsdl_khoi9_de.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ Lịch Sử và Địa Lý KHỐI 9 - CHẾ ĐỘ DỄ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
{
        q: "Đảng Cộng sản Việt Nam được thành lập vào ngày nào?",
        a: ["3/2/1930", "19/5/1941", "2/9/1945", "19/8/1945"],
        d: 0
    },

    {
        q: "Việt Nam có bao nhiêu vùng kinh tế - xã hội theo cách phân vùng hiện hành?",
        a: ["5 vùng", "6 vùng", "7 vùng", "8 vùng"],
        d: 1
    },

    {
        q: "Cách mạng tháng Tám năm 1945 diễn ra thắng lợi vào thời gian nào?",
        a: ["Tháng 5/1945", "Tháng 7/1945", "Tháng 8/1945", "Tháng 12/1945"],
        d: 2
    },

    {
        q: "Vùng nào ở Việt Nam có diện tích trồng lúa lớn và sản lượng lúa hàng đầu cả nước?",
        a: ["Trung du và miền núi Bắc Bộ", "Tây Nguyên", "Đông Nam Bộ", "Đồng bằng sông Cửu Long"],
        d: 3
    },

    {
        q: "Ai là người đọc bản Tuyên ngôn Độc lập ngày 2/9/1945?",
        a: ["Hồ Chí Minh", "Võ Nguyên Giáp", "Phạm Văn Đồng", "Trường Chinh"],
        d: 0
    },

    {
        q: "Vùng nào có thế mạnh nổi bật về trồng cây công nghiệp lâu năm như cà phê, cao su?",
        a: ["Đồng bằng sông Hồng", "Tây Nguyên", "Đồng bằng sông Cửu Long", "Duyên hải Bắc Bộ"],
        d: 1
    },

    {
        q: "Chiến thắng Điện Biên Phủ diễn ra vào năm nào?",
        a: ["1945", "1950", "1954", "1975"],
        d: 2
    },

    {
        q: "Thành phố nào là trung tâm kinh tế lớn nhất ở phía Nam Việt Nam?",
        a: ["Đà Nẵng", "Cần Thơ", "Huế", "Thành phố Hồ Chí Minh"],
        d: 3
    },

    {
        q: "Chiến dịch Hồ Chí Minh toàn thắng vào ngày nào?",
        a: ["30/4/1975", "2/9/1945", "7/5/1954", "19/8/1945"],
        d: 0
    },

    {
        q: "Vùng nào có hai trung tâm kinh tế lớn là Hà Nội và Hải Phòng?",
        a: ["Tây Nguyên", "Đồng bằng sông Hồng", "Đông Nam Bộ", "Bắc Trung Bộ"],
        d: 1
    },

    {
        q: "Nước Việt Nam Dân chủ Cộng hòa ra đời vào năm nào?",
        a: ["1930", "1941", "1945", "1954"],
        d: 2
    },

    {
        q: "Loại hình giao thông vận tải nào giữ vai trò quan trọng trong vận chuyển hàng hóa ở nước ta?",
        a: ["Đường hàng không", "Đường sắt", "Đường biển", "Đường bộ"],
        d: 3
    },

    {
        q: "Phong trào Đồng khởi bùng nổ mạnh mẽ vào năm nào?",
        a: ["1960", "1954", "1968", "1972"],
        d: 0
    },

    {
        q: "Vùng biển Việt Nam thuộc biển nào?",
        a: ["Biển Đỏ", "Biển Đông", "Biển Đen", "Biển Ca-ri-bê"],
        d: 1
    },

    {
        q: "Hiệp định Giơ-ne-vơ về Đông Dương được kí kết vào năm nào?",
        a: ["1945", "1950", "1954", "1973"],
        d: 2
    },

    {
        q: "Ngành kinh tế nào cung cấp nguyên liệu cho nhiều ngành công nghiệp?",
        a: ["Du lịch", "Thương mại", "Dịch vụ", "Nông nghiệp"],
        d: 3
    },

    {
        q: "Đại thắng mùa Xuân năm 1975 đã giải phóng hoàn toàn miền Nam vào ngày nào?",
        a: ["30/4/1975", "2/9/1945", "7/5/1954", "19/8/1945"],
        d: 0
    },

    {
        q: "Vùng nào của nước ta có thế mạnh về thủy điện nhờ địa hình cao và nhiều sông lớn?",
        a: ["Đồng bằng sông Hồng", "Trung du và miền núi Bắc Bộ", "Đồng bằng sông Cửu Long", "Đông Nam Bộ"],
        d: 1
    },

    {
        q: "Việt Nam chính thức gia nhập ASEAN vào năm nào?",
        a: ["1986", "1990", "1995", "2000"],
        d: 2
    },

    {
        q: "Đồng bằng nào lớn nhất Việt Nam?",
        a: ["Đồng bằng sông Hồng", "Đồng bằng Thanh Hóa", "Đồng bằng sông Mã", "Đồng bằng sông Cửu Long"],
        d: 3
    },
];
let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
       
        <br>
        <button onclick="location.href='capdo_lsdl_khoi9_de.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_lsdl_khoi9.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
