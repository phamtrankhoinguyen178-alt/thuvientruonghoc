
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 6 - Khó</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #3b0764, #7f1d1d, #111827);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: #facc15;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
    color: #222;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover:not(:disabled) {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer:disabled {
    cursor: not-allowed;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.result p {
    font-size: 19px;
}

.win {
    color: #2ecc71 !important;
}

.lose {
    color: #e74c3c !important;
}

.draw {
    color: #f39c12 !important;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #581c87;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #7e22ce;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_van_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">
        👤 Bạn: <span id="playerScore">0</span>
    </div>

    <div class="time">
        ⏱ <span id="timer">15</span>
    </div>

    <div class="bot">
        🤖 Bot: <span id="botScore">0</span>
    </div>
</div>

<div class="main">

    <div class="title">
        🔥 NGỮ VĂN 6 - CẤP ĐỘ KHÓ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi=[
{
        question: "Trong câu 'Những bông hoa đang khoe sắc', từ nào là danh từ?",
        answers: [
            "Hoa",
            "Đang",
            "Khoe",
            "Sắc"
        ],
        correct: 0
    },
    {
        question: "Trong câu 'Bạn Lan học bài chăm chỉ', từ nào là động từ?",
        answers: [
            "Bạn",
            "Học",
            "Chăm chỉ",
            "Lan"
        ],
        correct: 1
    },
    {
        question: "Trong câu 'Bầu trời xanh thẳm', từ nào là tính từ?",
        answers: [
            "Bầu",
            "Trời",
            "Xanh thẳm",
            "Cả câu"
        ],
        correct: 2
    },
    {
        question: "Câu nào sau đây sử dụng biện pháp so sánh?",
        answers: [
            "Mặt trời mọc ở phía đông",
            "Chim hót trên cành",
            "Gió thổi nhè nhẹ",
            "Mặt hồ phẳng lặng như tấm gương"
        ],
        correct: 3
    },
    {
        question: "Câu nào sau đây sử dụng biện pháp nhân hóa?",
        answers: [
            "Ông mặt trời thức dậy sau rặng núi",
            "Mặt trời rất nóng",
            "Trời hôm nay có mây",
            "Nước biển xanh"
        ],
        correct: 0
    },
    {
        question: "Từ nào sau đây là từ láy?",
        answers: [
            "Bàn ghế",
            "Lung linh",
            "Sách vở",
            "Nhà cửa"
        ],
        correct: 1
    },
    {
        question: "Từ nào sau đây là từ ghép?",
        answers: [
            "Lấp lánh",
            "Rì rào",
            "Quần áo",
            "Lung linh"
        ],
        correct: 2
    },
    {
        question: "Từ nào sau đây là từ đơn?",
        answers: [
            "Học sinh",
            "Nhà cửa",
            "Lấp lánh",
            "Bút"
        ],
        correct: 3
    },
    {
        question: "Câu nào sau đây có trạng ngữ chỉ thời gian?",
        answers: [
            "Sáng nay, em đi học",
            "Em học bài chăm chỉ",
            "Bạn Lan rất vui",
            "Cây bàng xanh tốt"
        ],
        correct: 0
    },
    {
        question: "Câu nào sau đây có trạng ngữ chỉ nơi chốn?",
        answers: [
            "Hôm qua, em về quê",
            "Trên sân trường, các bạn đang vui chơi",
            "Vì trời mưa, em nghỉ học",
            "Để đạt điểm tốt, em chăm chỉ học"
        ],
        correct: 1
    },
    {
        question: "Trong câu 'Vì trời mưa nên đường trơn', cụm từ nào chỉ nguyên nhân?",
        answers: [
            "Đường trơn",
            "Nên",
            "Vì trời mưa",
            "Trơn"
        ],
        correct: 2
    },
    {
        question: "Câu nào sau đây là câu có đầy đủ chủ ngữ và vị ngữ?",
        answers: [
            "Trong khu vườn",
            "Một buổi sáng đẹp trời",
            "Trên cành cây cao",
            "Những chú chim đang hót líu lo"
        ],
        correct: 3
    },
    {
        question: "Trong câu 'Những chú mèo nhỏ đang ngủ', chủ ngữ là gì?",
        answers: [
            "Những chú mèo nhỏ",
            "Đang ngủ",
            "Chú mèo",
            "Ngủ"
        ],
        correct: 0
    },
    {
        question: "Trong câu 'Mẹ em là giáo viên', vị ngữ là gì?",
        answers: [
            "Mẹ em",
            "Là giáo viên",
            "Em",
            "Giáo viên"
        ],
        correct: 1
    },
    {
        question: "Câu nào sau đây có sử dụng từ đồng nghĩa?",
        answers: [
            "Cao và thấp",
            "Nóng và lạnh",
            "Chăm chỉ và siêng năng",
            "Vui và buồn"
        ],
        correct: 2
    },
    {
        question: "Cặp từ nào sau đây là từ trái nghĩa?",
        answers: [
            "Xinh đẹp - đẹp đẽ",
            "Siêng năng - chăm chỉ",
            "Dũng cảm - gan dạ",
            "Chăm chỉ - lười biếng"
        ],
        correct: 3
    },
    {
        question: "Khi viết bài văn kể lại một trải nghiệm, em cần chú ý điều gì?",
        answers: [
            "Kể theo trình tự hợp lí và nêu cảm xúc, suy nghĩ",
            "Chỉ liệt kê tên nhân vật",
            "Không cần kể sự việc",
            "Chỉ viết một câu"
        ],
        correct: 0
    },
    {
        question: "Khi viết đoạn văn nêu cảm nghĩ về một bài thơ, em nên làm gì?",
        answers: [
            "Chỉ chép lại bài thơ",
            "Nêu cảm xúc và chỉ ra hình ảnh, từ ngữ gây ấn tượng",
            "Chỉ kể tiểu sử tác giả",
            "Không cần nhắc đến nội dung bài thơ"
        ],
        correct: 1
    },
    {
        question: "Khi tóm tắt một văn bản, điều quan trọng nhất là gì?",
        answers: [
            "Thêm nhiều sự việc không có trong truyện",
            "Viết dài hơn văn bản gốc",
            "Giữ lại những sự việc chính và nội dung quan trọng",
            "Chỉ viết tên nhân vật"
        ],
        correct: 2
    },
    {
        question: "Khi đọc một văn bản, để xác định chủ đề, em cần làm gì?",
        answers: [
            "Chỉ nhìn vào độ dài văn bản",
            "Đếm số câu",
            "Chỉ đọc câu cuối",
            "Xác định vấn đề chính mà văn bản muốn thể hiện"
        ],
        correct: 3
    },
];

let ds = [...cauHoi]
    .sort(() => Math.random() - 0.75)
    .slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let tg = 15;
let timer;
let daTraLoi = false;

function hienThiCau() {

    clearInterval(timer);

    daTraLoi = false;
    tg = 15;

    document.getElementById("timer").textContent = tg;

    document.getElementById("playerScore").textContent = diemBan;
    document.getElementById("botScore").textContent = diemBot;

    document.getElementById("number").textContent = cau + 1;

    let c = ds[cau];

    document.getElementById("question").textContent =
        "Câu " + (cau + 1) + "/10: " + c.q;

    document.getElementById("answers").innerHTML =
        c.a.map((x, j) => `
            <button class="answer" onclick="traLoi(${j}, this)">
                ${String.fromCharCode(65 + j)}. ${x}
            </button>
        `).join("");

    timer = setInterval(() => {

        tg--;

        document.getElementById("timer").textContent = tg;

        if (tg <= 0) {
            hetThoiGian();
        }

    }, 1000);
}

function traLoi(chon, el) {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timer);

    let c = ds[cau];

    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    if (chon === c.d) {

        diemBan++;

        el.classList.add("correct");

    } else {

        el.classList.add("wrong");

        nut[c.d].classList.add("correct");

    }

    document.getElementById("playerScore").textContent = diemBan;

    setTimeout(botTraLoi, 700);
}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timer);

    let c = ds[cau];

    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    nut[c.d].classList.add("correct");

    setTimeout(botTraLoi, 700);
}

function botTraLoi() {

    let dung = Math.random() < 0.75;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").textContent = diemBot;

    cau++;

    if (cau >= 10) {

        ketThucTran();

    } else {

        hienThiCau();

    }
}

function ketThucTran() {

    clearInterval(timer);

    document.getElementById("game").style.display = "none";

    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">🤖 BOT THẮNG!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;

    }

    result.innerHTML = `
        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>🔥 Cấp độ: KHÓ</p>

        

        <br>

        <button onclick="location.reload()">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='capdo_van_khoi6.html'">
            🎚️ Chọn cấp độ
        </button>

        <button onclick="location.href='khoi6.html'">
            🏠 Về chọn môn
        </button>
    `;
}

hienThiCau();

</script>

</body>
</html>
