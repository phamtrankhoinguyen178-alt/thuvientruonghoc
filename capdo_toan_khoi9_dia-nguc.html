
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toán Khối 9 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_toan_khoi9.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>

    <div class="time">
        ⏱ <span id="timer">15</span>
    </div>

    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        🔥 TOÁN KHỐI 9 - CHẾ ĐỘ BẤT TỬ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [
    {
        q: "Giải phương trình x² - 10x + 21 = 0.",
        a: ["x = 3 và 7", "x = 2 và 8", "x = 1 và 9", "x = -3 và -7"],
        d: 0
    },
    {
        q: "Phương trình 2x² - 7x + 3 = 0 có nghiệm nào?",
        a: ["x = 1 và 3", "x = 1/2 và 3", "x = -1/2 và 3", "x = 2 và 3"],
        d: 1
    },
    {
        q: "Tìm giá trị m để phương trình x² - 4x + m = 0 có hai nghiệm phân biệt.",
        a: ["m > 4", "m = 4", "m < 4", "m ≥ 4"],
        d: 2
    },
    {
        q: "Tính tổng hai nghiệm của phương trình 3x² - 12x + 5 = 0.",
        a: ["2", "3", "4", "5"],
        d: 2
    },
    {
        q: "Tính tích hai nghiệm của phương trình 2x² + 5x - 3 = 0.",
        a: ["-3/2", "3/2", "5/2", "-5/2"],
        d: 0
    },
    {
        q: "Cho phương trình x² - 2(m + 1)x + m² + 1 = 0. Biệt thức Δ bằng bao nhiêu?",
        a: ["4m", "8m", "4m²", "8m²"],
        d: 1
    },
    {
        q: "Tìm m để phương trình x² - 2x + m = 0 có nghiệm kép.",
        a: ["m = 0", "m = 1", "m = 2", "m = -1"],
        d: 1
    },
    {
        q: "Cho parabol y = 2x². Khi x = -3 thì y bằng bao nhiêu?",
        a: ["12", "15", "18", "21"],
        d: 2
    },
    {
        q: "Hai đường thẳng y = (m - 1)x + 2 và y = 3x - 5 song song khi nào?",
        a: ["m = 2", "m = 3", "m = 4", "m = 5"],
        d: 2
    },
    {
        q: "Giải hệ phương trình: 3x + 2y = 16; x - y = 2.",
        a: ["x = 4; y = 2", "x = 3; y = 1", "x = 5; y = 3", "x = 2; y = 4"],
        d: 0
    },
    {
        q: "Rút gọn biểu thức √75 + √108 - √12.",
        a: ["7√3", "8√3", "9√3", "10√3"],
        d: 1
    },
    {
        q: "Giải phương trình √(x + 5) = 4.",
        a: ["x = 9", "x = 10", "x = 11", "x = 12"],
        d: 2
    },
    {
        q: "Một tam giác vuông có cạnh huyền 17 cm và một cạnh góc vuông 8 cm. Cạnh còn lại bằng bao nhiêu?",
        a: ["12 cm", "13 cm", "14 cm", "15 cm"],
        d: 3
    },
    {
        q: "Cho tam giác vuông có sin α = 5/13. Tính cos α, biết α là góc nhọn.",
        a: ["12/13", "5/12", "13/12", "8/13"],
        d: 0
    },
    {
        q: "Một đường tròn có bán kính 10 cm. Độ dài cung 90° là bao nhiêu?",
        a: ["2π cm", "5π cm", "10π cm", "20π cm"],
        d: 1
    },
    {
        q: "Góc nội tiếp chắn cung 140° có số đo bao nhiêu?",
        a: ["50°", "60°", "70°", "140°"],
        d: 2
    },
    {
        q: "Một hình trụ có bán kính 3 cm và chiều cao 7 cm. Thể tích bằng bao nhiêu?",
        a: ["21π cm³", "42π cm³", "63π cm³", "81π cm³"],
        d: 2
    },
    {
        q: "Một hình nón có bán kính đáy 6 cm, chiều cao 8 cm. Đường sinh bằng bao nhiêu?",
        a: ["8 cm", "9 cm", "10 cm", "12 cm"],
        d: 2
    },
    {
        q: "Giải phương trình x² - 5x - 14 = 0.",
        a: ["x = 7 và -2", "x = 2 và -7", "x = 1 và -14", "x = 5 và -2"],
        d: 0
    },
    {
        q: "Tìm m để phương trình x² - 2x + m = 0 vô nghiệm thực.",
        a: ["m < 1", "m = 1", "m > 1", "m ≤ 1"],
        d: 2
    },
    {
        q: "Cho hàm số y = ax² đi qua điểm A(2; 12). Giá trị của a là bao nhiêu?",
        a: ["2", "3", "4", "6"],
        d: 1
    },
    {
        q: "Cho phương trình x² - 6x + 5 = 0. Tính tổng bình phương hai nghiệm.",
        a: ["20", "24", "26", "30"],
        d: 2
    },
    {
        q: "Một tam giác vuông có hai cạnh góc vuông là 9 cm và 12 cm. Bán kính đường tròn ngoại tiếp tam giác bằng bao nhiêu?",
        a: ["6,5 cm", "7,5 cm", "8 cm", "10 cm"],
        d: 1
    }
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {

    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {

        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }

    }, 1000);
}

function traLoi(chon, element) {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");

        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {

    if (!daTraLoi) {

        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {

    let dung = Math.random() < 0.95;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {

    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Không thể tin được! Bạn đã đánh bại Bot BẤT TỬ!</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot BẤT TỬ đã chiến thắng!</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Bạn đã ngang tài với Bot BẤT TỬ!</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        

        <br>

        <button onclick="location.href='capdo_toan_khoi9_dia-nguc.html'">
            Chơi lại
        </button>

        <button onclick="location.href='khoi9.html'">
            Về chọn môn
        </button>
    `;
}

hienThiCau();

</script>

</body>
</html>
