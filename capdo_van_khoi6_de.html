<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 6 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_van_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>

    <div class="time">
        ⏱ <span id="timer">15</span>
    </div>

    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        📚 NGỮ VĂN 6 - CẤP ĐỘ DỄ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [
{

    {

        answers: [

            "Cuộc sống của các loài động vật",
            "Những câu chuyện hài hước"
        ],

    },
    {
        question: "Truyện cổ tích thường có yếu tố nào?",
        answers: [
            "Số liệu khoa học",

            "Yếu tố kì ảo",

        ],
        correct: 2
    },
    {
        question: "Thơ lục bát gồm những dòng thơ có số tiếng như thế nào?",
        answers: [
            "4 tiếng và 4 tiếng",
            "5 tiếng và 5 tiếng",
            "6 tiếng và 6 tiếng",
            "6 tiếng và 8 tiếng"
        ],
        correct: 3
    },
    {
        question: "Nhân vật chính trong truyện Bài học đường đời đầu tiên là ai?",
        answers: [
            "Dế Mèn",
            "Dế Choắt",
            "Chị Cốc",
            "Bọ Ngựa"
        ],
        correct: 0
    },
    {
        question: "Tác giả của văn bản Bài học đường đời đầu tiên là ai?",
        answers: [
            "Nguyễn Nhật Ánh",
            "Tô Hoài",
            "Nam Cao",
            "Nguyễn Du"
        ],
        correct: 1
    },
    {
        question: "Văn bản Thánh Gióng thuộc thể loại nào?",
        answers: [
            "Truyện ngắn",
            "Truyện cười",
            "Truyền thuyết",
            "Truyện đồng thoại"
        ],
        correct: 2
    },
    {
        question: "Nhân vật Thánh Gióng có khả năng đặc biệt nào?",
        answers: [
            "Biết bay từ khi mới sinh",
            "Có thể biến thành cá",
            "Có thể điều khiển thời tiết",

        ],

    },
    {

        answers: [
            "Lũ lụt",

        ],

    {

        answers: [

            "Quang Trung",

            "Ngô Quyền"
        ],

    {

        answers: [

        ],
        correct: 3
    },
    {

        answers: [

        ],
        correct: 0
    },
    {
        question: "Văn bản Vừa nhắm mắt vừa mở cửa sổ của tác giả nào?",
        answers: [
            "Tô Hoài",
            "Nguyễn Ngọc Thuần",

            "Võ Quảng"
        ],
        correct: 1
    },
    {
        question: "Từ đơn là từ như thế nào?",
        answers: [
            "Gồm ba tiếng trở lên",
            "Gồm hai tiếng có nghĩa",
            "Chỉ gồm một tiếng",
            "Luôn có hai âm tiết"
        ],
        correct: 2
    },
    {
        question: "Từ phức được chia thành những loại nào?",
        answers: [
            "Từ đơn và từ mượn",
            "Danh từ và động từ",
            "Tính từ và số từ",
            "Từ ghép và từ láy"
        ],
        correct: 3
    },
    {
        question: "Danh từ là những từ dùng để gọi tên gì?",
        answers: [
            "Người, vật, hiện tượng, khái niệm",
            "Hoạt động",
            "Đặc điểm",
            "Cảm xúc בלבד"
        ],
        correct: 0
    },
    {
        question: "Động từ là những từ chỉ gì?",
        answers: [
            "Tên người",
            "Hoạt động, trạng thái",
            "Đặc điểm",
            "Số lượng"
        ],
        correct: 1
    },
    {
        question: "Tính từ thường dùng để chỉ gì?",
        answers: [
            "Tên sự vật",
            "Hoạt động",
            "Đặc điểm, tính chất",
            "Số thứ tự"
        ],
        correct: 2
    },
    {
        question: "Một bài văn kể lại trải nghiệm thường có mấy phần chính?",
        answers: [
            "Một phần",
            "Hai phần",
            "Bốn phần",
            "Ba phần"
        ],
        correct: 3
    },

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {

    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;
        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {

    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    clearInterval(timer);

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {

    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {

    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>Bot có 25% xác suất trả lời đúng mỗi câu.</p>

        <br>

        <button onclick="location.href='capdo_van_khoi6.html'">
            Chơi lại
        </button>

        <button onclick="location.href='khoi6.html'">
            Về chọn môn
        </button>
    `;
}

hienThiCau();

</script>

</body>
</html>
