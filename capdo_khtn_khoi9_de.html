<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHTN KHỐI 9 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover:not(:disabled) {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer:disabled {
    cursor: not-allowed;
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_khtn_khoi9.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ KHTN KHỐI 9 - CHẾ ĐỘ DỄ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
{
    q: "Công cơ học được thực hiện khi nào?",
    a: [
        "Khi có lực tác dụng và vật dịch chuyển theo hướng có thành phần của lực",
        "Khi vật đứng yên",
        "Khi không có lực tác dụng",
        "Khi vật chỉ thay đổi màu sắc"
    ],
    d: 0
},
{
    q: "Đơn vị của công cơ học trong hệ SI là gì?",
    a: ["Newton", "Jun (J)", "Watt", "Pascal"],
    d: 1
},
{
    q: "Công suất cho biết điều gì?",
    a: [
        "Khối lượng của vật",
        "Thời gian chuyển động",
        "Tốc độ thực hiện công",
        "Thể tích của vật"
    ],
    d: 2
},
{
    q: "Đơn vị của công suất là gì?",
    a: ["Watt (W)", "Newton (N)", "Mét (m)", "Kilogram (kg)"],
    d: 0
},
{
    q: "Khi ánh sáng truyền từ không khí vào nước, hiện tượng nào có thể xảy ra?",
    a: ["Phản xạ toàn phần", "Khúc xạ ánh sáng", "Đông đặc", "Bay hơi"],
    d: 1
},
{
    q: "Thấu kính hội tụ có đặc điểm nào sau đây?",
    a: [
        "Phần rìa dày hơn phần giữa",
        "Có thể làm chùm tia tới song song hội tụ",
        "Luôn tạo ảnh ảo",
        "Không làm thay đổi đường truyền ánh sáng"
    ],
    d: 1
},
{
    q: "Thấu kính phân kì có đặc điểm nào?",
    a: [
        "Phần giữa dày hơn phần rìa",
        "Luôn hội tụ chùm tia song song",
        "Phần giữa mỏng hơn phần rìa",
        "Không cho ánh sáng truyền qua"
    ],
    d: 2
},
{
    q: "Đơn vị của điện trở là gì?",
    a: ["Volt", "Ampe", "Ôm", "Watt"],
    d: 2
},
{
    q: "Công thức định luật Ohm là gì?",
    a: ["I = U/R", "U = I/R", "R = U.I", "I = U.R"],
    d: 0
},
{
    q: "Dụng cụ dùng để đo cường độ dòng điện là gì?",
    a: ["Vôn kế", "Ampe kế", "Nhiệt kế", "Lực kế"],
    d: 1
},
{
    q: "Trong đoạn mạch nối tiếp, cường độ dòng điện có đặc điểm gì?",
    a: [
        "Bằng nhau tại mọi vị trí",
        "Luôn bằng 0",
        "Tăng dần qua mỗi điện trở",
        "Khác nhau hoàn toàn"
    ],
    d: 0
},
{
    q: "Trong đoạn mạch song song, hiệu điện thế giữa hai đầu các nhánh có đặc điểm gì?",
    a: [
        "Luôn bằng 0",
        "Bằng nhau",
        "Luôn khác nhau",
        "Không xác định được"
    ],
    d: 1
},
{
    q: "Kim loại nào sau đây phản ứng mạnh với nước ở điều kiện thường?",
    a: ["Đồng", "Vàng", "Natri", "Bạc"],
    d: 2
},
{
    q: "Công thức hóa học của sulfuric acid là gì?",
    a: ["HCl", "H2SO4", "HNO3", "NaOH"],
    d: 1
},
{
    q: "Dung dịch acid làm quỳ tím chuyển sang màu gì?",
    a: ["Xanh", "Đỏ", "Vàng", "Không đổi màu"],
    d: 1
},
{
    q: "Chất nào sau đây là oxide?",
    a: ["NaCl", "HCl", "CO2", "NaOH"],
    d: 2
},
{
    q: "Kim loại nào thường được dùng làm dây dẫn điện?",
    a: ["Đồng", "Lưu huỳnh", "Than", "Nhựa"],
    d: 0
},
{
    q: "Đơn vị cấu tạo cơ bản của cơ thể sống là gì?",
    a: ["Cơ quan", "Mô", "Tế bào", "Hệ cơ quan"],
    d: 2
},
{
    q: "DNA có vai trò chủ yếu nào?",
    a: [
        "Dự trữ nước",
        "Lưu giữ và truyền đạt thông tin di truyền",
        "Vận chuyển oxygen trong máu",
        "Tiêu hóa thức ăn"
    ],
    d: 1
},
{
    q: "Hiện tượng di truyền là gì?",
    a: [
        "Sự biến đổi thời tiết",
        "Sự truyền đạt các đặc điểm từ thế hệ trước sang thế hệ sau",
        "Sự thay đổi trạng thái của nước",
        "Sự sinh trưởng của cây"
    ],
    d: 1
}
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <button class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </button>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;
    let buttons = document.querySelectorAll(".answer");

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        buttons[dung].classList.add("correct");
    }

    buttons.forEach(btn => btn.disabled = true);

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        let buttons = document.querySelectorAll(".answer");
        buttons[danhSach[cau].d].classList.add("correct");

        buttons.forEach(btn => btn.disabled = true);
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
       
        <br>
        <button onclick="location.href='capdo_khtn_khoi9_de.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_khtn_khoi9.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
