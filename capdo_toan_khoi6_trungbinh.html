<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toán 6 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.top {
    background: white;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.bot-time {
    background: #e74c3c;
    color: white;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.main {
    max-width: 900px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.status {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    font-size: 38px;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result h2 {
    margin: 12px;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

@media(max-width:600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 15px;
    }

    .title {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="top">

    <div class="player">
        👤 Bạn: <span id="playerScore">0</span>
    </div>

    <div class="time">
        ⏱ Bạn: <span id="timer">15</span>s
    </div>

    <div class="bot">
        🤖 Bot: <span id="botScore">0</span>
    </div>

    <div class="bot-time">
        ⏱ Bot: <span id="botTimer">10</span>s
    </div>

</div>

<div class="main">

    <div class="title">
        ⚔️ TOÁN KHỐI 6 - TRUNG BÌNH
    </div>

    <div id="game" class="card">

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="status" id="status">
            🤖 Bot đang suy nghĩ...
        </div>

    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [
    {
        q: "(-15) + 27 = ?",
        a: ["10", "12", "14", "42"],
        d: 1
    },
    {
        q: "(-8) × (-6) = ?",
        a: ["-48", "42", "48", "-14"],
        d: 2
    },
    {
        q: "Tính: 3/4 + 5/8 = ?",
        a: ["8/12", "11/8", "10/8", "13/8"],
        d: 1
    },
    {
        q: "ƯCLN(36, 48) = ?",
        a: ["6", "8", "12", "16"],
        d: 2
    },
    {
        q: "BCNN(8, 12) = ?",
        a: ["16", "20", "24", "36"],
        d: 2
    },
    {
        q: "Tìm x: 3x + 7 = 25",
        a: ["4", "5", "6", "7"],
        d: 2
    },
    {
        q: "Một hình chữ nhật có chiều dài 12 cm và chiều rộng 7 cm. Chu vi là?",
        a: ["19 cm", "38 cm", "84 cm", "42 cm"],
        d: 1
    },
    {
        q: "Tính: 2² + 3³ = ?",
        a: ["13", "27", "31", "35"],
        d: 2
    },
    {
        q: "Số nào sau đây chia hết cho cả 2, 3 và 5?",
        a: ["120", "125", "132", "145"],
        d: 0
    },
    {
        q: "Tính: 5/6 - 1/4 = ?",
        a: ["1/2", "7/12", "2/3", "3/8"],
        d: 1
    },
    {
        q: "Một lớp có 40 học sinh, 3/5 số học sinh là nữ. Có bao nhiêu học sinh nam?",
        a: ["16", "20", "24", "25"],
        d: 0
    },
    {
        q: "Tìm x: 5x - 10 = 30",
        a: ["4", "6", "8", "10"],
        d: 2
    },
    {
        q: "Phân tích 84 thành thừa số nguyên tố là?",
        a: ["2² × 3 × 7", "2 × 3² × 7", "2² × 7", "2 × 3 × 14"],
        d: 0
    },
    {
        q: "Một góc có số đo 65°. Góc bù với góc đó có số đo?",
        a: ["25°", "105°", "115°", "125°"],
        d: 2
    },
    {
        q: "Diện tích hình vuông có cạnh 9 cm là?",
        a: ["18 cm²", "36 cm²", "72 cm²", "81 cm²"],
        d: 3
    },
    {
        q: "Tính: (-3)² + (-4)² = ?",
        a: ["-25", "7", "25", "-7"],
        d: 2
    },
    {
        q: "Nếu x/5 = 7 thì x bằng?",
        a: ["12", "25", "30", "35"],
        d: 3
    },
    {
        q: "Một số chia cho 6 dư 2. Số nào sau đây có thể là số đó?",
        a: ["20", "21", "24", "30"],
        d: 0
    },
    {
        q: "Tổng của ba số tự nhiên liên tiếp là 36. Số lớn nhất là?",
        a: ["11", "12", "13", "14"],
        d: 2
    },
    {
        q: "Một mảnh đất hình chữ nhật có diện tích 96 m² và chiều rộng 8 m. Chiều dài là?",
        a: ["10 m", "12 m", "14 m", "16 m"],
        d: 1
    }
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);

danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;

let thoiGianBan = 15;
let thoiGianBot = 10;

let timerBan;
let timerBot;

let daTraLoi = false;
let botDaTraLoi = false;

function hienThiCau() {

    daTraLoi = false;
    botDaTraLoi = false;

    thoiGianBan = 15;
    thoiGianBot = 10;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = 15;
    document.getElementById("botTimer").innerText = 10;

    document.getElementById("question").innerText =
        danhSach[cau].q;

    document.getElementById("status").innerText =
        "🤖 Bot đang suy nghĩ...";

    let html = "";

    danhSach[cau].a.forEach((x, i) => {

        html += `
        <div class="answer" onclick="traLoi(${i}, this)">
            ${String.fromCharCode(65 + i)}. ${x}
        </div>
        `;

    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timerBan);
    clearInterval(timerBot);

    timerBan = setInterval(() => {

        thoiGianBan--;

        document.getElementById("timer").innerText =
            thoiGianBan;

        if (thoiGianBan <= 0) {

            clearInterval(timerBan);

            hetThoiGian();

        }

    }, 1000);

    timerBot = setInterval(() => {

        thoiGianBot--;

        document.getElementById("botTimer").innerText =
            thoiGianBot;

        if (thoiGianBot <= 0) {

            clearInterval(timerBot);

            botTraLoi();

        }

    }, 1000);
}

function traLoi(chon, element) {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timerBan);

    let dung = danhSach[cau].d;

    if (chon === dung) {

        diemBan++;

        element.classList.add("correct");

    } else {

        element.classList.add("wrong");

        document.querySelectorAll(".answer")[dung]
        .classList.add("correct");

    }

    document.getElementById("playerScore").innerText =
        diemBan;

    document.getElementById("status").innerText =
        "👤 Bạn đã trả lời! Bot vẫn đang suy nghĩ...";

}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    let dung = danhSach[cau].d;

    document.querySelectorAll(".answer")[dung]
    .classList.add("correct");

    document.getElementById("status").innerText =
        "⏰ Bạn hết thời gian! Bot vẫn đang suy nghĩ...";

}

function botTraLoi() {

    if (botDaTraLoi) return;

    botDaTraLoi = true;

    let dung = Math.random() < 0.5;

    if (dung) {

        diemBot++;

        document.getElementById("status").innerText =
            "🤖 Bot trả lời đúng!";

    } else {

        document.getElementById("status").innerText =
            "🤖 Bot trả lời sai!";

    }

    document.getElementById("botScore").innerText =
        diemBot;

    setTimeout(() => {

        cau++;

        if (cau >= 10) {

            ketThucTran();

        } else {

            hienThiCau();

        }

    }, 1000);
}

function ketThucTran() {

    clearInterval(timerBan);
    clearInterval(timerBot);

    document.getElementById("game").style.display =
        "none";

    document.querySelector(".info").style.display =
        "none";

    document.querySelector(".title").style.display =
        "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có cùng số điểm.</p>
        `;

    }

    result.innerHTML = `

        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>⏱ Bạn: 15 giây/câu</p>

        <p>🤖 Bot: 10 giây/câu</p>

        <p>🎯 Bot có 50% xác suất trả lời đúng</p>

        <br>

        <button onclick="location.href='capdo_toan_khoi6.html'">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='khoi6.html'">
            🏠 Về chọn môn
        </button>

    `;
}

hienThiCau();

</script>

</body>
</html>
