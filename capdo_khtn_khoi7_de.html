<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHTN KHỐI 7 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_khtn_khoi7.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ KHTN KHỐI 7 - CHẾ ĐỘ DỄ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
    {
        q: "Chọn đáp án sai về từ trường Trái Đất.",
        a: ["Trái Đất là một nam châm khổng lồ.", "Ở bên ngoài Trái Đất, đường sức từ trường Trái Đất có chiều đi từ Nam bán cầu đến Bắc bán cầu.", "Cực Bắc địa lí và cực Bắc địa từ không trùng nhau.", "Cực Nam địa lí trùng cực Nam địa từ."],
        d: 3
    },
    {
        q: "Từ trường không tồn tại ở đâu?",
        a: ["Xung quanh nam châm.", "Xung quanh dòng điện.", "Xung quanh Trái Đất.", "Xung quanh điện tích đứng yên."],
        d: 3
    },
    {
        q: "Từ trường Trái Đất mạnh ở",
        a: ["Phía địa cực của Trái Đất.", "Vùng xích đạo của Trái Đất.", "Cực Bắc của Trái Đất.", "Cực Nam của Trái Đất."],
        d: 0
    },
    {
        q: "Vì sao có thể nói rằng Trái Đất giống như một thanh nam châm khổng lồ?",
        a: ["Vì mỗi cực của thanh nam châm tự do luôn hướng về mỗi cực của Trái Đất.", "Vì Trái Đất hút tất cả các vật về phía nó.", "Vì Trái Đất hút các vật bằng sắt về phía nó.", "Vì Trái Đất hút các thanh nam châm về phía nó."],
        d: 0
    },
    {
        q: "Tên từ cực của Trái Đất nằm gần cực Bắc địa lí là",
        a: ["Từ cực Bắc.", "Từ cực Nam.", "Không xác định được.", "Cả hai từ cực Bắc và Nam."],
        d: 1
    },
    {
        q: "Các dòng bức xạ phát ra từ Mặt Trời chiếu xuống Trái Đất bị lệch về phía hai địa cực là do",
        a: ["Chịu tác dụng của từ trường Trái Đất.", "Tác dụng của lực hấp dẫn.", "Chịu tác dụng lực cản của không khí.", "Hướng chiếu sáng của Mặt Trời."],
        d: 0
    },
    {
        q: "Hiện tượng nào sau đây liên quan đến từ trường Trái Đất?",
        a: ["Hiện tượng nhật thực.", "Hiện tượng nguyệt thực.", "Hiện tượng cực quang.", "Hiện tượng thủy triều."],
        d: 2
    },
    {
        q: "Kim nam châm luôn nằm dọc theo một hướng xác định, không trùng với hướng Bắc - Nam. Có thể kết luận không gian tại nơi đó",
        a: ["Có từ trường mạnh hơn từ trường của Trái Đất.", "Không có gì đặc biệt.", "Có sóng Wifi.", "Có sóng truyền hình."],
        d: 0
    },
    {
        q: "Thế nào là quá trình trao đổi chất ở sinh vật?",
        a: ["Là quá trình cơ thể lấy các chất từ môi trường, biến đổi chúng thành các chất cần thiết cho cơ thể và tạo năng lượng cung cấp cho các hoạt động sống, đồng thời trả lại cho môi trường các chất thải.", "Là sự biến đổi năng lượng từ dạng này sang dạng khác.", "Là quá trình cơ thể tổng hợp các chất từ môi trường, biến đổi chúng thành các chất cần thiết cho cơ thể.", "Là quá trình cơ thể phân giải các chất phức tạp thành các chất đơn giản."],
        d: 0
    },
    {
        q: "Chuyển hóa năng lượng là",
        a: ["Sự biến đổi năng lượng từ dạng này sang dạng khác.", "Quá trình cơ thể sinh vật lấy vào các chất từ môi trường.", "Quá trình cơ thể sinh vật thải ra các chất cần thiết ra môi trường.", "Cung cấp năng lượng cho các hoạt động sống của tế bào."],
        d: 0
    },
    {
        q: "Chuyển hóa vật chất và năng lượng có ý nghĩa như thế nào với sinh vật?",
        a: ["Giúp sinh vật phát triển và sinh sản.", "Giúp sinh vật vận động, cảm ứng.", "Giúp sinh vật tồn tại và sinh trưởng, phát triển, sinh sản, cảm ứng và vận động.", "Giúp sinh vật tồn tại, sinh trưởng."],
        d: 2
    },
    {
        q: "Chất nào sau đây là sản phẩm của quá trình trao đổi chất được động vật thải ra môi trường?",
        a: ["Oxygen.", "Carbon dioxide.", "Chất dinh dưỡng.", "Vitamin."],
        d: 1
    },
    {
        q: "Phát biểu nào sau đây không đúng khi nói về vai trò của quá trình trao đổi chất và chuyển hóa năng lượng trong cơ thể?",
        a: ["Cung cấp nguyên liệu cấu tạo nên tế bào và cơ thể.", "Cung cấp năng lượng cho các hoạt động sống của tế bào.", "Sinh ra nhiệt để giải phóng ra ngoài môi trường.", "Cung cấp nguyên liệu thực hiện chức năng của tế bào và cơ thể."],
        d: 2
    },
    {
        q: "Quá trình trao đổi chất và chuyển hóa năng lượng nào sau đây có vai trò cung cấp năng lượng cho cơ thể sinh vật?",
        a: ["Quá trình tổng hợp diệp lục.", "Quá trình phân giải đường trong hô hấp tế bào.", "Quá trình tổng hợp protein cho cơ thể.", "Quá trình tổng hợp tinh bột cho cơ thể."],
        d: 1
    },
    {
        q: "Khí khổng có chức năng:",
        a: ["Giúp thực vật thực hiện quá trình trao đổi khí và thoát hơi nước.", "Giúp thực vật làm mát.", "Giúp thực vật tạo khí Oxygen.", "Giúp thực vật tổng hợp chất hữu cơ."],
        d: 0
    },
    {
        q: "Sự trao đổi khí ở cá với môi trường bên ngoài được thực hiện nhờ cơ quan nào?",
        a: ["Phổi.", "Da.", "Bề mặt cơ thể.", "Mang."],
        d: 3
    },
    {
        q: "Sắp xếp các bộ phận sau theo đúng thứ tự của cơ quan hô hấp ở người: phổi, khí quản, khoang mũi, thanh quản, phế quản.",
        a: ["Khoang mũi, khí quản, thanh quản, phế quản, phổi.", "Khoang mũi, thanh quản, khí quản, phế quản, phổi.", "Khoang mũi, phế quản, khí quản, thanh quản, phổi.", "Khoang mũi, phổi, khí quản, thanh quản, phế quản."],
        d: 1
    },
    {
        q: "Châu chấu trao đổi khí với môi trường ngoài qua bộ phận nào sau đây?",
        a: ["Phổi.", "Da.", "Hệ thống ống khí.", "Mang."],
        d: 2
    },
]
let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
       
        <br>
        <button onclick="location.href='capdo_khtn_khoi7_de.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_khtn_khoi7.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
