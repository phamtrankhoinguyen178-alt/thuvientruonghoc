}

@keyframes twinkle{
from{opacity:.2;transform:scale(.5)}
to{opacity:1;transform:scale(1.5)}

.back{

left:18px;

}

}

h1{

.info{

.game{

padding:22px;
border-radius:28px;

backdrop-filter:blur(12px);

}

.space{
position:relative;

overflow:hidden;

height:115px;

bottom:30px;

0 0 20px #60a5fa,

}

.planet-ring{
position:absolute;
width:180px;
height:45px;
right:22px;
bottom:65px;
border:5px solid rgba(196,181,253,.7);

transform:rotate(-15deg);
}

.spaceship{
position:absolute;
left:55px;
top:125px;

height:110px;

}

from{transform:translateY(-4px) rotate(-1deg)}
to{transform:translateY(5px) rotate(1deg)}
}

left:30px;
top:30px;

height:48px;
background:linear-gradient(180deg,#f8fafc,#94a3b8);

}

height:40px;
background:#e2e8f0;

}

.ship-wing1{
position:absolute;
left:55px;
top:62px;
width:70px;
height:35px;

}

.ship-wing2{
position:absolute;
left:55px;
top:12px;

height:35px;
background:#475569;

}

position:absolute;
left:75px;
top:38px;

height:22px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%,#e0f2fe,#0ea5e9);

z-index:3;

}

.ship-window2{
position:absolute;
left:105px;
top:38px;
width:22px;
height:22px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%,#e0f2fe,#0ea5e9);
border:3px solid #334155;
z-index:3;
box-shadow:0 0 12px #38bdf8;
}

.fire{
position:absolute;
left:0;
top:42px;
width:40px;
height:22px;
background:linear-gradient(90deg,#f97316,#facc15,transparent);
clip-path:polygon(100% 0,0 50%,100% 100%);
animation:fire .2s infinite alternate;
}

@keyframes fire{
from{transform:scaleX(.8)}
to{transform:scaleX(1.2)}
}

.asteroid{
display:none;
position:absolute;
right:80px;
top:125px;
width:130px;
height:130px;
z-index:15;
animation:asteroidMove .7s infinite alternate;
}

.asteroid.show{
display:block;
}

@keyframes asteroidMove{
from{transform:rotate(0deg) translateY(-5px)}
to{transform:rotate(8deg) translateY(5px)}
}

height:100px;

100% 35%,
85% 75%,
60% 100%,
20% 90%,
0 55%,
8% 20%

}

.crater1{

height:18px;

top:30px;
}

.crater2{
width:18px;
height:14px;
left:60px;
top:55px;
}

.crater3{
width:20px;
height:15px;
left:40px;
top:75px;
}

font-weight:bold;
color:white;
cursor:pointer;
background:linear-gradient(135deg,#2563eb,#7c3aed);

0 8px 0 #312e81,
0 15px 30px rgba(0,0,0,.4);
transition:.2s;
}

.start:hover{
transform:translateY(-3px);
box-shadow:

0 18px 35px rgba(0,0,0,.5);
}

.start:active{
transform:translateY(5px);

}

font-size:21px;
font-weight:bold;

color:#e0e7ff;
}

.progress{

height:25px;
padding:3px;
border-radius:30px;
background:rgba(255,255,255,.15);

.progress-bar{
height:100%;

border-radius:30px;

transition:.5s;
}

font-size:20px;
font-weight:bold;
margin-top:15px;

color:#c4b5fd;
}

display:none;

inset:0;

background:rgba(2,6,23,.8);

}

.overlay.show{
display:block;
}

.question-box{
display:none;
position:fixed;
z-index:200;
left:50%;
top:50%;
transform:translate(-50%,-50%) scale(.8);
width:92%;
max-width:730px;
padding:30px;
border-radius:28px;
background:linear-gradient(135deg,#ffffff,#eef2ff);
box-shadow:0 30px 90px rgba(0,0,0,.7);
color:#0f172a;
}

.question-box.show{
display:block;
animation:popup .3s forwards;
}

@keyframes popup{
to{
transform:translate(-50%,-50%) scale(1);
}
}

.question-box h2{

margin-top:0;

color:#4f46e5;
}

.question{
font-size:21px;
font-weight:bold;

}

.answer{
display:block;

padding:15px 18px;
margin:11px 0;
border:2px solid #e2e8f0;
border-radius:14px;
background:#f8fafc;
font-size:18px;
text-align:left;
cursor:pointer;
transition:.2s;
color:#1e293b;
}

.answer:hover{
transform:translateX(5px);
border-color:#6366f1;
background:#eef2ff;
}

.answer.selected{
background:#dbeafe;
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.check{
display:block;
margin:22px auto 0;
padding:14px 36px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:white;
font-size:19px;
font-weight:bold;
cursor:pointer;
box-shadow:0 8px 20px rgba(79,70,229,.35);
}

.result{
display:none;
position:fixed;
z-index:300;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:580px;
padding:45px 30px;
border-radius:30px;
background:white;
text-align:center;
box-shadow:0 30px 90px rgba(0,0,0,.7);
animation:resultShow .4s;
}

@keyframes resultShow{
from{
transform:translate(-50%,-50%) scale(.5);

to{
transform:translate(-50%,-50%) scale(1);
opacity:1;
}
}

.result h2{
font-size:38px;
color:#4f46e5;
margin:0 0 20px;
}

.result.lose h2{
color:#ef4444;
}

.result p{
font-size:21px;
line-height:1.6;
color:#334155;
}

.again{
padding:15px 35px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#f97316,#ef4444);
color:white;
font-size:19px;
font-weight:bold;
cursor:pointer;
}

.correct-effect{
position:fixed;
z-index:1000;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:55px;
font-weight:bold;
color:#38bdf8;
text-shadow:0 0 20px #818cf8;
pointer-events:none;
animation:correctEffect .8s forwards;
}

@keyframes correctEffect{
0%{
transform:translate(-50%,-50%) scale(.4);
opacity:0;
}
40%{
transform:translate(-50%,-50%) scale(1.3);
opacity:1;
}
100%{
transform:translate(-50%,-100%) scale(1);
opacity:0;
}
}

.question-box{
padding:20px;

.question-box h2{
font-size:21px;

.question{
font-size:18px;
}

.answer{
font-size:16px;

.result h2{
font-size:30px;
}

.result p{
font-size:18px;
}

.back{
padding:9px 14px;
font-size:14px;
}
}

let gameQuestions=[];
let currentQuestion=0;
let selectedAnswer=null;
let gameRunning=false;
let waiting=false;
let shipPosition=55;
let shipTimer=null;
let asteroidTimer=null;

function startGame(){

gameRunning=true;
waiting=false;
currentQuestion=0;
selectedAnswer=null;
shipPosition=55;

document.getElementById("spaceship").style.left=shipPosition+"px";
document.getElementById("asteroid").classList.remove("show");
document.getElementById("questionBox").classList.remove("show");
document.getElementById("result").style.display="none";
document.getElementById("overlay").classList.remove("show");
document.getElementById("result").classList.remove("lose");

document.getElementById("startButton").innerHTML="🔄 PHI HÀNH LẠI";

document.getElementById("status").innerHTML=
"🚀 Tàu không gian đang bay qua vũ trụ...";

let shuffled=[...questionBank];

shuffled.sort(()=>Math.random()-.5);

gameQuestions=shuffled.slice(0,10);

updateProgress();

clearInterval(shipTimer);
clearTimeout(asteroidTimer);

shipTimer=setInterval(moveShip,100);
asteroidTimer=setTimeout(showAsteroid,5000);

}

function moveShip(){

if(!gameRunning||waiting)return;

shipPosition+=2;

let width=document.querySelector(".space").clientWidth;

if(shipPosition>width-220){
shipPosition=55;
}

document.getElementById("spaceship").style.left=
shipPosition+"px";

}

function showAsteroid(){

if(!gameRunning)return;

waiting=true;

document.getElementById("asteroid").classList.add("show");

document.getElementById("status").innerHTML=
"☄️ THIÊN THẠCH PHÍA TRƯỚC! Hãy trả lời câu hỏi!";

clearInterval(shipTimer);

showQuestion();

}

function showQuestion(){

let q=gameQuestions[currentQuestion];

selectedAnswer=null;

document.getElementById("question").innerHTML=
"Câu "+(currentQuestion+1)+": "+q[0];

let html="";

q[1].forEach((answer,index)=>{

html+=`
<button class="answer" onclick="selectAnswer(${index})">
${String.fromCharCode(65+index)}. ${answer}
</button>
`;

});

document.getElementById("answers").innerHTML=html;

document.getElementById("overlay").classList.add("show");
document.getElementById("questionBox").classList.add("show");

}

function selectAnswer(index){

selectedAnswer=index;

document.querySelectorAll(".answer").forEach(button=>{
button.classList.remove("selected");
});

document.querySelectorAll(".answer")[index].classList.add("selected");

}

function correctEffect(){

const effect=document.createElement("div");

effect.className="correct-effect";
effect.innerHTML="🚀 CHÍNH XÁC!";

document.body.appendChild(effect);

setTimeout(()=>{
effect.remove();
},800);

}

function checkAnswer(){

if(selectedAnswer===null){

alert("⚠️ Hãy chọn một đáp án!");

return;

}

if(selectedAnswer!==gameQuestions[currentQuestion][2]){

loseGame();

return;

}

correctEffect();

currentQuestion++;

document.getElementById("asteroid").classList.remove("show");
document.getElementById("questionBox").classList.remove("show");
document.getElementById("overlay").classList.remove("show");

updateProgress();

if(currentQuestion>=10){

winGame();

return;

}

waiting=false;

document.getElementById("status").innerHTML=
"✅ Chính xác! Tàu tiếp tục xuyên qua vũ trụ...";

shipTimer=setInterval(moveShip,100);

asteroidTimer=setTimeout(showAsteroid,5000);

}

function updateProgress(){

document.getElementById("progressBar").style.width=
(currentQuestion/10*100)+"%";

document.getElementById("progressText").innerHTML=
"🌌 Đã vượt qua "+currentQuestion+"/10 thiên thạch";

}

function loseGame(){

gameRunning=false;
waiting=false;

clearInterval(shipTimer);
clearTimeout(asteroidTimer);

document.getElementById("questionBox").classList.remove("show");
document.getElementById("overlay").classList.remove("show");
document.getElementById("asteroid").classList.remove("show");

document.getElementById("result").style.display="block";
document.getElementById("result").classList.add("lose");

document.getElementById("resultTitle").innerHTML=
"💥 TÀU VŨ TRỤ GẶP NẠN!";

document.getElementById("resultText").innerHTML=
"❌ Bạn đã trả lời sai!<br><br>"+
"☄️ Bạn đã vượt qua "+currentQuestion+
"/10 thiên thạch.<br><br>"+
"🚀 Hãy ôn lại kiến thức và thử phi hành lần nữa!";

}

function winGame(){

gameRunning=false;
waiting=false;

clearInterval(shipTimer);
clearTimeout(asteroidTimer);

document.getElementById("questionBox").classList.remove("show");
document.getElementById("overlay").classList.remove("show");
document.getElementById("asteroid").classList.remove("show");

document.getElementById("progressBar").style.width="100%";

document.getElementById("progressText").innerHTML=
"🏆 HOÀN THÀNH 10/10!";

document.getElementById("status").innerHTML=
"🌌 Bạn đã chinh phục thành công vũ trụ Tiếng Anh 7!";

document.getElementById("result").style.display="block";

document.getElementById("resultTitle").innerHTML=
"🏆 CHINH PHỤC VŨ TRỤ!";

document.getElementById("resultText").innerHTML=
"🎉 XUẤT SẮC!<br><br>"+
"🚀 Bạn đã vượt qua cả 10 thiên thạch!<br><br>"+
"🇬🇧 Bạn đã hoàn thành màn chơi Trắc nghiệm Tiếng Anh 7!";

}

</script>
