
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 9 - TÂN BINH</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
    color: #222;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer:disabled {
    cursor: not-allowed;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.result p {
    font-size: 19px;
}

.win {
    color: #2ecc71 !important;
}

.lose {
    color: #e74c3c !important;
}

.draw {
    color: #f39c12 !important;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_van_khoi9.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">
    <div class="title">📚 NGỮ VĂN 9 - CẤP ĐỘ TÂN BINH</div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>
</div>

<script>

const cauHoi = [

{
    q: "Tác giả của Truyện Kiều là ai?",
    a: ["Nguyễn Du", "Nguyễn Trãi", "Hồ Xuân Hương", "Nam Cao"],
    d: 0
},

{
    q: "Truyện Kiều có tên gọi khác là gì?",
    a: ["Đoạn trường tân thanh", "Chinh phụ ngâm", "Cung oán ngâm khúc", "Lục Vân Tiên"],
    d: 0
},

{
    q: "Nhân vật chính trong truyện Lục Vân Tiên là ai?",
    a: ["Lục Vân Tiên", "Kim Trọng", "Thúy Kiều", "Từ Hải"],
    d: 0
},

{
    q: "Tác giả của bài thơ Đồng chí là ai?",
    a: ["Chính Hữu", "Quang Dũng", "Tố Hữu", "Huy Cận"],
    d: 0
},

{
    q: "Bài thơ Đồng chí viết về tình cảm nào?",
    a: ["Tình đồng đội, đồng chí", "Tình cảm gia đình", "Tình yêu quê hương", "Tình yêu đôi lứa"],
    d: 0
},

{
    q: "Tác giả bài thơ Bài thơ về tiểu đội xe không kính là ai?",
    a: ["Phạm Tiến Duật", "Chính Hữu", "Xuân Diệu", "Hữu Thỉnh"],
    d: 0
},

{
    q: "Bài thơ Đoàn thuyền đánh cá của tác giả nào?",
    a: ["Huy Cận", "Tế Hanh", "Tố Hữu", "Chế Lan Viên"],
    d: 0
},

{
    q: "Tác giả truyện ngắn Làng là ai?",
    a: ["Kim Lân", "Nam Cao", "Ngô Tất Tố", "Nguyễn Công Hoan"],
    d: 0
},

{
    q: "Nhân vật ông Hai trong truyện Làng có tình yêu sâu sắc với điều gì?",
    a: ["Làng quê và đất nước", "Tiền bạc", "Danh vọng", "Cuộc sống thành thị"],
    d: 0
},

{
    q: "Bài thơ Ánh trăng của tác giả nào?",
    a: ["Nguyễn Duy", "Huy Cận", "Chính Hữu", "Tố Hữu"],
    d: 0
},

{
    q: "Văn bản Bến quê là sáng tác của ai?",
    a: ["Nguyễn Minh Châu", "Kim Lân", "Nam Cao", "Nguyễn Du"],
    d: 0
},

{
    q: "Tác phẩm Những ngôi sao xa xôi của tác giả nào?",
    a: ["Lê Minh Khuê", "Nguyễn Minh Châu", "Thạch Lam", "Tô Hoài"],
    d: 0
},

{
    q: "Ba nhân vật chính trong Những ngôi sao xa xôi là ai?",
    a: ["Phương Định, Nho, Thao", "Việt, Chiến, chị Út", "Dế Mèn, Dế Choắt, chị Cốc", "Ông Hai, bà Hai, bé Húc"],
    d: 0
},

{
    q: "Tác giả của bài thơ Sang thu là ai?",
    a: ["Hữu Thỉnh", "Xuân Quỳnh", "Thanh Hải", "Nguyễn Duy"],
    d: 0
},

{
    q: "Bài thơ Mùa xuân nho nhỏ của tác giả nào?",
    a: ["Thanh Hải", "Hữu Thỉnh", "Tố Hữu", "Chế Lan Viên"],
    d: 0
},

{
    q: "Biện pháp tu từ so sánh có tác dụng gì?",
    a: ["Làm nổi bật đặc điểm của sự vật", "Kể lại sự việc", "Chỉ thời gian", "Liệt kê nhân vật"],
    d: 0
},

{
    q: "Ẩn dụ là biện pháp tu từ dựa trên quan hệ nào?",
    a: ["Tương đồng", "Tương phản", "Liệt kê", "Lặp lại"],
    d: 0
},

{
    q: "Hoán dụ là biện pháp tu từ dựa trên quan hệ nào?",
    a: ["Gần gũi giữa các sự vật", "Tương đồng", "Đối lập", "Vần điệu"],
    d: 0
},

{
    q: "Một bài văn nghị luận thường cần có những yếu tố nào?",
    a: ["Luận điểm, lí lẽ và bằng chứng", "Nhân vật và cốt truyện", "Vần và nhịp", "Chỉ có lời thoại"],
    d: 0
},

{
    q: "Thành phần biệt lập tình thái dùng để thể hiện điều gì?",
    a: ["Cách nhìn nhận, thái độ của người nói", "Thời gian xảy ra sự việc", "Địa điểm", "Hành động của nhân vật"],
    d: 0
}

];

let ds = [...cauHoi].sort(() => Math.random() - 0.5).slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let tg = 15;
let timer;
let daTraLoi = false;

function hienThiCau() {

    clearInterval(timer);
    daTraLoi = false;
    tg = 15;

    document.getElementById("timer").textContent = tg;
    document.getElementById("playerScore").textContent = diemBan;
    document.getElementById("botScore").textContent = diemBot;
    document.getElementById("number").textContent = cau + 1;

    let c = ds[cau];

    document.getElementById("question").textContent =
        "Câu " + (cau + 1) + "/10: " + c.q;

    document.getElementById("answers").innerHTML = c.a.map((x, j) => `
        <button class="answer" onclick="traLoi(${j}, this)">
            ${String.fromCharCode(65 + j)}. ${x}
        </button>
    `).join("");

    timer = setInterval(() => {

        tg--;

        document.getElementById("timer").textContent = tg;

        if (tg <= 0) {
            hetThoiGian();
        }

    }, 1000);
}

function traLoi(chon, el) {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    if (chon === c.d) {

        diemBan++;
        el.classList.add("correct");

    } else {

        el.classList.add("wrong");
        nut[c.d].classList.add("correct");

    }

    document.getElementById("playerScore").textContent = diemBan;

    setTimeout(botTraLoi, 700);
}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    nut[c.d].classList.add("correct");

    setTimeout(botTraLoi, 700);
}

function botTraLoi() {

    let dung = Math.random() < 0.10;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").textContent = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {

    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;

    }

    result.innerHTML = `
        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>🌱 Cấp độ: TÂN BINH</p>
        

        <br>

        <button onclick="location.reload()">🔄 Chơi lại</button>

        <button onclick="location.href='capdo_van_khoi9.html'">
            🎚️ Chọn cấp độ
        </button>

        <button onclick="location.href='khoi9.html'">
            🏠 Về chọn môn
        </button>
    `;
}

hienThiCau();

</script>

</body>
</html>
