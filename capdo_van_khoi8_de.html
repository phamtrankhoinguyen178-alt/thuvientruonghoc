<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 7 - Dễ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #00695c, #00897b, #26a69a);
    min-height: 100vh;
}

.top {
    background: #111;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 3px 15px #000;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #4da6ff;
}

.bot {
    color: #ff3333;
}

.time {
    background: #333;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.bot-time {
    background: #555;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.main {
    max-width: 950px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: #fff;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
    text-shadow: 0 0 10px #00ffff;
}

.card {
    background: #171717;
    color: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px #000;
    border: 2px solid #00897b;
}

.question {
    font-size: 23px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 30px;
    line-height: 1.5;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #555;
    border-radius: 12px;
    background: #242424;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #004d40;
    border-color: #00e5ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #155d25;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #700000;
    border-color: #ff3333;
}

.status {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: #171717;
    color: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 30px #000;
    border: 2px solid #00897b;
}

.result h1 {
    font-size: 40px;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #ff3333;
}

.draw {
    color: #f39c12;
}

.result h2 {
    margin: 12px;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #00897b;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #00bfa5;
}

@media(max-width:600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 15px;
    }

    .title {
        font-size: 25px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="top">

    <div class="player">
        👤 Bạn: <span id="playerScore">0</span>
    </div>

    <div class="time">
        ⏱ Bạn: <span id="timer">15</span>s
    </div>

    <div class="bot">
        🤖 Bot: <span id="botScore">0</span>
    </div>

    <div class="bot-time">
        🤖 Bot: <span id="botTimer">15</span>s
    </div>

</div>

<div class="main">

    <div class="title">
        📚 NGỮ VĂN 7 - CẤP ĐỘ DỄ 📚
    </div>

    <div id="game" class="card">

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="status" id="status">
            🤖 Bot đang suy nghĩ...
        </div>

    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [

{
    q: "Văn bản nghị luận chủ yếu sử dụng phương thức biểu đạt nào?",
    a: ["Tự sự", "Nghị luận", "Miêu tả", "Biểu cảm"],
    d: 1
},

{
    q: "Thơ thất ngôn bát cú Đường luật gồm bao nhiêu câu?",
    a: ["6 câu", "7 câu", "8 câu", "10 câu"],
    d: 2
},

{
    q: "Mỗi câu trong bài thơ thất ngôn bát cú có bao nhiêu tiếng?",
    a: ["5 tiếng", "6 tiếng", "7 tiếng", "8 tiếng"],
    d: 2
},

{
    q: "Thơ tứ tuyệt Đường luật thường có bao nhiêu câu?",
    a: ["2 câu", "4 câu", "6 câu", "8 câu"],
    d: 1
},

{
    q: "Từ tượng hình là những từ gợi tả điều gì?",
    a: ["Âm thanh", "Hình ảnh, dáng vẻ", "Mùi vị", "Cảm xúc"],
    d: 1
},

{
    q: "Từ tượng thanh là những từ mô phỏng điều gì?",
    a: ["Hình dáng", "Màu sắc", "Âm thanh", "Tính cách"],
    d: 2
},

{
    q: "Biện pháp tu từ so sánh thường sử dụng từ ngữ nào?",
    a: ["Nhưng, vì", "Như, tựa, giống", "Nếu, thì", "Và, hoặc"],
    d: 1
},

{
    q: "Biện pháp tu từ nhân hóa là gì?",
    a: ["Gọi hoặc tả sự vật bằng những từ ngữ vốn dùng cho con người", "Phóng đại sự vật", "Lặp lại từ ngữ", "Đảo vị trí từ ngữ"],
    d: 0
},

{
    q: "Điệp ngữ là biện pháp tu từ như thế nào?",
    a: ["Sử dụng từ trái nghĩa", "Lặp lại từ ngữ hoặc cụm từ", "So sánh hai sự vật", "Nói giảm nói tránh"],
    d: 1
},

{
    q: "Văn bản thông tin thường nhằm mục đích gì?",
    a: ["Cung cấp thông tin", "Kể chuyện tưởng tượng", "Bộc lộ cảm xúc cá nhân", "Tạo tiếng cười"],
    d: 0
},

{
    q: "Luận điểm trong văn bản nghị luận là gì?",
    a: ["Ý kiến chính cần làm sáng tỏ", "Một câu chuyện", "Một hình ảnh miêu tả", "Một lời đối thoại"],
    d: 0
},

{
    q: "Luận cứ trong văn nghị luận bao gồm những gì?",
    a: ["Chỉ có cảm xúc", "Lí lẽ và bằng chứng", "Chỉ có hình ảnh", "Chỉ có nhân vật"],
    d: 1
},

{
    q: "Truyện cười thường hướng đến mục đích nào?",
    a: ["Chỉ để miêu tả thiên nhiên", "Gây cười và phê phán thói hư tật xấu", "Kể về lịch sử", "Giải thích hiện tượng tự nhiên"],
    d: 1
},

{
    q: "Truyện lịch sử thường lấy chất liệu chủ yếu từ đâu?",
    a: ["Những sự kiện và nhân vật lịch sử", "Thế giới thần tiên", "Cuộc sống tương lai", "Truyện cổ tích"],
    d: 0
},

{
    q: "Thành phần biệt lập tình thái thường thể hiện điều gì?",
    a: ["Thái độ, cách đánh giá của người nói", "Thời gian diễn ra sự việc", "Địa điểm của sự việc", "Hành động của nhân vật"],
    d: 0
},

{
    q: "Câu hỏi tu từ thường được sử dụng nhằm mục đích gì?",
    a: ["Chỉ để hỏi thông tin", "Khẳng định hoặc bộc lộ cảm xúc", "Thông báo thời gian", "Liệt kê sự vật"],
    d: 1
},

{
    q: "Nghĩa tường minh của câu là gì?",
    a: ["Nghĩa được thể hiện trực tiếp bằng từ ngữ", "Nghĩa phải suy luận", "Nghĩa hoàn toàn trái ngược", "Nghĩa không liên quan"],
    d: 0
},

{
    q: "Nghĩa hàm ẩn là gì?",
    a: ["Nghĩa được nói trực tiếp", "Nghĩa không được diễn đạt trực tiếp nhưng có thể suy ra", "Nghĩa của từng chữ riêng lẻ", "Nghĩa chỉ có trong thơ"],
    d: 1
},

{
    q: "Đối thoại trong văn bản là gì?",
    a: ["Lời độc thoại của một người", "Cuộc trò chuyện giữa hai hay nhiều người", "Lời miêu tả cảnh vật", "Lời kể của tác giả"],
    d: 1
},

{
    q: "Độc thoại nội tâm là gì?",
    a: ["Lời nhân vật tự nói với chính mình trong suy nghĩ", "Cuộc trò chuyện giữa nhiều người", "Lời giới thiệu nhân vật", "Lời bình luận của người đọc"],
    d: 0
},

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;

let thoiGianBan = 15;
let thoiGianBot = 15;

let timerBan;
let timerBot;

let daTraLoi = false;
let botDaTraLoi = false;

function hienThiCau() {

    daTraLoi = false;
    botDaTraLoi = false;

    thoiGianBan = 15;
    thoiGianBot = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = 15;
    document.getElementById("botTimer").innerText = 15;

    document.getElementById("question").innerText =
        danhSach[cau].q;

    document.getElementById("status").innerText =
        "🤖 Bot đang suy nghĩ...";

    let html = "";

    danhSach[cau].a.forEach((x, i) => {

        html += `
        <div class="answer" onclick="traLoi(${i}, this)">
            ${String.fromCharCode(65 + i)}. ${x}
        </div>
        `;

    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timerBan);
    clearInterval(timerBot);

    timerBan = setInterval(() => {

        thoiGianBan--;

        document.getElementById("timer").innerText =
            thoiGianBan;

        if (thoiGianBan <= 0) {

            clearInterval(timerBan);

            hetThoiGian();

        }

    }, 1000);

    timerBot = setInterval(() => {

        thoiGianBot--;

        document.getElementById("botTimer").innerText =
            thoiGianBot;

        if (thoiGianBot <= 0) {

            clearInterval(timerBot);

            botTraLoi();

        }

    }, 1000);
}

function traLoi(chon, element) {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timerBan);

    let dung = danhSach[cau].d;

    if (chon === dung) {

        diemBan++;

        element.classList.add("correct");

    } else {

        element.classList.add("wrong");

        document.querySelectorAll(".answer")[dung]
        .classList.add("correct");

    }

    document.getElementById("playerScore").innerText =
        diemBan;

    document.getElementById("status").innerText =
        "👤 Bạn đã trả lời! Bot vẫn đang suy nghĩ...";

}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    let dung = danhSach[cau].d;

    document.querySelectorAll(".answer")[dung]
    .classList.add("correct");

    document.getElementById("status").innerText =
        "⏰ Bạn hết thời gian! Bot vẫn đang suy nghĩ...";

}

function botTraLoi() {

    if (botDaTraLoi) return;

    botDaTraLoi = true;

    let dung = Math.random() < 0.25;

    if (dung) {

        diemBot++;

        document.getElementById("status").innerText =
            "🤖 Bot trả lời đúng!";

    } else {

        document.getElementById("status").innerText =
            "🤖 Bot trả lời sai!";

    }

    document.getElementById("botScore").innerText =
        diemBot;

    setTimeout(() => {

        cau++;

        if (cau >= 10) {

            ketThucTran();

        } else {

            hienThiCau();

        }

    }, 1000);
}

function ketThucTran() {

    clearInterval(timerBan);
    clearInterval(timerBot);

    document.getElementById("game").style.display =
        "none";

    document.querySelector(".info").style.display =
        "none";

    document.querySelector(".title").style.display =
        "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>🎉 Bạn đã đánh bại Bot!</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>🤖 Bot đã chiến thắng!</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🔥 HÒA!</h1>
            <p>Hai bên có cùng số điểm!</p>
        `;

    }

    result.innerHTML = `

        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>⏱ Bạn: 15 giây/câu</p>

        <p>🤖 Bot: 15 giây/câu</p>

        <p>📚 Bộ câu hỏi: 100 câu</p>

        <p>🎯 Bot có 25% khả năng trả lời đúng</p>

        <br>

        <button onclick="location.href='capdo_van_khoi7.html'">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='khoi7.html'">
            🏠 Về chọn môn
        </button>

    `;
}

hienThiCau();

</script>

</body>
</html>
