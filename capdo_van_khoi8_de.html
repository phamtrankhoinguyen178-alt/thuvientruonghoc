
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 8 - Dễ</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
    color: #222;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer:disabled {
    cursor: not-allowed;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.result p {
    font-size: 19px;
}

.win {
    color: #2ecc71 !important;
}

.lose {
    color: #e74c3c !important;
}

.draw {
    color: #f39c12 !important;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_van_khoi8.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">
    <div class="title">📚 NGỮ VĂN 8 - CẤP ĐỘ DỄ</div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>
</div>

<script>
const cauHoi = [
{
    q: "Tác giả của tác phẩm Tắt đèn là ai?",
    a: ["Ngô Tất Tố", "Nam Cao", "Kim Lân", "Nguyễn Du"],
    d: 0
},
{
    q: "Nhân vật chính trong văn bản Tức nước vỡ bờ là ai?",
    a: ["Chị Dậu", "Ông Hai", "Lão Hạc", "Bé Thu"],
    d: 0
},
{
    q: "Tác giả của văn bản Trong lòng mẹ là ai?",
    a: ["Nguyên Hồng", "Nam Cao", "Ngô Tất Tố", "Tô Hoài"],
    d: 0
},
{
    q: "Văn bản Trong lòng mẹ trích từ tác phẩm nào?",
    a: ["Những ngày thơ ấu", "Tắt đèn", "Lão Hạc", "Dế Mèn phiêu lưu ký"],
    d: 0
},
{
    q: "Tác giả của truyện ngắn Lão Hạc là ai?",
    a: ["Nam Cao", "Nguyễn Du", "Kim Lân", "Ngô Tất Tố"],
    d: 0
},
{
    q: "Lão Hạc có người bạn thân thiết nào?",
    a: ["Ông giáo", "Ông Hai", "Anh thanh niên", "Bác lái xe"],
    d: 0
},
{
    q: "Tác giả của văn bản Tôi đi học là ai?",
    a: ["Thanh Tịnh", "Nguyên Hồng", "Nam Cao", "Tô Hoài"],
    d: 0
},
{
    q: "Văn bản Tôi đi học kể về điều gì?",
    a: ["Kỉ niệm ngày đầu tiên đi học", "Một chuyến đi xa", "Một trận chiến", "Một buổi lao động"],
    d: 0
},
{
    q: "Thơ lục bát có cấu trúc số tiếng như thế nào?",
    a: ["6 - 8", "5 - 7", "7 - 7", "8 - 8"],
    d: 0
},
{
    q: "Một bài thơ thất ngôn bát cú Đường luật có bao nhiêu câu?",
    a: ["6 câu", "8 câu", "10 câu", "12 câu"],
    d: 1
},
{
    q: "Từ tượng thanh là từ mô phỏng điều gì?",
    a: ["Âm thanh", "Hình dáng", "Màu sắc", "Mùi vị"],
    d: 0
},
{
    q: "Từ tượng hình thường gợi tả điều gì?",
    a: ["Hình ảnh, dáng vẻ và trạng thái", "Âm thanh", "Mùi vị", "Con số"],
    d: 0
},
{
    q: "Biện pháp tu từ so sánh là gì?",
    a: ["Đối chiếu hai sự vật có nét tương đồng", "Lặp lại từ ngữ", "Gọi vật như người", "Liệt kê sự vật"],
    d: 0
},
{
    q: "Biện pháp tu từ nhân hóa là gì?",
    a: ["Gọi hoặc tả sự vật bằng những từ ngữ vốn dùng cho con người", "So sánh hai sự vật", "Lặp lại âm thanh", "Kể tên sự vật"],
    d: 0
},
{
    q: "Từ ghép là từ được tạo thành như thế nào?",
    a: ["Kết hợp các tiếng có quan hệ về nghĩa", "Lặp lại âm đầu", "Chỉ có một tiếng", "Kết hợp các dấu câu"],
    d: 0
},
{
    q: "Thành ngữ là gì?",
    a: ["Cụm từ cố định có ý nghĩa hoàn chỉnh", "Một loại dấu câu", "Tên một nhân vật", "Một đoạn văn dài"],
    d: 0
},
{
    q: "Tục ngữ thường thể hiện điều gì?",
    a: ["Kinh nghiệm và nhận xét của nhân dân", "Tên tác giả", "Một câu chuyện tưởng tượng", "Một bài thơ dài"],
    d: 0
},
{
    q: "Câu nghi vấn thường dùng để làm gì?",
    a: ["Hỏi hoặc thể hiện mục đích khác", "Chỉ kể sự việc", "Chỉ miêu tả", "Chỉ ra lệnh"],
    d: 0
},
{
    q: "Câu cầu khiến thường dùng để làm gì?",
    a: ["Ra lệnh, yêu cầu hoặc đề nghị", "Kể lại câu chuyện", "Bộc lộ cảm xúc", "Miêu tả cảnh vật"],
    d: 0
},
{
    q: "Văn bản nghị luận thường sử dụng những yếu tố nào?",
    a: ["Luận điểm, lí lẽ và bằng chứng", "Nhân vật và cốt truyện", "Vần và nhịp", "Chỉ có lời thoại"],
    d: 0
}
];

let ds = [...cauHoi].sort(() => Math.random() - 0.5).slice(0, 10);
let cau = 0;
let diemBan = 0;
let diemBot = 0;
let tg = 15;
let timer;
let daTraLoi = false;

function hienThiCau() {
    clearInterval(timer);
    daTraLoi = false;
    tg = 15;

    document.getElementById("timer").textContent = tg;
    document.getElementById("playerScore").textContent = diemBan;
    document.getElementById("botScore").textContent = diemBot;
    document.getElementById("number").textContent = cau + 1;

    let c = ds[cau];

    document.getElementById("question").textContent =
        "Câu " + (cau + 1) + "/10: " + c.q;

    document.getElementById("answers").innerHTML = c.a.map((x, j) => `
        <button class="answer" onclick="traLoi(${j}, this)">
            ${String.fromCharCode(65 + j)}. ${x}
        </button>
    `).join("");

    timer = setInterval(() => {
        tg--;
        document.getElementById("timer").textContent = tg;

        if (tg <= 0) {
            hetThoiGian();
        }
    }, 1000);
}

function traLoi(chon, el) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    if (chon === c.d) {
        diemBan++;
        el.classList.add("correct");
    } else {
        el.classList.add("wrong");
        nut[c.d].classList.add("correct");
    }

    document.getElementById("playerScore").textContent = diemBan;

    setTimeout(botTraLoi, 700);
}

function hetThoiGian() {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);
    nut[c.d].classList.add("correct");

    setTimeout(botTraLoi, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.10;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").textContent = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        <p>🌱 Cấp độ: DỄ</p>
        <p>Bot có 10% xác suất trả lời đúng mỗi câu.</p>
        <br>
        <button onclick="location.reload()">🔄 Chơi lại</button>
        <button onclick="location.href='capdo_van_khoi8.html'">🎚️ Chọn cấp độ</button>
        <button onclick="location.href='khoi8.html'">🏠 Về chọn môn</button>
    `;
}

hienThiCau();
</script>

</body>
</html>
