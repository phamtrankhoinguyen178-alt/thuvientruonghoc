<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lịch Sử và Địa Lý KHỐI 6 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_lsdl_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ Lịch Sử và Địa Lý KHỐI 8 - CHẾ ĐỘ Tân binh
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
{
        q: "Lịch sử là gì?",
        a: ["Những gì đã diễn ra trong quá khứ", "Những dự đoán tương lai", "Những câu chuyện tưởng tượng", "Những sự kiện hiện tại"],
        d: 0
    },

    {
        q: "Trái Đất nằm ở vị trí thứ mấy tính từ Mặt Trời?",
        a: ["Thứ nhất", "Thứ hai", "Thứ ba", "Thứ tư"],
        d: 2
    },

    {
        q: "Ai là người đứng đầu nhà nước Văn Lang?",
        a: ["An Dương Vương", "Hùng Vương", "Ngô Quyền", "Lý Công Uẩn"],
        d: 1
    },

    {
        q: "Trái Đất có dạng hình gì?",
        a: ["Hình vuông", "Hình cầu", "Hình tam giác", "Hình trụ"],
        d: 1
    },

    {
        q: "Ai Cập cổ đại hình thành bên dòng sông nào?",
        a: ["Sông Hằng", "Sông Hoàng Hà", "Sông Nin", "Sông Mê Công"],
        d: 2
    },

    {
        q: "Thời gian Trái Đất tự quay một vòng quanh trục là bao lâu?",
        a: ["12 giờ", "24 giờ", "30 ngày", "365 ngày"],
        d: 1
    },

    {
        q: "Công trình kiến trúc nổi tiếng của Ai Cập cổ đại là gì?",
        a: ["Kim tự tháp", "Tháp Eiffel", "Đấu trường La Mã", "Vạn Lý Trường Thành"],
        d: 0
    },

    {
        q: "Đường vĩ tuyến lớn nhất trên Trái Đất là đường nào?",
        a: ["Chí tuyến Bắc", "Chí tuyến Nam", "Xích đạo", "Vòng cực Bắc"],
        d: 2
    },

    {
        q: "Nhà nước Âu Lạc do ai thành lập?",
        a: ["Hùng Vương", "An Dương Vương", "Ngô Quyền", "Hai Bà Trưng"],
        d: 1
    },

    {
        q: "Đại dương nào lớn nhất thế giới?",
        a: ["Đại Tây Dương", "Ấn Độ Dương", "Bắc Băng Dương", "Thái Bình Dương"],
        d: 3
    },

    {
        q: "Người nguyên thủy chủ yếu sống bằng hoạt động nào?",
        a: ["Săn bắt và hái lượm", "Buôn bán", "Công nghiệp", "Dịch vụ"],
        d: 0
    },

    {
        q: "Kinh tuyến gốc có số độ là bao nhiêu?",
        a: ["90°", "180°", "0°", "45°"],
        d: 2
    },

    {
        q: "Kinh đô của nước Văn Lang đặt ở đâu?",
        a: ["Cổ Loa", "Phong Châu", "Hoa Lư", "Thăng Long"],
        d: 1
    },

    {
        q: "Thành phần chiếm tỉ lệ lớn nhất trong không khí là khí nào?",
        a: ["Ô-xi", "Cacbon đioxit", "Ni-tơ", "Hi-đrô"],
        d: 2
    },

    {
        q: "Người Lưỡng Hà cổ đại sáng tạo ra loại chữ nào?",
        a: ["Chữ hình nêm", "Chữ La-tinh", "Chữ Quốc ngữ", "Chữ cái Hy Lạp"],
        d: 0
    },

    {
        q: "Lớp ngoài cùng của Trái Đất là gì?",
        a: ["Nhân trong", "Lớp vỏ", "Nhân ngoài", "Lớp lõi"],
        d: 1
    },

    {
        q: "Ai là người thống nhất Trung Quốc vào năm 221 TCN?",
        a: ["Lưu Bang", "Khổng Tử", "Tần Thủy Hoàng", "Lý Thế Dân"],
        d: 2
    },

    {
        q: "Đỉnh núi cao nhất thế giới là đỉnh nào?",
        a: ["Phan Xi Păng", "Phú Sĩ", "Kilimanjaro", "Everest"],
        d: 3
    },

    {
        q: "Trống đồng Đông Sơn thuộc nền văn hóa nào?",
        a: ["Văn hóa Óc Eo", "Văn hóa Đông Sơn", "Văn hóa Sa Huỳnh", "Văn hóa Hòa Bình"],
        d: 1
    },

    {
        q: "Hiện tượng ngày và đêm luân phiên nhau do đâu?",
        a: ["Trái Đất tự quay quanh trục", "Mặt Trăng quay quanh Trái Đất", "Mặt Trời quay quanh Trái Đất", "Trái Đất đứng yên"],
        d: 0
    },
];
let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
       
        <br>
        <button onclick="location.href='capdo_lsdl_khoi6_de.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_lsdl_khoi6.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
