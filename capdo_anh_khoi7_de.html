<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#071b2b,#0b405c,#061923);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.game{
    width:100%;
    max-width:950px;
    background:rgba(0,0,0,.6);
    border:2px solid #00a8e8;
    border-radius:20px;
    padding:25px;
}

h1{
    text-align:center;
    color:#55dfff;
    margin-bottom:25px;
}

.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.box{
    background:#103449;
    border:1px solid #187da6;
    border-radius:12px;
    text-align:center;
    padding:12px;
}

.box span{
    display:block;
    font-size:28px;
    font-weight:bold;
    margin-top:5px;
}

.progress{
    text-align:center;
    color:#8edfff;
    margin-bottom:15px;
}

.question{
    background:#102b3a;
    border-radius:15px;
    padding:25px;
    border:1px solid #23647d;
    margin-bottom:20px;
}

.question h2{
    font-size:21px;
    line-height:1.5;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.answer{
    border:2px solid #167da6;
    border-radius:12px;
    background:#12394d;
    color:white;
    padding:16px;
    font-size:17px;
    cursor:pointer;
}

.answer:hover{
    background:#1b5771;
}

.correct{
    background:#087c48!important;
    border-color:#20ed91!important;
}

.wrong{
    background:#8c2222!important;
    border-color:#ff5555!important;
}

.info{
    text-align:center;
    min-height:28px;
    margin-top:18px;
    font-size:18px;
}

#next{
    display:none;
    margin:20px auto 0;
    padding:13px 25px;
    border:none;
    border-radius:10px;
    background:#1298d0;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#result{
    display:none;
    text-align:center;
}

#result h2{
    font-size:36px;
    margin-bottom:15px;
}

.result-score{
    font-size:23px;
    margin-bottom:25px;
}

.menu{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.menu button{
    padding:13px 20px;
    border:none;
    border-radius:10px;
    background:#126d91;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:700px){
    .top{
        grid-template-columns:1fr 1fr;
    }

    .answers{
        grid-template-columns:1fr;
    }
}
</style>
</head>

    </div>

</div>

<div id="gameArea">

<div class="progress" id="progress"></div>

<div class="question">
    <h2 id="cauHoi"></h2>
</div>

<div class="answers">
    <button class="answer" id="a0" onclick="traLoi(0)"></button>

    <button class="answer" id="a2" onclick="traLoi(2)"></button>
    <button class="answer" id="a3" onclick="traLoi(3)"></button>
</div>

<div class="info" id="info"></div>

<button id="next" onclick="cauTiep()">CÂU TIẾP THEO →</button>

</div>

<div id="result">

    <div class="menu">

let ds=[];
let i=0;
let diem=0;
let bot=0;
let time=15;
let daTraLoi=false;
let timer;

function tron(a){
    return [...a].sort(()=>Math.random()-0.5);
}

function batDau(){
    ds=tron(nganHang).slice(0,10);
    i=0;
    diem=0;
    bot=0;

    document.getElementById("diem").textContent=0;
    document.getElementById("botDiem").textContent=0;
    document.getElementById("gameArea").style.display="block";
    document.getElementById("result").style.display="none";

    hienThi();
}

function hienThi(){
    clearInterval(timer);

    daTraLoi=false;
    time=15;

    document.getElementById("tg").textContent=time;
    document.getElementById("soCau").textContent=(i+1)+"/10";
    document.getElementById("progress").textContent="Câu "+(i+1)+" / 10";
    document.getElementById("cauHoi").textContent=ds[i].q;

    for(let j=0;j<4;j++){
        let b=document.getElementById("a"+j);
        b.textContent=String.fromCharCode(65+j)+". "+ds[i].a[j];
        b.className="answer";
        b.disabled=false;
    }

    document.getElementById("info").textContent="";
    document.getElementById("next").style.display="none";

    timer=setInterval(()=>{
        time--;
        document.getElementById("tg").textContent=time;

        if(time<=0){
            clearInterval(timer);
            hetGio();
        }
    },1000);
}

function traLoi(x){
    if(daTraLoi)return;

    daTraLoi=true;
    clearInterval(timer);

    let d=ds[i].d;

    for(let j=0;j<4;j++){
        document.getElementById("a"+j).disabled=true;
    }

    if(x===d){
        diem++;
        document.getElementById("diem").textContent=diem;
        document.getElementById("a"+x).classList.add("correct");
        document.getElementById("info").textContent="✓ Chính xác!";
    }else{
        document.getElementById("a"+x).classList.add("wrong");
        document.getElementById("a"+d).classList.add("correct");
        document.getElementById("info").textContent="✗ Sai rồi!";
    }

    botTraLoi();

    document.getElementById("next").style.display="block";
}

function hetGio(){
    if(daTraLoi)return;

    daTraLoi=true;

    let d=ds[i].d;

    for(let j=0;j<4;j++){
        document.getElementById("a"+j).disabled=true;
    }

    document.getElementById("a"+d).classList.add("correct");
    document.getElementById("info").textContent="⌛ Hết thời gian!";

    botTraLoi();

    document.getElementById("next").style.display="block";
}

function botTraLoi(){
    if(Math.random()<0.25){
        bot++;
        document.getElementById("botDiem").textContent=bot;
    }
}

function cauTiep(){
    if(i<9){
        i++;
        hienThi();
    }else{
        ketThuc();
    }
}

function ketThuc(){
    clearInterval(timer);

    document.getElementById("gameArea").style.display="none";
    document.getElementById("result").style.display="block";

    let kq;

    if(diem>bot){
        kq="🏆 BẠN THẮNG!";
    }else if(diem<bot){
        kq="🤖 BOT THẮNG!";
    }else{
        kq="🤝 HÒA!";
    }

    document.getElementById("ketQua").textContent=kq;
    document.getElementById("tongDiem").textContent=
        "Bạn: "+diem+" điểm | Bot: "+bot+" điểm";
}

function choiLai(){
    batDau();
}

batDau();
