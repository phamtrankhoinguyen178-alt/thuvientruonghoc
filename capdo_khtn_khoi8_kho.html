<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHTN KHỐI 8 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.back:hover {
    background: #333;
}
.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}
.player {
    color: #2878e8;
}
.bot {
    color: #e74c3c;
}
.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}
.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}
.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}
.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}
.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}
.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}
.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}
.result h1 {
    color: #2878e8;
}
.win {
    color: #2ecc71;
}
.lose {
    color: #e74c3c;
}
.draw {
    color: #f39c12;
}
.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_khtn_khoi8.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ KHTN KHỐI 8 - CHẾ ĐỘ KHÓ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
{
    q: "Cho phản ứng: 2H2 + O2 → 2H2O. Tỉ lệ số phân tử H2 và O2 là bao nhiêu?",
    a: ["1 : 1", "2 : 1", "1 : 2", "2 : 3"],
    d: 1
},
{
    q: "Phân tử khối của H2O là bao nhiêu? (H = 1, O = 16)",
    a: ["16", "17", "18", "20"],
    d: 2
},
{
    q: "Khối lượng mol của CO2 là bao nhiêu? (C = 12, O = 16)",
    a: ["28 g/mol", "32 g/mol", "40 g/mol", "44 g/mol"],
    d: 3
},
{
    q: "Trong 1 mol chất có bao nhiêu hạt vi mô?",
    a: ["6,022 × 10²³", "6,022 × 10²²", "3,14 × 10²³", "9,8 × 10²³"],
    d: 0
},
{
    q: "Ở cùng điều kiện nhiệt độ và áp suất, các chất khí có thể tích mol như thế nào?",
    a: ["Luôn khác nhau", "Bằng nhau", "Không xác định", "Luôn bằng 0"],
    d: 1
},
{
    q: "Nồng độ phần trăm của dung dịch được tính bằng công thức nào?",
    a: ["C% = m chất tan / m dung dịch × 100%", "C% = m dung dịch / m chất tan", "C% = V/m", "C% = m × V"],
    d: 0
},
{
    q: "Hòa tan 10 g muối vào 90 g nước. Nồng độ phần trăm của dung dịch là bao nhiêu?",
    a: ["5%", "10%", "15%", "20%"],
    d: 1
},
{
    q: "Chất nào sau đây là acid?",
    a: ["NaOH", "CaO", "HCl", "NaCl"],
    d: 2
},
{
    q: "Phản ứng giữa acid và base thường tạo thành sản phẩm nào?",
    a: ["Muối và nước", "Oxygen và hydrogen", "Carbon dioxide", "Kim loại"],
    d: 0
},
{
    q: "Khi tăng diện tích tiếp xúc của vật với mặt bị ép, áp suất thay đổi như thế nào nếu lực ép không đổi?",
    a: ["Tăng", "Giảm", "Không đổi", "Bằng 0"],
    d: 1
},
{
    q: "Một lực 100 N tác dụng lên diện tích 0,5 m². Áp suất là bao nhiêu?",
    a: ["50 Pa", "100 Pa", "200 Pa", "500 Pa"],
    d: 2
},
{
    q: "Vật có khối lượng riêng nhỏ hơn khối lượng riêng của chất lỏng thường có hiện tượng gì khi thả vào chất lỏng?",
    a: ["Chìm hoàn toàn", "Nổi", "Biến mất", "Tan ngay lập tức"],
    d: 1
},
{
    q: "Khi một vật nổi cân bằng trên mặt chất lỏng, lực đẩy Archimedes có độ lớn như thế nào so với trọng lượng vật?",
    a: ["Lớn hơn", "Nhỏ hơn", "Bằng nhau", "Bằng 0"],
    d: 2
},
{
    q: "Công thức tính công cơ học khi lực cùng hướng chuyển dời là gì?",
    a: ["A = F.s", "A = F/s", "A = m/V", "A = p.S"],
    d: 0
},
{
    q: "Một lực 20 N làm vật dịch chuyển 5 m cùng hướng lực. Công thực hiện là bao nhiêu?",
    a: ["25 J", "50 J", "100 J", "200 J"],
    d: 2
},
{
    q: "Bộ phận nào của hệ tuần hoàn giúp máu đông khi bị thương?",
    a: ["Hồng cầu", "Bạch cầu", "Tiểu cầu", "Huyết tương"],
    d: 2
},
{
    q: "Kháng thể được tạo ra chủ yếu bởi loại tế bào nào?",
    a: ["Tế bào lympho B và tương bào", "Hồng cầu", "Tiểu cầu", "Tế bào cơ"],
    d: 0
},
{
    q: "Chức năng chính của insulin là gì?",
    a: ["Làm tăng nhịp tim", "Điều hòa lượng đường trong máu", "Tạo nước tiểu", "Tăng trao đổi khí"],
    d: 1
},
{
    q: "Phần nào của não bộ đóng vai trò quan trọng trong điều hòa vận động và giữ thăng bằng?",
    a: ["Tiểu não", "Tủy sống", "Hành tủy", "Đồi thị"],
    d: 0
},
{
    q: "Vì sao cần ăn đủ chất dinh dưỡng?",
    a: ["Để cơ thể phát triển và hoạt động bình thường", "Để không cần uống nước", "Để không cần ngủ", "Để ngừng trao đổi chất"],
    d: 0
}
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.75;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        
        <br>
        <button onclick="location.href='capdo_khtn_khoi8_kho.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_khtn_khoi8.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
