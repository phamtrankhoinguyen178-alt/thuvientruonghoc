function startGame(){
gameRunning=true;
waiting=false;
currentQuestion=0;
selectedAnswer=null;
shipPosition=55;
document.getElementById("spaceship").style.left=shipPosition+"px";
document.getElementById("asteroid").classList.remove("show");
document.getElementById("questionBox").classList.remove("show");
document.getElementById("result").style.display="none";
document.getElementById("overlay").classList.remove("show");
document.getElementById("result").classList.remove("lose");
document.getElementById("startButton").innerHTML="🔄 PHI HÀNH LẠI";
document.getElementById("status").innerHTML="🚀 Tàu không gian đang bay qua vũ trụ...";
let shuffled=[...questionBank];
shuffled.sort(()=>Math.random()-.5);
gameQuestions=shuffled.slice(0,10);
updateProgress();
clearInterval(shipTimer);
clearTimeout(asteroidTimer);
shipTimer=setInterval(moveShip,100);
asteroidTimer=setTimeout(showAsteroid,5000);
}

if(!gameRunning||waiting)return;

let width=document.querySelector(".space").clientWidth;
if(shipPosition>width-220)shipPosition=55;
document.getElementById("spaceship").style.left=shipPosition+"px";
}

function showAsteroid(){
if(!gameRunning)return;
waiting=true;
document.getElementById("asteroid").classList.add("show");
document.getElementById("status").innerHTML="☄️ THIÊN THẠCH PHÍA TRƯỚC! Hãy trả lời câu hỏi!";
clearInterval(shipTimer);
showQuestion();
}

function showQuestion(){
let q=gameQuestions[currentQuestion];
selectedAnswer=null;
document.getElementById("question").innerHTML="Câu "+(currentQuestion+1)+": "+q[0];
let html="";
q[1].forEach((answer,index)=>{
html+=`<button class="answer" onclick="selectAnswer(${index})">${String.fromCharCode(65+index)}. ${answer}</button>`;
});
document.getElementById("answers").innerHTML=html;
document.getElementById("overlay").classList.add("show");
document.getElementById("questionBox").classList.add("show");
}

function selectAnswer(index){
selectedAnswer=index;
document.querySelectorAll(".answer").forEach(button=>button.classList.remove("selected"));
document.querySelectorAll(".answer")[index].classList.add("selected");
}

function correctEffect(){
const effect=document.createElement("div");
effect.className="correct-effect";
effect.innerHTML="🚀 CHÍNH XÁC!";
document.body.appendChild(effect);
setTimeout(()=>effect.remove(),800);
}

function checkAnswer(){
if(selectedAnswer===null){
alert("⚠️ Hãy chọn một đáp án!");
return;
}
if(selectedAnswer!==gameQuestions[currentQuestion][2]){
loseGame();
return;
}
correctEffect();
currentQuestion++;
document.getElementById("asteroid").classList.remove("show");
document.getElementById("questionBox").classList.remove("show");
document.getElementById("overlay").classList.remove("show");
updateProgress();
if(currentQuestion>=10){
winGame();
return;
}
waiting=false;
document.getElementById("status").innerHTML="✅ Chính xác! Tàu tiếp tục xuyên qua vũ trụ...";
shipTimer=setInterval(moveShip,100);
asteroidTimer=setTimeout(showAsteroid,5000);
}

function updateProgress(){
document.getElementById("progressBar").style.width=(currentQuestion/10*100)+"%";
document.getElementById("progressText").innerHTML="🌌 Đã vượt qua "+currentQuestion+"/10 thiên thạch";
}

function loseGame(){
gameRunning=false;
waiting=false;
clearInterval(shipTimer);
clearTimeout(asteroidTimer);
document.getElementById("questionBox").classList.remove("show");
document.getElementById("overlay").classList.remove("show");
document.getElementById("asteroid").classList.remove("show");
document.getElementById("result").style.display="block";
document.getElementById("result").classList.add("lose");
document.getElementById("resultTitle").innerHTML="💥 TÀU VŨ TRỤ GẶP NẠN!";
document.getElementById("resultText").innerHTML="❌ Bạn đã trả lời sai!<br><br>☄️ Bạn đã vượt qua "+currentQuestion+"/10 thiên thạch.<br><br>🚀 Hãy ôn lại kiến thức Tiếng Anh 9 và thử phi hành lần nữa!";
}

function winGame(){
gameRunning=false;
waiting=false;
clearInterval(shipTimer);
clearTimeout(asteroidTimer);
document.getElementById("questionBox").classList.remove("show");
document.getElementById("overlay").classList.remove("show");
document.getElementById("asteroid").classList.remove("show");
document.getElementById("progressBar").style.width="100%";
document.getElementById("progressText").innerHTML="🏆 HOÀN THÀNH 10/10!";
document.getElementById("status").innerHTML="🌌 Bạn đã chinh phục thành công vũ trụ Tiếng Anh 9!";
document.getElementById("result").style.display="block";
document.getElementById("resultTitle").innerHTML="🏆 CHINH PHỤC VŨ TRỤ!";
document.getElementById("resultText").innerHTML="🎉 XUẤT SẮC!<br><br>🚀 Bạn đã vượt qua cả 10 thiên thạch!<br><br>🇬🇧 Bạn đã hoàn thành màn chơi Trắc nghiệm Tiếng Anh 9!";
}
</script>
</body>
</html>
