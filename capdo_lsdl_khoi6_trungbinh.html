<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LỊCH SỬ VÀ ĐỊA LÝ KHỐI 6 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.back:hover {
    background: #333;
}
.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}
.player {
    color: #2878e8;
}
.bot {
    color: #e74c3c;
}
.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}
.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}
.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}
.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}
.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}
.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}
.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}
.result h1 {
    color: #2878e8;
}
.win {
    color: #2ecc71;
}
.lose {
    color: #e74c3c;
}
.draw {
    color: #f39c12;
}
.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_lsdl_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ LỊCH SỬ VÀ ĐỊA LÝ KHỐI 6 - CHẾ ĐỘ TRUNG BÌNH
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
 {
        q: "Người tinh khôn xuất hiện cách đây khoảng bao lâu?",
        a: ["Khoảng 4 triệu năm", "Khoảng 150 nghìn năm", "Khoảng 10 nghìn năm", "Khoảng 500 năm"],
        d: 1
    },

    {
        q: "Tỉ lệ bản đồ cho biết điều gì?",
        a: ["Độ cao của núi", "Nhiệt độ không khí", "Mức độ thu nhỏ khoảng cách trên bản đồ so với thực tế", "Lượng mưa"],
        d: 2
    },

    {
        q: "Lưỡng Hà cổ đại nằm giữa hai con sông nào?",
        a: ["Sông Nin và sông Hằng", "Sông Hoàng Hà và Trường Giang", "Sông Ti-grơ và Ơ-phơ-rát", "Sông Hồng và sông Cả"],
        d: 2
    },

    {
        q: "Trái Đất chuyển động quanh Mặt Trời theo quỹ đạo có dạng gì?",
        a: ["Hình vuông", "Hình elip gần tròn", "Đường thẳng", "Hình tam giác"],
        d: 1
    },

    {
        q: "Xã hội nguyên thủy tan rã chủ yếu do nguyên nhân nào?",
        a: ["Sự xuất hiện của máy móc", "Thiên tai biến mất", "Tư hữu và phân hóa giàu nghèo", "Con người không còn thức ăn"],
        d: 2
    },

    {
        q: "Cấu tạo bên trong Trái Đất gồm mấy lớp chính?",
        a: ["2 lớp", "3 lớp", "4 lớp", "5 lớp"],
        d: 1
    },

    {
        q: "Thành bang tiêu biểu của Hy Lạp cổ đại là gì?",
        a: ["A-ten", "Ai Cập", "Ba Tư", "Trung Quốc"],
        d: 0
    },

    {
        q: "Nội lực là lực sinh ra từ đâu?",
        a: ["Bên ngoài Trái Đất", "Mặt Trăng", "Bên trong Trái Đất", "Đại dương"],
        d: 2
    },

    {
        q: "Nhà nước La Mã cổ đại hình thành trên bán đảo nào?",
        a: ["Ban Căng", "I-ta-li-a", "A-rập", "Ấn Độ"],
        d: 1
    },

    {
        q: "Ngoại lực có nguồn gốc chủ yếu từ đâu?",
        a: ["Bên ngoài Trái Đất", "Trong nhân Trái Đất", "Trong lớp lõi", "Trong lớp manti"],
        d: 0
    },

    {
        q: "Văn minh Ấn Độ cổ đại hình thành chủ yếu ở lưu vực những con sông nào?",
        a: ["Sông Nin và sông Hằng", "Sông Ấn và sông Hằng", "Sông Ti-grơ và Ơ-phơ-rát", "Sông Hồng và sông Cả"],
        d: 1
    },

    {
        q: "Động đất là hiện tượng gì?",
        a: ["Mặt đất rung chuyển đột ngột", "Nước biển dâng lên", "Mưa kéo dài", "Gió thổi mạnh"],
        d: 0
    },

    {
        q: "Ai được coi là người sáng lập Phật giáo?",
        a: ["Khổng Tử", "Lão Tử", "Thích Ca Mâu Ni", "Mạnh Tử"],
        d: 2
    },

    {
        q: "Dụng cụ dùng để đo lượng mưa là gì?",
        a: ["Nhiệt kế", "Phong vũ biểu", "Vũ kế", "La bàn"],
        d: 2
    },

    {
        q: "Nhà nước Văn Lang ra đời vào khoảng thời gian nào?",
        a: ["Thế kỉ VII TCN", "Thế kỉ X", "Thế kỉ XV", "Thế kỉ XX"],
        d: 0
    },

    {
        q: "Gió là sự chuyển động của không khí từ nơi nào đến nơi nào?",
        a: ["Khí áp thấp đến khí áp cao", "Khí áp cao đến khí áp thấp", "Từ Nam lên Bắc", "Từ Đông sang Tây"],
        d: 1
    },

    {
        q: "Thành Cổ Loa là kinh đô của quốc gia nào?",
        a: ["Văn Lang", "Phù Nam", "Âu Lạc", "Chăm-pa"],
        d: 2
    },

    {
        q: "Đất có thành phần nào góp phần quyết định độ phì nhiêu?",
        a: ["Cát", "Sỏi", "Đá cuội", "Mùn"],
        d: 3
    },

    {
        q: "Thế vận hội Olympic có nguồn gốc từ quốc gia cổ đại nào?",
        a: ["Trung Quốc", "Hy Lạp", "Ấn Độ", "Ai Cập"],
        d: 1
    },

    {
        q: "Môi trường xích đạo có đặc điểm khí hậu như thế nào?",
        a: ["Nóng và mưa nhiều quanh năm", "Lạnh quanh năm", "Khô hạn quanh năm", "Có mùa đông rất lạnh"],
        d: 0
    },
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.5;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        
        <br>
        <button onclick="location.href='capdo_lsdl_khoi6_trungbinh.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_lsdl_khoi6.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
