
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiếng Anh 7 - Cấp độ HUYỀN THOẠI</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#74ebd5,#9face6);
    text-align:center;
    color:#333;
}

a{
    text-decoration:none;
}

.back{
    position:fixed;
    top:15px;
    left:15px;
    background:white;
    color:#333;
    padding:10px 18px;
    border-radius:10px;
    font-weight:bold;
}

h1{
    margin-top:65px;
    color:#fff;
}

.score{
    background:white;
    width:90%;
    max-width:600px;
    margin:20px auto;
    padding:15px;
    border-radius:15px;
    display:flex;
    justify-content:space-around;
    font-weight:bold;
    font-size:18px;
}

.player{
    color:#007bff;
}

.bot{
    color:#e53935;
}

.timer{
    color:#222;
}

.container{
    background:white;
    width:90%;
    max-width:650px;
    margin:20px auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px #0002;
}

#question{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.answer{
    display:block;
    width:100%;
    padding:13px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#eee;
    font-size:17px;
    cursor:pointer;
    transition:0.2s;
}

.answer:hover{
    background:#d6eaff;
}

.answer:disabled{
    cursor:not-allowed;
    opacity:1;
}

.correct{
    background:#4caf50 !important;
    color:white;
}

.wrong{
    background:#f44336 !important;
    color:white;
}

#result{
    display:none;
    background:white;
    width:90%;
    max-width:600px;
    margin:30px auto;
    padding:25px;
    border-radius:20px;
}

.home{
    display:inline-block;
    background:#2196f3;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    margin-top:15px;
}
</style>
</head>

<body>

<a href="capdo_anh_khoi7.html" class="back">⬅ Quay lại</a>

<h1>🔥 TIẾNG ANH 7 - CẤP ĐỘ HUYỀN THOẠI</h1>

<div class="score">
    <div class="player">Bạn: <span id="scoreBan">0</span></div>
    <div class="bot">Bot: <span id="scoreBot">0</span></div>
    <div class="timer">⏱ Thời gian: <span id="timer">15</span>s</div>
</div>

<div class="container" id="game">
    <h2 id="number">Câu 1/10</h2>
    <div id="question"></div>
    <div id="answers"></div>
    <p id="message"></p>
</div>

<div id="result">
    <h1 style="color:#333">🏆 KẾT QUẢ</h1>
    <h2 id="finalScore"></h2>
    <p id="comment"></p>
    <a href="khoi7.html" class="home">Về trang chủ</a>
    <br><br>
    <button class="answer" onclick="location.reload()">Chơi lại</button>
</div>

<script>
const cauHoi = [
{
    q:"If I _____ enough money, I would buy a new bicycle.",
    a:["have","had","will have","has"],
    d:1
},
{
    q:"She has _____ English since she was six.",
    a:["study","studies","studied","studying"],
    d:2
},
{
    q:"_____ he was tired, he finished his homework.",
    a:["Because","Although","So","Therefore"],
    d:1
},
{
    q:"The environment is becoming more and more _____.",
    a:["pollute","pollution","polluted","polluting"],
    d:2
},
{
    q:"What is the closest meaning of 'preserve'?",
    a:["Destroy","Protect","Forget","Waste"],
    d:1
},
{
    q:"This is the book _____ I borrowed from the library.",
    a:["who","where","which","when"],
    d:2
},
{
    q:"By the time we arrived, the film _____.",
    a:["starts","started","has started","had started"],
    d:3
},
{
    q:"Which word has a different stress pattern?",
    a:["Beautiful","Important","Expensive","Pollution"],
    d:0
},
{
    q:"She suggested _____ trees in the school garden.",
    a:["plant","to plant","planting","planted"],
    d:2
},
{
    q:"What does 'take part in' mean?",
    a:["Từ chối","Tham gia","Rời khỏi","Quên đi"],
    d:1
},
{
    q:"Neither my brother nor my sister _____ interested in football.",
    a:["are","were","is","be"],
    d:2
},
{
    q:"The more you practise, _____ you become.",
    a:["the good","the better","better","best"],
    d:1
},
{
    q:"English _____ in many countries around the world.",
    a:["speaks","is spoken","spoke","speaking"],
    d:1
},
{
    q:"We should turn off the lights _____ save electricity.",
    a:["so","because","in order to","although"],
    d:2
},
{
    q:"What does 'renewable energy' mean?",
    a:["Năng lượng hóa thạch","Năng lượng tái tạo","Năng lượng hạt nhân","Năng lượng mặt trời"],
    d:1
},
{
    q:"I wish I _____ speak English fluently.",
    a:["can","will","could","must"],
    d:2
},
{
    q:"This is the first time I _____ this beautiful place.",
    a:["visit","visited","have visited","am visiting"],
    d:2
},
{
    q:"What is the closest meaning of 'generous'?",
    a:["Kind and willing to give","Angry and rude","Lazy and careless","Quiet and shy"],
    d:0
},
{
    q:"Despite _____ heavily, they continued their journey.",
    a:["rain","raining","it rains","rained"],
    d:1
},
{
    q:"Recycling helps _____ the environment.",
    a:["protect","destroy","pollute","waste"],
    d:0
}
];

let danhSach = [...cauHoi].sort(() => Math.random() - 0.5).slice(0,10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGianBan = 15;
let timerBan;
let timerBot;
let timerChuyen;
let daTraLoi = false;
let botDaTraLoi = false;

function hienThi(){
    if(cau >= 10){
        ketThuc();
        return;
    }

    daTraLoi = false;
    botDaTraLoi = false;
    thoiGianBan = 15;

    document.getElementById("number").innerText = "Câu " + (cau+1) + "/10";
    document.getElementById("question").innerText = danhSach[cau].q;
    document.getElementById("timer").innerText = thoiGianBan;
    document.getElementById("message").innerText = "";

    let html = "";

    danhSach[cau].a.forEach((x,i)=>{
        html += `<button class="answer" onclick="traLoi(${i})">${String.fromCharCode(65+i)}. ${x}</button>`;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timerBan);
    clearTimeout(timerBot);

    timerBan = setInterval(()=>{
        thoiGianBan--;
        document.getElementById("timer").innerText = thoiGianBan;

        if(thoiGianBan <= 0){
            clearInterval(timerBan);
            if(!daTraLoi){
                traLoi(-1);
            }
        }
    },1000);

    timerBot = setTimeout(()=>{
        if(!botDaTraLoi){
            botTraLoi();
        }
    },10000);
}

function traLoi(chon){
    if(daTraLoi) return;

    daTraLoi = true;
    clearInterval(timerBan);

    let dung = danhSach[cau].d;
    let nut = document.querySelectorAll(".answer");

    nut.forEach((b,i)=>{
        b.disabled = true;

        if(i === dung){
            b.classList.add("correct");
        }

        if(i === chon && chon !== dung){
            b.classList.add("wrong");
        }
    });

    if(chon === dung){
        diemBan++;
        document.getElementById("message").innerText = "🎉 Chính xác!";
    }else if(chon === -1){
        document.getElementById("message").innerText = "⏰ Hết giờ!";
    }else{
        document.getElementById("message").innerText = "❌ Chưa chính xác!";
    }

    capNhatDiem();
    kiemTraChuyen();
}

function botTraLoi(){
    if(botDaTraLoi) return;

    botDaTraLoi = true;

    if(Math.random() < 0.75){
        diemBot++;
    }

    capNhatDiem();
    kiemTraChuyen();
}

function capNhatDiem(){
    document.getElementById("scoreBan").innerText = diemBan;
    document.getElementById("scoreBot").innerText = diemBot;
}

function kiemTraChuyen(){
    if(daTraLoi && botDaTraLoi){
        clearInterval(timerBan);
        clearTimeout(timerBot);

        timerChuyen = setTimeout(()=>{
            cau++;
            hienThi();
        },1000);
    }
}

function ketThuc(){
    clearInterval(timerBan);
    clearTimeout(timerBot);
    clearTimeout(timerChuyen);

    document.getElementById("game").style.display = "none";
    document.querySelector(".score").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").innerText =
        "Bạn: " + diemBan + "/10 | Bot: " + diemBot + "/10";

    let nhanXet = "";

    if(diemBan > diemBot){
        nhanXet = "🎉 Bạn đã chiến thắng!";
    }else if(diemBan < diemBot){
        nhanXet = "🤖 Bot đã chiến thắng!";
    }else{
        nhanXet = "🤝 Hai bên hòa nhau!";
    }

    document.getElementById("comment").innerText = nhanXet;
}

hienThi();
</script>

</body>
</html>
