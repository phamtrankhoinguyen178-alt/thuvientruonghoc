<title>Tiếng Anh 7 - Khó</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#250b0b,#5c1515,#210707);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.game{
    width:100%;
    max-width:950px;
    background:rgba(0,0,0,.65);
    border:2px solid #ff4b4b;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 35px rgba(255,50,50,.25);
}

h1{
    text-align:center;
    color:#ff7373;
    margin-bottom:25px;
}

.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.box{
    background:#3a1515;
    border:1px solid #a52b2b;
    border-radius:12px;
    text-align:center;
    padding:12px;
}

.box span{
    display:block;
    font-size:28px;
    font-weight:bold;
    margin-top:5px;
}

.progress{
    text-align:center;
    color:#ffadad;
    margin-bottom:15px;
}

.question{
    background:#321313;
    border-radius:15px;
    padding:25px;
    border:1px solid #8e2929;
    margin-bottom:20px;
}

.question h2{
    font-size:21px;
    line-height:1.5;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.answer{
    border:2px solid #a33131;
    border-radius:12px;
    background:#411919;
    color:white;
    padding:16px;
    font-size:17px;
    cursor:pointer;
}

.answer:hover{
    background:#642222;
}

.correct{
    background:#087c48!important;
    border-color:#20ed91!important;
}

.wrong{
    background:#8c2222!important;
    border-color:#ff5555!important;
}

.info{
    text-align:center;
    min-height:28px;
    margin-top:18px;
    font-size:18px;
}

#next{
    display:none;
    margin:20px auto 0;
    padding:13px 25px;
    border:none;
    border-radius:10px;
    background:#d52d2d;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#result{
    display:none;
    text-align:center;
}

#result h2{
    font-size:36px;
    margin-bottom:15px;
}

.result-score{
    font-size:23px;
    margin-bottom:25px;
}

.menu{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.menu button{
    padding:13px 20px;
    border:none;
    border-radius:10px;
    background:#922727;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:700px){
    .top{
        grid-template-columns:1fr 1fr;
    }

    .answers{
        grid-template-columns:1fr;
    }
}
</style>
</head>

let ds=[];
let i=0;
let diem=0;
let bot=0;
let time=15;
let botTime=7;
let daTraLoi=false;
let timer;
let botTimer;

function tron(a){
    return [...a].sort(()=>Math.random()-0.5);
}

function batDau(){
    ds=tron(nganHang).slice(0,10);
    i=0;
    diem=0;
    bot=0;

    document.getElementById("diem").textContent=0;
    document.getElementById("botDiem").textContent=0;
    document.getElementById("gameArea").style.display="block";
    document.getElementById("result").style.display="none";

    hienThi();
}

function hienThi(){
    clearInterval(timer);
    clearInterval(botTimer);

    daTraLoi=false;
    time=15;
    botTime=7;

    document.getElementById("tg").textContent=time;
    document.getElementById("botTg").textContent=botTime;
    document.getElementById("soCau").textContent=(i+1)+"/10";
    document.getElementById("progress").textContent="Câu "+(i+1)+" / 10";
    document.getElementById("cauHoi").textContent=ds[i].q;

    for(let j=0;j<4;j++){
        let b=document.getElementById("a"+j);
        b.textContent=String.fromCharCode(65+j)+". "+ds[i].a[j];
        b.className="answer";
        b.disabled=false;
    }

    document.getElementById("info").textContent="";
    document.getElementById("next").style.display="none";

    timer=setInterval(()=>{
        time--;
        document.getElementById("tg").textContent=time;

        if(time<=0){
            clearInterval(timer);
            hetGio();
        }
    },1000);

    botTimer=setInterval(()=>{
        botTime--;
        document.getElementById("botTg").textContent=botTime;

        if(botTime<=0){
            clearInterval(botTimer);
        }
    },1000);
}

function traLoi(x){
    if(daTraLoi)return;

    daTraLoi=true;

    clearInterval(timer);
    clearInterval(botTimer);

    let d=ds[i].d;

    for(let j=0;j<4;j++){
        document.getElementById("a"+j).disabled=true;
    }

    if(x===d){
        diem++;
        document.getElementById("diem").textContent=diem;
        document.getElementById("a"+x).classList.add("correct");
        document.getElementById("info").textContent="✓ Chính xác!";
    }else{
        document.getElementById("a"+x).classList.add("wrong");
        document.getElementById("a"+d).classList.add("correct");
        document.getElementById("info").textContent="✗ Sai rồi!";
    }

    botTraLoi();

    document.getElementById("next").style.display="block";
}

function hetGio(){
    if(daTraLoi)return;

    daTraLoi=true;

    clearInterval(botTimer);

    let d=ds[i].d;

    for(let j=0;j<4;j++){
        document.getElementById("a"+j).disabled=true;
    }

    document.getElementById("a"+d).classList.add("correct");
    document.getElementById("info").textContent="⌛ Hết thời gian!";

    botTraLoi();

    document.getElementById("next").style.display="block";
}

function botTraLoi(){
    if(Math.random()<0.75){
        bot++;
        document.getElementById("botDiem").textContent=bot;
    }
}

function cauTiep(){
    if(i<9){
        i++;
        hienThi();
    }else{
        ketThuc();
    }
}

function ketThuc(){
    clearInterval(timer);
    clearInterval(botTimer);

    document.getElementById("gameArea").style.display="none";
    document.getElementById("result").style.display="block";

    let kq;

    if(diem>bot){
        kq="🏆 BẠN THẮNG!";
    }else if(diem<bot){
        kq="🤖 BOT THẮNG!";
    }else{
        kq="🤝 HÒA!";
    }

    document.getElementById("ketQua").textContent=kq;

    document.getElementById("tongDiem").textContent=
        "Bạn: "+diem+" điểm | Bot: "+bot+" điểm";
}

function choiLai(){
    batDau();
}

batDau();
