<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LỊCH SỬ VÀ ĐỊA LÝ KHỐI 7 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.back:hover {
    background: #333;
}
.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}
.player {
    color: #2878e8;
}
.bot {
    color: #e74c3c;
}
.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}
.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}
.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}
.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}
.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}
.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}
.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}
.result h1 {
    color: #2878e8;
}
.win {
    color: #2ecc71;
}
.lose {
    color: #e74c3c;
}
.draw {
    color: #f39c12;
}
.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_lsdl_khoi7.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ LỊCH SỬ VÀ ĐỊA LÝ KHỐI 7 - CHẾ ĐỘ TRUNG BÌNH
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
{
        q: "Vì sao các thành thị trung đại Tây Âu ra đời?",
        a: ["Thủ công nghiệp và thương nghiệp phát triển", "Nông nghiệp biến mất", "Các lãnh địa bị xóa bỏ hoàn toàn", "Chiến tranh thế giới xảy ra"],
        d: 0
    },
    {
        q: "Đặc điểm nổi bật của địa hình châu Phi là gì?",
        a: ["Đồng bằng thấp chiếm phần lớn", "Cao nguyên và bồn địa chiếm diện tích lớn", "Chủ yếu là núi trẻ", "Toàn bộ là đồng bằng"],
        d: 1
    },
    {
        q: "Hội nghị Diên Hồng được tổ chức dưới triều đại nào?",
        a: ["Nhà Lý", "Nhà Hồ", "Nhà Trần", "Nhà Nguyễn"],
        d: 2
    },
    {
        q: "Dãy núi An-đét nằm ở khu vực nào?",
        a: ["Bắc Mỹ", "Châu Âu", "Châu Phi", "Nam Mỹ"],
        d: 3
    },
    {
        q: "Ai là tác giả của tác phẩm Bình Ngô đại cáo?",
        a: ["Nguyễn Trãi", "Lê Lợi", "Ngô Sĩ Liên", "Chu Văn An"],
        d: 0
    },
    {
        q: "Đặc điểm dân cư nổi bật của châu Âu hiện nay là gì?",
        a: ["Dân số tăng rất nhanh", "Dân số già", "Dân số hoàn toàn trẻ", "Không có đô thị"],
        d: 1
    },
    {
        q: "Nhà Hồ được thành lập vào năm nào?",
        a: ["1288", "1428", "1400", "1225"],
        d: 2
    },
    {
        q: "Châu Á có những kiểu khí hậu nào?",
        a: ["Chỉ có khí hậu nhiệt đới", "Chỉ có khí hậu ôn đới", "Chỉ có khí hậu hàn đới", "Đa dạng từ cực đến nhiệt đới"],
        d: 3
    },
    {
        q: "Chiến thắng Chi Lăng - Xương Giang diễn ra năm nào?",
        a: ["1427", "1288", "1400", "1789"],
        d: 0
    },
    {
        q: "Đặc điểm nào đúng về khí hậu châu Âu?",
        a: ["Chủ yếu là khí hậu nhiệt đới", "Phần lớn thuộc đới ôn hòa", "Toàn bộ thuộc hàn đới", "Không có sự phân hóa khí hậu"],
        d: 1
    },
    {
        q: "Ai là người lãnh đạo cuộc khởi nghĩa Tây Sơn?",
        a: ["Lê Lợi", "Nguyễn Trãi", "Ba anh em Nguyễn Nhạc, Nguyễn Huệ, Nguyễn Lữ", "Trần Quốc Tuấn"],
        d: 2
    },
    {
        q: "Đâu là khu vực có mật độ dân số cao ở châu Á?",
        a: ["Bắc Xi-bia", "Hoang mạc A-rập", "Vùng núi Hi-ma-lay-a", "Đông Á và Nam Á"],
        d: 3
    },
    {
        q: "Bộ luật Hồng Đức được ban hành dưới triều đại nào?",
        a: ["Nhà Lê sơ", "Nhà Trần", "Nhà Hồ", "Nhà Nguyễn"],
        d: 0
    },
    {
        q: "Rừng A-ma-dôn chủ yếu thuộc quốc gia nào?",
        a: ["Ai Cập", "Bra-xin", "Trung Quốc", "Ấn Độ"],
        d: 1
    },
    {
        q: "Ai là người chỉ huy chiến thắng Rạch Gầm - Xoài Mút năm 1785?",
        a: ["Trần Hưng Đạo", "Lê Lợi", "Nguyễn Huệ", "Lý Thường Kiệt"],
        d: 2
    },
    {
        q: "Địa hình đồng bằng chiếm phần lớn diện tích khu vực nào của châu Âu?",
        a: ["Phía nam", "Phía tây nam", "Các đảo phía bắc", "Phía đông và trung tâm"],
        d: 3
    },
    {
        q: "Vương triều Mô-gôn được thành lập ở quốc gia nào?",
        a: ["Ấn Độ", "Trung Quốc", "Nhật Bản", "Triều Tiên"],
        d: 0
    },
    {
        q: "Đại Việt sử kí toàn thư gắn liền với tên tuổi nhà sử học nào?",
        a: ["Nguyễn Trãi", "Ngô Sĩ Liên", "Lê Quý Đôn", "Phan Huy Chú"],
        d: 1
    },
    {
        q: "Dòng biển lạnh Pê-ru ảnh hưởng đến khu vực nào?",
        a: ["Bờ đông châu Phi", "Bờ tây châu Âu", "Bờ tây Nam Mỹ", "Bờ đông châu Á"],
        d: 2
    },
    {
        q: "Nguyên nhân quan trọng giúp nhà Trần ba lần đánh bại quân Mông - Nguyên là gì?",
        a: ["Chỉ nhờ thành lũy", "Quân địch không có vũ khí", "Không có chiến tranh", "Đoàn kết toàn dân và chiến lược đúng đắn"],
        d: 3
    },
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.5;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        <p>Bot có 50% xác suất trả lời đúng mỗi câu.</p>
        <br>
        <button onclick="location.href='capdo_lsdl_khoi7_trungbinh.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_lsdl_khoi7.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
