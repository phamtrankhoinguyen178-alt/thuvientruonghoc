
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiếng Anh 9 - Địa ngục</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 10px 18px;
    background: white;
    color: #2878e8;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 3px 8px #0002;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    align-items: center;
    text-align: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px;
    border-radius: 12px;
}

.main {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer.disabled {
    pointer-events: none;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.status {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    font-size: 36px;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result h2 {
    margin: 12px;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width:600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 14px;
        gap: 5px;
    }

    .time {
        padding: 9px 4px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }

    .answer {
        font-size: 16px;
    }

    .result {
        padding: 20px;
    }
}
</style>
</head>

<body>

<a class="back" href="capdo_anh_khoi9.html">
    ⬅ Quay về
</a>

<div class="top">

    <div class="player">
        👤 Bạn: <span id="playerScore">0</span>
    </div>

    <div class="time">
        ⏱ Bạn: <span id="timer">15</span>s
    </div>

    <div class="bot">
        🤖 Bot: <span id="botScore">0</span>
    </div>

</div>

<div class="main">

    <div class="title">
        🔥 TIẾNG ANH KHỐI 9 - ĐỊA NGỤC
    </div>

    <div id="game" class="card">

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="status" id="status">
            🤖 Bot đang suy nghĩ...
        </div>

    </div>

    <div class="info">
        Câu <span id="number">1</span>/20
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [

{
    q: "Choose the correct answer: Had it not been for your help, I _____ the project on time.",
    a: [
        "wouldn't complete",
        "wouldn't have completed",
        "didn't complete",
        "won't complete"
    ],
    d: 1
},

{
    q: "Choose the correct answer: Scarcely _____ the room when the phone rang.",
    a: [
        "I had entered",
        "had I entered",
        "I entered",
        "did I entered"
    ],
    d: 1
},

{
    q: "Choose the correct answer: If he _____ the warning, he wouldn't be in trouble now.",
    a: [
        "had taken",
        "would take",
        "takes",
        "has taken"
    ],
    d: 0
},

{
    q: "Choose the correct answer: The proposal, _____ carefully, was finally accepted.",
    a: [
        "having examined",
        "having been examined",
        "examining",
        "to examine"
    ],
    d: 1
},

{
    q: "Choose the correct answer: It is high time the government _____ action against pollution.",
    a: [
        "takes",
        "took",
        "will take",
        "has taken"
    ],
    d: 1
},

{
    q: "Choose the correct answer: Not until the evidence was presented _____ the truth.",
    a: [
        "they realized",
        "did they realize",
        "they had realized",
        "had they realized"
    ],
    d: 1
},

{
    q: "What is the closest meaning of 'ubiquitous'?",
    a: [
        "Existing everywhere",
        "Very expensive",
        "Extremely rare",
        "Difficult to understand"
    ],
    d: 0
},

{
    q: "Choose the correct answer: The manager demanded that the report _____ immediately.",
    a: [
        "is submitted",
        "be submitted",
        "was submitted",
        "submits"
    ],
    d: 1
},

{
    q: "Choose the correct answer: Much as I _____ to help, I simply don't have enough time.",
    a: [
        "would like",
        "will like",
        "am liking",
        "liked"
    ],
    d: 0
},

{
    q: "Choose the correct answer: The more carefully you plan, _____ likely you are to succeed.",
    a: [
        "the more",
        "more",
        "the most",
        "most"
    ],
    d: 0
},

{
    q: "Choose the correct answer: Were the company _____ its policy, many employees would benefit.",
    a: [
        "change",
        "changed",
        "to change",
        "changing"
    ],
    d: 2
},

{
    q: "Choose the correct answer: She talks as though she _____ everything about the subject.",
    a: [
        "knows",
        "knew",
        "has known",
        "will know"
    ],
    d: 1
},

{
    q: "What does 'ambiguous' mean?",
    a: [
        "Clear and certain",
        "Having more than one possible meaning",
        "Completely false",
        "Easy to remember"
    ],
    d: 1
},

{
    q: "Choose the correct answer: The scientist is believed _____ a major discovery.",
    a: [
        "to make",
        "making",
        "to have made",
        "made"
    ],
    d: 2
},

{
    q: "Choose the correct answer: Only after the meeting _____ the importance of the decision.",
    a: [
        "we understood",
        "did we understand",
        "we did understand",
        "had we understand"
    ],
    d: 1
},

{
    q: "Choose the correct answer: I would sooner you _____ the matter with anyone.",
    a: [
        "don't discuss",
        "didn't discuss",
        "won't discuss",
        "not discuss"
    ],
    d: 1
},

{
    q: "Choose the correct answer: The book is worth _____ several times.",
    a: [
        "to read",
        "read",
        "reading",
        "to reading"
    ],
    d: 2
},

{
    q: "Choose the correct answer: So difficult _____ that nobody could solve it.",
    a: [
        "the problem was",
        "was the problem",
        "the problem is",
        "is the problem"
    ],
    d: 1
},

{
    q: "What is the closest meaning of 'meticulous'?",
    a: [
        "Extremely careful and precise",
        "Very impatient",
        "Careless and untidy",
        "Unusually brave"
    ],
    d: 0
},

{
    q: "Choose the correct sentence.",
    a: [
        "No sooner I had arrived than it started raining.",
        "No sooner had I arrived than it started raining.",
        "No sooner did I arrived than it started raining.",
        "No sooner I arrived when it started raining."
    ],
    d: 1
},

{
    q: "Choose the correct answer: If only I _____ more attention during the lesson yesterday!",
    a: [
        "paid",
        "had paid",
        "would pay",
        "have paid"
    ],
    d: 1
},

{
    q: "Choose the correct answer: The issue is too complicated _____ in a few minutes.",
    a: [
        "to explain",
        "explaining",
        "explained",
        "explain"
    ],
    d: 0
},

{
    q: "Choose the correct answer: Little _____ that his decision would have such serious consequences.",
    a: [
        "he suspected",
        "did he suspect",
        "he did suspect",
        "had he suspected"
    ],
    d: 1
},

{
    q: "Choose the correct answer: The candidate, _____ qualifications were outstanding, received the position.",
    a: [
        "who",
        "whom",
        "whose",
        "which"
    ],
    d: 2
}

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);

danhSach = danhSach.slice(0, 20);

let cau = 0;

let diemBan = 0;
let diemBot = 0;

let thoiGianBan = 15;

let timerBan;
let timerBot;
let timerChuyenCau;

let daTraLoi = false;
let botDaTraLoi = false;

function hienThiCau() {

    daTraLoi = false;
    botDaTraLoi = false;

    thoiGianBan = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = 15;

    document.getElementById("question").innerText =
        danhSach[cau].q;

    document.getElementById("status").innerText =
        "🤖 Bot đang suy nghĩ...";

    let html = "";

    danhSach[cau].a.forEach((x, i) => {

        html += `
            <div class="answer"
                onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;

    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timerBan);
    clearTimeout(timerBot);
    clearTimeout(timerChuyenCau);

    timerBan = setInterval(() => {

        thoiGianBan--;

        document.getElementById("timer").innerText =
            thoiGianBan;

        if (thoiGianBan <= 0) {

            clearInterval(timerBan);

            hetThoiGian();

        }

    }, 1000);

    timerBot = setTimeout(() => {

        botTraLoi();

    }, 10000);

}

function traLoi(chon, element) {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timerBan);

    let dung = danhSach[cau].d;

    if (chon === dung) {

        diemBan++;

        element.classList.add("correct");

    } else {

        element.classList.add("wrong");

        document.querySelectorAll(".answer")[dung]
        .classList.add("correct");

    }

    document.getElementById("playerScore").innerText =
        diemBan;

    document.getElementById("status").innerText =
        "👤 Bạn đã trả lời! Bot vẫn đang suy nghĩ...";

}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    let dung = danhSach[cau].d;

    document.querySelectorAll(".answer")[dung]
    .classList.add("correct");

    document.getElementById("status").innerText =
        "⏰ Bạn hết thời gian! Bot vẫn đang suy nghĩ...";

}

function botTraLoi() {

    if (botDaTraLoi) return;

    botDaTraLoi = true;

    let dung = Math.random() < 0.95;

    if (dung) {

        diemBot++;

        document.getElementById("status").innerText =
            "🤖 Bot trả lời đúng!";

    } else {

        document.getElementById("status").innerText =
            "🤖 Bot trả lời sai!";

    }

    document.getElementById("botScore").innerText =
        diemBot;

    timerChuyenCau = setTimeout(() => {

        cau++;

        if (cau >= 20) {

            ketThucTran();

        } else {

            hienThiCau();

        }

    }, 1000);

}

function ketThucTran() {

    clearInterval(timerBan);
    clearTimeout(timerBot);
    clearTimeout(timerChuyenCau);

    document.getElementById("game").style.display =
        "none";

    document.querySelector(".info").style.display =
        "none";

    document.querySelector(".title").style.display =
        "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có cùng số điểm.</p>
        `;

    }

    result.innerHTML = `

        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>⏱ Bạn: 15 giây/câu</p>

        

        <br>

        <button onclick="location.reload()">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='khoi9.html'">
            🏠 Về chọn môn
        </button>

    `;

}

hienThiCau();

</script>

</body>
</html>
