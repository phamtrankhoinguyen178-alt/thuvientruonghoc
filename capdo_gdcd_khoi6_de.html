
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDCD 6 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.win {
    color: #2ecc71 !important;
}

.lose {
    color: #e74c3c !important;
}

.draw {
    color: #f39c12 !important;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_gdcd_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ GDCD KHỐI 6 - CHẾ ĐỘ Tân binh
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [

    {
        q: "Truyền thống gia đình, dòng họ là gì?",
        a: [
            "Những giá trị tốt đẹp được lưu truyền qua các thế hệ",
            "Những trò chơi hiện đại",
            "Những món đồ đắt tiền",
            "Những việc làm không tốt"
        ],
        d: 0
    },

    {
        q: "Biểu hiện nào thể hiện lòng yêu thương con người?",
        a: [
            "Chế giễu người gặp khó khăn",
            "Giúp đỡ người có hoàn cảnh khó khăn",
            "Thờ ơ với mọi người",
            "Nói xấu bạn bè"
        ],
        d: 1
    },

    {
        q: "Siêng năng là gì?",
        a: [
            "Lười biếng, ngại làm việc",
            "Làm việc tùy hứng",
            "Chăm chỉ, thường xuyên làm việc",
            "Chỉ làm khi được nhắc nhở"
        ],
        d: 2
    },

    {
        q: "Kiên trì có nghĩa là gì?",
        a: [
            "Tân binh dàng bỏ cuộc",
            "Quyết tâm làm đến cùng dù gặp khó khăn",
            "Trốn tránh nhiệm vụ",
            "Chỉ làm việc mình thích"
        ],
        d: 1
    },

    {
        q: "Tôn trọng sự thật là gì?",
        a: [
            "Che giấu mọi lỗi lầm",
            "Nói sai sự thật để có lợi",
            "Suy nghĩ và hành động theo sự thật",
            "Đổ lỗi cho người khác"
        ],
        d: 2
    },

    {
        q: "Hành vi nào thể hiện tự lập?",
        a: [
            "Tự giác làm bài tập",
            "Luôn nhờ người khác làm hộ",
            "Chờ bố mẹ chuẩn bị mọi thứ",
            "Không tự chăm sóc bản thân"
        ],
        d: 0
    },

    {
        q: "Tự nhận thức bản thân giúp chúng ta điều gì?",
        a: [
            "Hiểu rõ điểm mạnh và điểm yếu của mình",
            "Luôn cho mình là đúng",
            "Không cần học hỏi",
            "Không cần sửa chữa khuyết điểm"
        ],
        d: 0
    },

    {
        q: "Hành vi nào thể hiện lòng tự trọng?",
        a: [
            "Gian lận trong kiểm tra",
            "Nhận lỗi khi mắc sai lầm",
            "Nói dối để tránh bị phạt",
            "Đổ lỗi cho bạn"
        ],
        d: 1
    },

    {
        q: "Yêu thương con người được thể hiện qua việc nào?",
        a: [
            "Quan tâm, chia sẻ và giúp đỡ người khác",
            "Ích kỉ với mọi người",
            "Bắt nạt bạn bè",
            "Không quan tâm đến người xung quanh"
        ],
        d: 0
    },

    {
        q: "Việc làm nào thể hiện sống có trách nhiệm?",
        a: [
            "Không hoàn thành nhiệm vụ",
            "Đổ lỗi cho người khác",
            "Tự giác thực hiện nhiệm vụ được giao",
            "Trốn tránh công việc"
        ],
        d: 2
    },

    {
        q: "Khi bạn mắc lỗi, em nên làm gì?",
        a: [
            "Chế giễu bạn",
            "Khuyên bạn nhận lỗi và sửa lỗi",
            "Lan truyền lỗi của bạn",
            "Xa lánh bạn"
        ],
        d: 1
    },

    {
        q: "Hành động nào thể hiện bảo vệ môi trường?",
        a: [
            "Vứt rác xuống sông",
            "Chặt phá cây xanh",
            "Phân loại và bỏ rác đúng nơi quy định",
            "Đốt rác bừa bãi"
        ],
        d: 2
    },

    {
        q: "Khi gặp khó khăn trong học tập, em nên làm gì?",
        a: [
            "Bỏ học",
            "Không làm bài nữa",
            "Kiên trì tìm cách giải quyết và nhờ hỗ trợ khi cần",
            "Chép bài của bạn"
        ],
        d: 2
    },

    {
        q: "Việc nào thể hiện tôn trọng người khác?",
        a: [
            "Ngắt lời khi người khác đang nói",
            "Lắng nghe ý kiến của mọi người",
            "Chế giễu ý kiến của bạn",
            "Ép mọi người làm theo mình"
        ],
        d: 1
    },

    {
        q: "Khi nhặt được đồ của người khác, em nên làm gì?",
        a: [
            "Giữ lại sử dụng",
            "Đem bán",
            "Vứt đi",
            "Tìm cách trả lại người đánh mất"
        ],
        d: 3
    }

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
       
        <br>
        <button onclick="location.href='capdo_gdcd_khoi6_de.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_gdcd_khoi6.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
