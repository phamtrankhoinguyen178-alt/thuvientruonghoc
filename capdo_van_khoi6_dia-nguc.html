<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 6 - BẤT TỬ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff416c, #4b0000);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #111;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 5px #000;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0005;
}

.question {
    font-size: 23px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
    color: #222;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer:disabled {
    cursor: not-allowed;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0005;
}

.result h1 {
    color: #2878e8;
}

.result p {
    font-size: 19px;
}

.win {
    color: #2ecc71 !important;
}

.lose {
    color: #e74c3c !important;
}

.draw {
    color: #f39c12 !important;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_van_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">10</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">🔥 NGỮ VĂN 6 - CẤP ĐỘ BẤT TỬ 🔥</div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

        ],

    {

        answers: [

            "Chỉ nhận xét độ dài của chi tiết"
        ],
        correct: 0
    },
    {
        question: "Một bài văn kể chuyện có trình tự sự việc lộn xộn sẽ gây ra điều gì?",
        answers: [
            "Làm câu chuyện hấp dẫn hơn trong mọi trường hợp",

        correct: 1

    {
        question: "Nếu một câu văn có quá nhiều từ ngữ lặp lại không cần thiết, em nên làm gì?",
        answers: [

        question: "Khi đọc một văn bản có nhân vật hành động vì lợi ích cộng đồng, em nên rút ra điều gì?",

    {

    {

            "Chỉ dựa vào ngoại hình",
            "Dựa vào lời nói, hành động, suy nghĩ và hoàn cảnh của nhân vật",

        ],
        correct: 2
    },
    {
        question: "Vì sao cần đọc kĩ nhan đề của một văn bản?",
        answers: [
            "Để biết chính xác số trang",
            "Để biết tên nhà xuất bản",
            "Để biết ngày in sách",
            "Vì nhan đề thường gợi mở nội dung hoặc chủ đề văn bản"
        ],
        correct: 3
    },
    {
        question: "Một bài văn biểu cảm muốn tạo ấn tượng cần có yếu tố nào?",
        answers: [
            "Cảm xúc chân thành kết hợp với hình ảnh, chi tiết phù hợp",
            "Chỉ có những câu dài",

    {

        ],
        correct: 1
    },
    {
        question: "Điều gì thể hiện khả năng đọc hiểu sâu một tác phẩm?",
        answers: [
            "Chỉ nhớ tên tác giả",
            "Chỉ thuộc một câu văn",
            "Hiểu nội dung, nghệ thuật và biết liên hệ với cuộc sống",
            "Chỉ đếm số đoạn"
        ],
        correct: 2
    },
    {
        question: "Mục đích quan trọng nhất của việc học Ngữ văn là gì?",
        answers: [
            "Chỉ ghi nhớ thật nhiều định nghĩa",
            "Chỉ học thuộc lòng văn bản",
            "Chỉ làm bài kiểm tra",
            "Phát triển năng lực ngôn ngữ, cảm thụ văn học và hiểu biết cuộc sống"
        ],
        correct: 3
    }


];

let ds = [...cauHoi].sort(() => Math.random() - 0.5).slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let tg = 10;
let timer;
let daTraLoi = false;

function hienThiCau() {

    clearInterval(timer);
    daTraLoi = false;
    tg = 10;

    document.getElementById("timer").textContent = tg;
    document.getElementById("playerScore").textContent = diemBan;
    document.getElementById("botScore").textContent = diemBot;
    document.getElementById("number").textContent = cau + 1;

    let c = ds[cau];

    document.getElementById("question").textContent =
        "Câu " + (cau + 1) + "/10: " + c.q;

    document.getElementById("answers").innerHTML = c.a.map((x, j) => `
        <button class="answer" onclick="traLoi(${j}, this)">
            ${String.fromCharCode(65 + j)}. ${x}
        </button>
    `).join("");

    timer = setInterval(() => {

        tg--;

        document.getElementById("timer").textContent = tg;

        if (tg <= 0) {
            hetThoiGian();
        }

    }, 1000);
}

function traLoi(chon, el) {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    if (chon === c.d) {

        diemBan++;
        el.classList.add("correct");

    } else {

        el.classList.add("wrong");
        nut[c.d].classList.add("correct");

    }

    document.getElementById("playerScore").textContent = diemBan;

    setTimeout(botTraLoi, 700);
}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    nut[c.d].classList.add("correct");

    setTimeout(botTraLoi, 700);
}

function botTraLoi() {

    let dung = Math.random() < 0.95;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").textContent = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {

    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 CHIẾN THẮNG BẤT TỬ!</h1>
            <p>Thật xuất sắc! Bạn đã vượt qua thử thách HUYỀN THOẠI nhất.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">🔥 BOT CHIẾN THẮNG!</h1>
            <p>Đây là cấp độ thử thách cao nhất. Hãy tiếp tục luyện tập!</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Bạn đã ngang tài với Bot!</p>
        `;

    }

    result.innerHTML = `
        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>💀 Cấp độ: BẤT TỬ</p>
        <p>Thời gian: 10 giây/câu</p>
        

        <br>

        <button onclick="location.reload()">🔄 Chơi lại</button>

        <button onclick="location.href='capdo_van_khoi6.html'">
            🎚️ Chọn cấp độ
        </button>

        <button onclick="location.href='khoi6.html'">
            🏠 Về chọn môn
        </button>
    `;
}

hienThiCau();

</script>

</html>
