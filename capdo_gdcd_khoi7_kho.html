
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDCD 7 - Chế độ khó</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #8e2de2, #4a00e0);
    min-height: 100vh;
}
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.back:hover {
    background: #111;
}
.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}
.player {
    color: #2878e8;
}
.bot {
    color: #e74c3c;
}
.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}
.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
    font-weight: bold;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}
.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}
.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}
.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}
.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}
.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}
.result h1 {
    color: #2878e8;
}
.win {
    color: #2ecc71;
}
.lose {
    color: #e74c3c;
}
.draw {
    color: #f39c12;
}
.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }
    .top {
        font-size: 16px;
    }
    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_gdcd_khoi7.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">12</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        🔥 GDCD KHỐI 7 - CHẾ ĐỘ KHÓ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [

{
    q: "Một người bạn thân nhờ em xác nhận sai sự thật để giúp bạn tránh bị xử lí. Cách ứng xử phù hợp nhất là gì?",
    a: [
        "Đồng ý vì tình bạn quan trọng hơn",
        "Nói dối để bảo vệ bạn",
        "Từ chối nói sai sự thật và khuyên bạn nhận trách nhiệm",
        "Im lặng nhưng đồng ý với lời nói của bạn"
    ],
    d: 2
},

{
    q: "Một người luôn thực hiện lời hứa dù gặp khó khăn. Điều đó thể hiện phẩm chất nào?",
    a: [
        "Giữ chữ tín",
        "Ích kỉ",
        "Thiếu trách nhiệm",
        "Tự cao"
    ],
    d: 0
},

{
    q: "Khi thấy bạn bị bắt nạt trên mạng xã hội, hành động nào phù hợp nhất?",
    a: [
        "Chia sẻ bài viết để nhiều người biết",
        "Tham gia bình luận chế giễu",
        "Lưu giữ thông tin cần thiết, động viên bạn và báo người lớn đáng tin cậy",
        "Đăng thông tin cá nhân của người bắt nạt"
    ],
    d: 2
},

{
    q: "Một học sinh thường xuyên đạt điểm cao nhờ chép bài của bạn. Hành vi đó cho thấy điều gì?",
    a: [
        "Có tinh thần tự giác",
        "Thiếu trung thực và thiếu tự giác trong học tập",
        "Biết hợp tác",
        "Có trách nhiệm với bản thân"
    ],
    d: 1
},

{
    q: "Khi giúp đỡ người khác, hành động nào thể hiện lòng yêu thương con người đúng đắn?",
    a: [
        "Giúp đỡ để được nổi tiếng",
        "Giúp đỡ chân thành, phù hợp với khả năng và tôn trọng người được giúp",
        "Làm thay mọi việc khiến người khác phụ thuộc",
        "Giúp đỡ rồi kể công với mọi người"
    ],
    d: 1
},

{
    q: "Nếu đã hứa tham gia một hoạt động tập thể nhưng bất ngờ có việc gia đình quan trọng, em nên làm gì?",
    a: [
        "Tự ý bỏ đi mà không thông báo",
        "Nói dối rằng mình bị ốm",
        "Thông báo sớm, giải thích trung thực và tìm cách phối hợp",
        "Đổ lỗi cho người khác"
    ],
    d: 2
},

{
    q: "Một thành viên trong nhóm có ý kiến khác với đa số. Nhóm nên làm gì?",
    a: [
        "Gạt bỏ ý kiến đó ngay lập tức",
        "Lắng nghe, phân tích ưu nhược điểm và lựa chọn phương án phù hợp",
        "Không cho thành viên đó phát biểu",
        "Bắt thành viên đó làm theo số đông"
    ],
    d: 1
},

{
    q: "Vì sao lòng yêu thương con người không đồng nghĩa với việc bao che lỗi sai?",
    a: [
        "Vì bao che có thể khiến người mắc lỗi không nhận ra và sửa chữa sai lầm",
        "Vì không cần quan tâm đến người khác",
        "Vì mọi lỗi sai đều không thể tha thứ",
        "Vì giúp đỡ người khác là không cần thiết"
    ],
    d: 0
},

{
    q: "Một học sinh có khả năng học tốt nhưng thường xuyên không chuẩn bị bài. Biện pháp phù hợp nhất là:",
    a: [
        "Chỉ học khi sắp kiểm tra",
        "Lập kế hoạch học tập, chủ động thực hiện và tự đánh giá kết quả",
        "Chờ bạn nhắc nhở",
        "Bỏ qua những môn mình không thích"
    ],
    d: 1
},

{
    q: "Trong hoạt động từ thiện, cách làm nào thể hiện sự tôn trọng người có hoàn cảnh khó khăn?",
    a: [
        "Công khai hình ảnh riêng tư của họ khi chưa được đồng ý",
        "Đưa ra lời nhận xét thiếu tế nhị",
        "Hỗ trợ phù hợp và bảo vệ phẩm giá, quyền riêng tư của họ",
        "Ép buộc họ phải nhận quà"
    ],
    d: 2
},

{
    q: "Một người bạn nhiều lần thất hứa nhưng luôn đưa ra lí do. Em nên:",
    a: [
        "Tin tưởng tuyệt đối mà không cần xem xét",
        "Góp ý chân thành và đánh giá sự đáng tin cậy qua hành động thực tế",
        "Bắt chước cách làm của bạn",
        "Nói xấu bạn với mọi người"
    ],
    d: 1
},

{
    q: "Khi nhận được một thông tin chưa xác thực về thầy cô trên mạng, em nên:",
    a: [
        "Chia sẻ ngay",
        "Thêm bình luận suy đoán",
        "Không lan truyền, kiểm chứng thông tin từ nguồn đáng tin cậy",
        "Tự tạo thêm thông tin"
    ],
    d: 2
},

{
    q: "Một học sinh nhận ra mình đã đối xử thiếu công bằng với bạn trong nhóm. Việc làm thể hiện trách nhiệm nhất là:",
    a: [
        "Giả vờ không biết",
        "Thừa nhận sai sót, xin lỗi và điều chỉnh cách ứng xử",
        "Đổ lỗi cho nhóm trưởng",
        "Tránh làm việc chung với bạn"
    ],
    d: 1
},

{
    q: "Trong một nhiệm vụ chung, nếu chỉ một người làm toàn bộ công việc, kết quả nào có thể xảy ra?",
    a: [
        "Mọi thành viên đều phát triển như nhau",
        "Tinh thần hợp tác và trách nhiệm của các thành viên bị hạn chế",
        "Nhóm luôn đạt kết quả tốt nhất",
        "Không có ảnh hưởng gì"
    ],
    d: 1
},

{
    q: "Một người bạn có hoàn cảnh khó khăn thường từ chối nhận sự giúp đỡ. Em nên:",
    a: [
        "Ép bạn nhận quà",
        "Chê trách bạn",
        "Tôn trọng bạn, hỏi xem bạn cần hỗ trợ gì và giúp đỡ phù hợp",
        "Kể hoàn cảnh của bạn cho mọi người"
    ],
    d: 2
},

{
    q: "Khi phải lựa chọn giữa việc nói thật và việc che giấu sai phạm để giữ thành tích, em nên:",
    a: [
        "Che giấu để giữ điểm cao",
        "Thành thật và chịu trách nhiệm về hành vi của mình",
        "Nhờ bạn nói dối hộ",
        "Xóa bỏ bằng chứng"
    ],
    d: 1
},

{
    q: "Một học sinh chỉ giúp đỡ bạn khi có lợi ích cho bản thân. Hành động đó chưa thể hiện đầy đủ phẩm chất nào?",
    a: [
        "Yêu thương con người chân thành",
        "Tính cẩn thận",
        "Khả năng ghi nhớ",
        "Tinh thần tiết kiệm"
    ],
    d: 0
},

{
    q: "Khi có bất đồng trong nhóm, phương pháp nào giúp giải quyết hiệu quả nhất?",
    a: [
        "Áp đặt ý kiến cá nhân",
        "Từ chối trao đổi",
        "Lắng nghe, tôn trọng và tìm tiếng nói chung",
        "Chia nhóm thành các phe đối lập"
    ],
    d: 2
},

{
    q: "Một học sinh đặt mục tiêu học tập rất cao nhưng không thực hiện kế hoạch. Điều cần thiết nhất là:",
    a: [
        "Tiếp tục đặt mục tiêu cao hơn",
        "Điều chỉnh mục tiêu phù hợp và kiên trì thực hiện từng bước",
        "Đổ lỗi cho hoàn cảnh",
        "Ngừng học tập"
    ],
    d: 1
},

{
    q: "Trong các hành vi sau, hành vi nào thể hiện tổng hợp sự trung thực, trách nhiệm và giữ chữ tín?",
    a: [
        "Nhận lỗi, thực hiện cam kết và sửa chữa hậu quả do mình gây ra",
        "Che giấu sai lầm để bảo vệ thành tích",
        "Hứa nhiều nhưng không thực hiện",
        "Đổ lỗi cho người khác khi gặp khó khăn"
    ],
    d: 0
}

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 12;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 12;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    document.querySelectorAll(".answer").forEach(x => {
        x.style.pointerEvents = "none";
    });

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.8;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Xuất sắc! Bạn đã đánh bại Bot khó!</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">🔥 BẠN THUA!</h1>
            <p>Bot khó đã chiến thắng!</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Bạn đã ngang tài ngang sức với Bot!</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        
        <br>

        <button onclick="location.href='capdo_gdcd_khoi7_kho.html'">
            Chơi lại
        </button>

        <button onclick="location.href='capdo_gdcd_khoi7.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
