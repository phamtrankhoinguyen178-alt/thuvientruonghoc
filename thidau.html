<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Thi đấu với Bot</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
min-height:100vh;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white
}
header{
text-align:center;
padding:40px 15px 25px
}
header h1{
font-size:40px;
margin:0 0 10px
}
header p{
font-size:18px
}
.home{
display:inline-block;
margin-top:10px;
padding:12px 24px;
background:white;
color:#333;
text-decoration:none;
border-radius:12px;
font-weight:bold
}
.container{
max-width:1000px;
margin:auto;
padding:20px
}
.title{
text-align:center;
font-size:30px;
font-weight:bold;
margin:15px 0 30px
}
.grades{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px
}
.grade{
background:white;
color:#222;
border-radius:22px;
padding:35px 15px;
text-align:center;
cursor:pointer;
transition:.3s;
box-shadow:0 10px 25px #0003
}
.grade:hover{
transform:translateY(-8px) scale(1.03)
}
.grade-icon{
font-size:65px
}
.grade h2{
margin:15px 0 5px
}
.grade p{
margin:0;
color:#666
}
@media(max-width:700px){
.grades{
grid-template-columns:repeat(2,1fr)
}
}
@media(max-width:450px){
.grades{
grid-template-columns:1fr
}
}
</style>
</head>
<body>

<header>
<h1>🏆 THI ĐẤU VỚI BOT</h1>
<p>Chọn khối để bắt đầu thi đấu</p>
<a href="index.html" class="home">🏠 Về trang chủ</a>
</header>

<div class="container">

<div class="title">📚 CHỌN KHỐI</div>

<div class="grades">

<div class="grade" onclick="chonKhoi(6)">
<div class="grade-icon">📘</div>
<h2>Khối 6</h2>
<p>Thi đấu khối 6</p>
</div>

<div class="grade" onclick="chonKhoi(7)">
<div class="grade-icon">📗</div>
<h2>Khối 7</h2>
<p>Thi đấu khối 7</p>
</div>

<div class="grade" onclick="chonKhoi(8)">
<div class="grade-icon">📙</div>
<h2>Khối 8</h2>
<p>Thi đấu khối 8</p>
</div>

<div class="grade" onclick="chonKhoi(9)">
<div class="grade-icon">📕</div>
<h2>Khối 9</h2>
<p>Thi đấu khối 9</p>
</div>

</div>

</div>

<script>
function chonKhoi(khoi){
window.location.href="khoi"+khoi+".html";
}
</script>

</body>
</html>
