<html lang="vi">

<title>Tiếng Anh 7 - Địa Ngục</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#050505,#260000,#080000);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.game{
    width:100%;
    max-width:950px;
    background:rgba(0,0,0,.8);
    border:2px solid #ff2020;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 40px rgba(255,0,0,.3);
}

h1{
    text-align:center;
    color:#ff3333;
    margin-bottom:25px;
    text-shadow:0 0 12px #ff0000;
}

.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.box{
    background:#180707;
    border:1px solid #8d1717;
    border-radius:12px;
    text-align:center;
    padding:12px;
}

.box span{
    display:block;
    font-size:28px;
    font-weight:bold;
    margin-top:5px;
    color:#ff6969;
}

.progress{
    text-align:center;
    color:#ff8a8a;
    margin-bottom:15px;
}

.question{
    background:#160606;
    border-radius:15px;
    padding:25px;
    border:1px solid #791414;
    margin-bottom:20px;
}

.question h2{
    font-size:21px;
    line-height:1.5;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.answer{
    border:2px solid #861919;
    border-radius:12px;
    background:#210909;
    color:white;
    padding:16px;
    font-size:17px;
    cursor:pointer;
    transition:.2s;
}

.answer:hover{
    background:#420f0f;
    border-color:#ff3030;
}

.correct{
    background:#087c48!important;
    border-color:#20ed91!important;
}

.wrong{
    background:#8c2222!important;
    border-color:#ff5555!important;
}

.info{
    text-align:center;
    min-height:28px;
    margin-top:18px;
    font-size:18px;
}

#next{
    display:none;
    margin:20px auto 0;
    padding:13px 25px;
    border:none;
    border-radius:10px;
    background:#b41414;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#result{
    display:none;
    text-align:center;
}

#result h2{
    font-size:36px;
    margin-bottom:15px;
    color:#ff4242;
}

.result-score{
    font-size:23px;
    margin-bottom:25px;
}

.menu{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.menu button{
    padding:13px 20px;
    border:none;
    border-radius:10px;
    background:#741515;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.menu button:hover{
    background:#a51d1d;
}

@media(max-width:700px){
    .top{
        grid-template-columns:1fr 1fr;
    }

    .answers{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<h1>☠️ TIẾNG ANH 7 - ĐỊA NGỤC ☠️</h1>

<div class="top">

    </div>

        THỜI GIAN BẠN

    </div>

        BOT

    </div>

    <div class="box">
        THỜI GIAN BOT
        <span id="botTg">5</span>
    </div>
</div>

<div id="gameArea">

<div class="progress" id="progress"></div>

<div class="question">
    <h2 id="cauHoi"></h2>
</div>

<div class="answers">
    <button class="answer" id="a0" onclick="traLoi(0)"></button>
    <button class="answer" id="a1" onclick="traLoi(1)"></button>
    <button class="answer" id="a2" onclick="traLoi(2)"></button>
    <button class="answer" id="a3" onclick="traLoi(3)"></button>
</div>

<div class="info" id="info"></div>

<button id="next" onclick="cauTiep()">CÂU TIẾP THEO →</button>

</div>

<div id="result">
    <h2 id="ketQua"></h2>

    <div class="result-score" id="tongDiem"></div>

    <div class="menu">
        <button onclick="choiLai()">🔄 Chơi lại</button>
        <button onclick="location.href='capdo_anh_khoi7.html'">🎯 Cấp độ</button>
        <button onclick="location.href='khoi7.html'">📚 Chọn môn</button>
    </div>
</div>

let ds=[];
let i=0;
let diem=0;
let bot=0;
let time=15;
let botTime=5;
let daTraLoi=false;
let timer;
let botTimer;

function tron(a){
    return [...a].sort(()=>Math.random()-0.5);
}

function batDau(){
    ds=tron(nganHang).slice(0,10);
    i=0;
    diem=0;
    bot=0;

    document.getElementById("diem").textContent=0;
    document.getElementById("botDiem").textContent=0;
    document.getElementById("gameArea").style.display="block";
    document.getElementById("result").style.display="none";

    hienThi();
}

function hienThi(){
    clearInterval(timer);
    clearInterval(botTimer);

    daTraLoi=false;
    time=15;
    botTime=5;

    document.getElementById("tg").textContent=time;
    document.getElementById("botTg").textContent=botTime;
    document.getElementById("soCau").textContent=(i+1)+"/10";
    document.getElementById("progress").textContent="Câu "+(i+1)+" / 10";
    document.getElementById("cauHoi").textContent=ds[i].q;

    for(let j=0;j<4;j++){
        let b=document.getElementById("a"+j);
        b.textContent=String.fromCharCode(65+j)+". "+ds[i].a[j];
        b.className="answer";
        b.disabled=false;
    }

    document.getElementById("info").textContent="";
    document.getElementById("next").style.display="none";

    timer=setInterval(()=>{
        time--;
        document.getElementById("tg").textContent=time;

        if(time<=0){
            clearInterval(timer);
            hetGio();
        }
    },1000);

    botTimer=setInterval(()=>{
        botTime--;
        document.getElementById("botTg").textContent=botTime;

        if(botTime<=0){
            clearInterval(botTimer);
        }
    },1000);
}

function traLoi(x){
    if(daTraLoi)return;

    daTraLoi=true;

    clearInterval(timer);
    clearInterval(botTimer);

    let d=ds[i].d;

    for(let j=0;j<4;j++){
        document.getElementById("a"+j).disabled=true;
    }

    if(x===d){
        diem++;
        document.getElementById("diem").textContent=diem;
        document.getElementById("a"+x).classList.add("correct");
        document.getElementById("info").textContent="✓ Chính xác!";
    }else{
        document.getElementById("a"+x).classList.add("wrong");
        document.getElementById("a"+d).classList.add("correct");
        document.getElementById("info").textContent="✗ Sai rồi!";
    }

    botTraLoi();

    document.getElementById("next").style.display="block";
}

function hetGio(){
    if(daTraLoi)return;

    daTraLoi=true;

    clearInterval(botTimer);

    let d=ds[i].d;

    for(let j=0;j<4;j++){
        document.getElementById("a"+j).disabled=true;
    }

    document.getElementById("a"+d).classList.add("correct");
    document.getElementById("info").textContent="⌛ Hết thời gian!";

    botTraLoi();

    document.getElementById("next").style.display="block";
}

function botTraLoi(){
    if(Math.random()<0.9){
        bot++;
        document.getElementById("botDiem").textContent=bot;
    }
}

function cauTiep(){
    if(i<9){
        i++;
        hienThi();
    }else{
        ketThuc();
    }
}

function ketThuc(){
    clearInterval(timer);
    clearInterval(botTimer);

    document.getElementById("gameArea").style.display="none";
    document.getElementById("result").style.display="block";

    let kq;

    if(diem>bot){
        kq="🏆 BẠN THẮNG!";
    }else if(diem<bot){
        kq="🤖 BOT THẮNG!";
    }else{
        kq="🤝 HÒA!";
    }

    document.getElementById("ketQua").textContent=kq;

    document.getElementById("tongDiem").textContent=
        "Bạn: "+diem+" điểm | Bot: "+bot+" điểm";
}

function choiLai(){
    batDau();
}
