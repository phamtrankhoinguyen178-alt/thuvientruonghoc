
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 9 - TINH ANH</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
    color: #222;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer:disabled {
    cursor: not-allowed;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.result p {
    font-size: 19px;
}

.win {
    color: #2ecc71 !important;
}

.lose {
    color: #e74c3c !important;
}

.draw {
    color: #f39c12 !important;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_van_khoi9.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">📚 NGỮ VĂN 9 - CẤP ĐỘ TINH ANH</div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [

{
    q: "Trong Truyện Kiều, Thúy Kiều phải bán mình để làm gì?",
    a: ["Cứu cha và gia đình", "Đi du học", "Trả nợ cho bạn", "Mua nhà"],
    d: 0
},

{
    q: "Đoạn trích Chị em Thúy Kiều chủ yếu sử dụng bút pháp nào?",
    a: ["Ước lệ tượng trưng", "Hiện thực phê phán", "Trào phúng", "Khoa học"],
    d: 0
},

{
    q: "Trong bài thơ Đồng chí, hình ảnh 'đầu súng trăng treo' gợi lên điều gì?",
    a: ["Sự kết hợp giữa hiện thực chiến đấu và tâm hồn lãng mạn", "Sự sợ hãi của người lính", "Cảnh sinh hoạt thường ngày", "Sự chia li"],
    d: 0
},

{
    q: "Hình ảnh chiếc xe không kính trong thơ Phạm Tiến Duật có ý nghĩa gì?",
    a: ["Làm nổi bật hiện thực chiến tranh và tinh thần người lính", "Miêu tả vẻ đẹp thành phố", "Thể hiện cuộc sống sung túc", "Nói về tình yêu gia đình"],
    d: 0
},

{
    q: "Trong bài thơ Đoàn thuyền đánh cá, thiên nhiên được miêu tả như thế nào?",
    a: ["Rộng lớn, giàu đẹp và tràn đầy sức sống", "Buồn bã, hoang vắng", "Nhỏ bé, tĩnh lặng", "Khô cằn, thiếu sức sống"],
    d: 0
},

{
    q: "Trong truyện ngắn Làng, tình yêu làng của ông Hai gắn liền với tình cảm nào?",
    a: ["Tình yêu nước", "Tình yêu tiền bạc", "Tình yêu danh vọng", "Tình yêu công việc"],
    d: 0
},

{
    q: "Trong bài thơ Ánh trăng, vầng trăng tượng trưng cho điều gì?",
    a: ["Quá khứ nghĩa tình và những kỉ niệm thủy chung", "Sự giàu sang", "Cuộc sống hiện đại", "Sự chiến thắng"],
    d: 0
},

{
    q: "Trong bài thơ Sang thu, dấu hiệu đầu tiên báo hiệu mùa thu là gì?",
    a: ["Hương ổi", "Tiếng ve", "Hoa phượng", "Mưa phùn"],
    d: 0
},

{
    q: "Hình ảnh 'hàng cây đứng tuổi' trong bài Sang thu gợi liên tưởng đến điều gì?",
    a: ["Con người từng trải trước những biến động cuộc đời", "Những đứa trẻ vui chơi", "Sự phát triển của cây cối", "Một khu rừng mùa đông"],
    d: 0
},

{
    q: "Bài thơ Mùa xuân nho nhỏ thể hiện ước nguyện gì của nhà thơ?",
    a: ["Được cống hiến cho cuộc đời", "Được sống giàu sang", "Được đi du lịch", "Được nổi tiếng"],
    d: 0
},

{
    q: "Trong Những ngôi sao xa xôi, Phương Định là người có phẩm chất nổi bật nào?",
    a: ["Dũng cảm, hồn nhiên và giàu tình cảm", "Ích kỉ và nhút nhát", "Lười biếng và vô trách nhiệm", "Lạnh lùng và thờ ơ"],
    d: 0
},

{
    q: "Tình huống truyện trong tác phẩm thường có vai trò gì?",
    a: ["Bộc lộ tính cách và số phận nhân vật", "Chỉ giới thiệu thời gian", "Thay thế toàn bộ cốt truyện", "Chỉ miêu tả cảnh vật"],
    d: 0
},

{
    q: "Thành phần biệt lập cảm thán có chức năng gì?",
    a: ["Bộc lộ tâm lí, cảm xúc của người nói", "Giải thích nghĩa của từ", "Nêu thời gian", "Xác định chủ ngữ"],
    d: 0
},

{
    q: "Phép liên kết thế là gì?",
    a: ["Dùng từ ngữ thay thế cho từ ngữ đã xuất hiện trước đó", "Lặp lại một câu nhiều lần", "Sử dụng từ trái nghĩa", "Dùng dấu chấm câu"],
    d: 0
},

{
    q: "Phép liên kết nối thường sử dụng phương tiện nào?",
    a: ["Quan hệ từ và từ ngữ chuyển tiếp", "Chỉ sử dụng dấu chấm", "Chỉ sử dụng danh từ", "Chỉ sử dụng tính từ"],
    d: 0
},

{
    q: "Nghị luận về một vấn đề tư tưởng, đạo lí thường bàn về điều gì?",
    a: ["Những quan niệm, phẩm chất và lối sống", "Một sự kiện lịch sử בלבד", "Cách chế tạo máy móc", "Một nhân vật hư cấu"],
    d: 0
},

{
    q: "Bằng chứng trong văn nghị luận có tác dụng gì?",
    a: ["Làm sáng tỏ và tăng sức thuyết phục cho luận điểm", "Làm bài văn dài hơn", "Thay thế hoàn toàn luận điểm", "Tạo vần cho bài viết"],
    d: 0
},

{
    q: "Độc thoại nội tâm là gì?",
    a: ["Lời nhân vật tự nói với chính mình trong suy nghĩ", "Cuộc trò chuyện giữa hai người", "Lời người kể chuyện", "Lời đối thoại giữa nhiều nhân vật"],
    d: 0
},

{
    q: "Yếu tố miêu tả trong văn bản tự sự có tác dụng gì?",
    a: ["Làm sự việc và nhân vật hiện lên sinh động", "Chỉ nêu ý kiến cá nhân", "Thay thế cốt truyện", "Chỉ cung cấp số liệu"],
    d: 0
},

{
    q: "Điểm nhìn trần thuật là gì?",
    a: ["Vị trí và góc độ người kể dùng để quan sát, kể chuyện", "Tên của nhân vật chính", "Thời gian sáng tác", "Địa điểm xuất bản"],
    d: 0
}

];

let ds = [...cauHoi].sort(() => Math.random() - 0.5).slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let tg = 15;
let timer;
let daTraLoi = false;

function hienThiCau() {

    clearInterval(timer);
    daTraLoi = false;
    tg = 15;

    document.getElementById("timer").textContent = tg;
    document.getElementById("playerScore").textContent = diemBan;
    document.getElementById("botScore").textContent = diemBot;
    document.getElementById("number").textContent = cau + 1;

    let c = ds[cau];

    document.getElementById("question").textContent =
        "Câu " + (cau + 1) + "/10: " + c.q;

    document.getElementById("answers").innerHTML = c.a.map((x, j) => `
        <button class="answer" onclick="traLoi(${j}, this)">
            ${String.fromCharCode(65 + j)}. ${x}
        </button>
    `).join("");

    timer = setInterval(() => {

        tg--;

        document.getElementById("timer").textContent = tg;

        if (tg <= 0) {
            hetThoiGian();
        }

    }, 1000);
}

function traLoi(chon, el) {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    if (chon === c.d) {

        diemBan++;
        el.classList.add("correct");

    } else {

        el.classList.add("wrong");
        nut[c.d].classList.add("correct");

    }

    document.getElementById("playerScore").textContent = diemBan;

    setTimeout(botTraLoi, 700);
}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    nut[c.d].classList.add("correct");

    setTimeout(botTraLoi, 700);
}

function botTraLoi() {

    let dung = Math.random() < 0.40;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").textContent = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {

    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;

    }

    result.innerHTML = `
        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>🌟 Cấp độ: TINH ANH</p>
        

        <br>

        <button onclick="location.reload()">🔄 Chơi lại</button>

        <button onclick="location.href='capdo_van_khoi9.html'">
            🎚️ Chọn cấp độ
        </button>

        <button onclick="location.href='khoi9.html'">
            🏠 Về chọn môn
        </button>
    `;
}

hienThiCau();

</script>

</body>
</html>
