<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 9 - Trung bình</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #00695c, #00897b, #26a69a);
    min-height: 100vh;
}

.top {
    background: #111;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 3px 15px #000;
    font-size: 20px;
    font-weight: bold;
}

.player { color: #4da6ff; }
.bot { color: #ff3333; }

.time, .bot-time {
    background: #333;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.bot-time {
    background: #555;
}

.main {
    max-width: 950px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: #fff;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
    text-shadow: 0 0 10px #00ffff;
}

.card {
    background: #171717;
    color: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px #000;
    border: 2px solid #00897b;
}

.question {
    font-size: 23px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 30px;
    line-height: 1.5;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #555;
    border-radius: 12px;
    background: #242424;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #004d40;
    border-color: #00e5ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #155d25;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #700000;
    border-color: #ff3333;
}

.answer:disabled {
    cursor: default;
}

.status {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: #171717;
    color: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 30px #000;
    border: 2px solid #00897b;
}

.result h1 {
    font-size: 40px;
}

.win { color: #2ecc71; }
.lose { color: #ff3333; }
.draw { color: #f39c12; }

.result h2 {
    margin: 12px;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #00897b;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #00bfa5;
}

@media(max-width:600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 15px;
    }

    .title {
        font-size: 25px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="top">

    <div class="player">
        👤 Bạn: <span id="playerScore">0</span>
    </div>

    <div class="time">
        ⏱ Bạn: <span id="timer">15</span>s
    </div>

    <div class="bot">
        🤖 Bot: <span id="botScore">0</span>
    </div>

    <div class="bot-time">
        🤖 Bot: <span id="botTimer">15</span>s
    </div>

</div>

<div class="main">

    <div class="title">
        📚 NGỮ VĂN 9 - CẤP ĐỘ TRUNG BÌNH 📚
    </div>

    <div id="game" class="card">

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="status" id="status">
            🤖 Bot đang suy nghĩ...
        </div>

    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [

{
q: "Trong Truyện Kiều, Nguyễn Du đã thể hiện giá trị nhân đạo nổi bật nào?",
a: ["Ca ngợi chiến tranh", "Đề cao vẻ đẹp, phẩm giá con người và cảm thương số phận bất hạnh", "Phê phán thiên nhiên", "Ca ngợi sự giàu có"],
d: 1
},

{
q: "Đoạn trích Chị em Thúy Kiều chủ yếu sử dụng bút pháp nghệ thuật nào?",
a: ["Tả cảnh ngụ tình", "Ước lệ tượng trưng", "Trào phúng", "Khoa trương"],
d: 1
},

{
q: "Trong Truyện Kiều, nghệ thuật tả cảnh ngụ tình có tác dụng gì?",
a: ["Chỉ miêu tả cảnh vật", "Gửi gắm tâm trạng, cảm xúc nhân vật qua cảnh vật", "Kể lại sự kiện lịch sử", "Giới thiệu nhân vật"],
d: 1
},

{
q: "Tác phẩm Đồng chí của Chính Hữu viết về chủ đề gì?",
a: ["Tình cảm gia đình", "Tình đồng chí, đồng đội của người lính", "Tình yêu thiên nhiên", "Cuộc sống lao động"],
d: 1
},

{
q: "Bài thơ Bài thơ về tiểu đội xe không kính của Phạm Tiến Duật khắc họa hình ảnh nào?",
a: ["Người nông dân", "Người lính lái xe Trường Sơn", "Người công nhân", "Người thầy giáo"],
d: 1
},

{
q: "Hình ảnh ánh trăng trong bài thơ Ánh trăng của Nguyễn Duy gợi nhắc điều gì?",
a: ["Sự xa hoa", "Quá khứ nghĩa tình và lời nhắc nhở về lòng biết ơn", "Sự giàu có", "Niềm vui chiến thắng"],
d: 1
},

{
q: "Bài thơ Mùa xuân nho nhỏ của Thanh Hải thể hiện ước nguyện gì?",
a: ["Sống ích kỉ", "Cống hiến một phần nhỏ bé cho cuộc đời", "Tránh xa mọi người", "Tìm kiếm danh vọng"],
d: 1
},

{
q: "Trong bài thơ Viếng lăng Bác, hình ảnh hàng tre gợi lên điều gì?",
a: ["Sự cô đơn", "Sức sống và phẩm chất kiên cường của dân tộc Việt Nam", "Sự giàu có", "Cảnh chiến tranh"],
d: 1
},

{
q: "Bài thơ Sang thu của Hữu Thỉnh miêu tả điều gì?",
a: ["Cảnh mùa đông", "Những tín hiệu chuyển mùa từ hạ sang thu", "Cảnh mùa xuân", "Cảnh mùa hè"],
d: 1
},

{
q: "Trong văn bản nghị luận, thao tác phân tích có mục đích gì?",
a: ["Chia nhỏ đối tượng để xem xét từng khía cạnh", "Kể lại câu chuyện", "Chỉ miêu tả cảnh vật", "Tạo tiếng cười"],
d: 0
},

{
q: "Phép nối trong liên kết câu thường sử dụng phương tiện nào?",
a: ["Các quan hệ từ, từ ngữ chuyển tiếp", "Chỉ dấu chấm", "Chỉ dấu phẩy", "Các từ tượng thanh"],
d: 0
},

{
q: "Thành phần phụ chú trong câu có tác dụng gì?",
a: ["Bổ sung thông tin cho một thành phần khác", "Thay thế chủ ngữ", "Xác định thời gian", "Tạo câu hỏi"],
d: 0
},

{
q: "Câu đặc biệt là câu như thế nào?",
a: ["Câu có đầy đủ chủ ngữ và vị ngữ", "Câu không cấu tạo theo mô hình chủ ngữ - vị ngữ", "Câu có hai vị ngữ", "Câu có nhiều trạng ngữ"],
d: 1
},

{
q: "Trong văn bản tự sự, yếu tố miêu tả có tác dụng gì?",
a: ["Làm nổi bật đặc điểm nhân vật và sự việc", "Thay thế hoàn toàn cốt truyện", "Chỉ tạo câu hỏi", "Loại bỏ nhân vật"],
d: 0
},

{
q: "Yếu tố nghị luận trong văn bản tự sự giúp nhân vật làm gì?",
a: ["Bộc lộ suy nghĩ, quan điểm và nhận xét", "Chỉ miêu tả ngoại hình", "Chỉ kể hành động", "Chỉ giới thiệu thời gian"],
d: 0
},

{
q: "Tình huống truyện có vai trò quan trọng nào?",
a: ["Tạo điều kiện bộc lộ tính cách và số phận nhân vật", "Chỉ làm tăng số trang", "Thay thế toàn bộ nhân vật", "Chỉ giới thiệu tác giả"],
d: 0
},

{
q: "Trong bài văn nghị luận xã hội, dẫn chứng cần có đặc điểm gì?",
a: ["Chân thực, tiêu biểu và phù hợp với luận điểm", "Càng dài càng tốt", "Không cần liên quan", "Chỉ là tưởng tượng"],
d: 0
},

{
q: "Điểm nhìn trần thuật trong truyện có ảnh hưởng đến điều gì?",
a: ["Cách người đọc tiếp nhận câu chuyện", "Số lượng trang sách", "Tên nhà xuất bản", "Độ dài nhan đề"],
d: 0
},

{
q: "Ý nghĩa của việc sử dụng ngôi kể thứ nhất là gì?",
a: ["Tạo cảm giác gần gũi, tăng tính chân thực qua trải nghiệm người kể", "Người kể biết tất cả mọi việc", "Không có nhân vật", "Không có cảm xúc"],
d: 0
},

{
q: "Khi phân tích một nhân vật văn học, cần chú ý điều gì?",
a: ["Ngoại hình, hành động, lời nói, suy nghĩ và hoàn cảnh", "Chỉ tên nhân vật", "Chỉ số lần xuất hiện", "Chỉ tuổi nhân vật"],
d: 0
}

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;

let thoiGianBan = 15;
let thoiGianBot = 15;

let timerBan;
let timerBot;

let daTraLoi = false;
let botDaTraLoi = false;

function hienThiCau() {

    daTraLoi = false;
    botDaTraLoi = false;

    thoiGianBan = 15;
    thoiGianBot = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = 15;
    document.getElementById("botTimer").innerText = 15;

    document.getElementById("question").innerText =
        danhSach[cau].q;

    document.getElementById("status").innerText =
        "🤖 Bot đang suy nghĩ...";

    let html = "";

    danhSach[cau].a.forEach((x, i) => {

        html += `
        <button class="answer" onclick="traLoi(${i}, this)">
            ${String.fromCharCode(65 + i)}. ${x}
        </button>
        `;

    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timerBan);
    clearInterval(timerBot);

    timerBan = setInterval(() => {

        thoiGianBan--;

        document.getElementById("timer").innerText =
            thoiGianBan;

        if (thoiGianBan <= 0) {

            clearInterval(timerBan);
            hetThoiGian();

        }

    }, 1000);

    timerBot = setInterval(() => {

        thoiGianBot--;

        document.getElementById("botTimer").innerText =
            thoiGianBot;

        if (thoiGianBot <= 0) {

            clearInterval(timerBot);
            botTraLoi();

        }

    }, 1000);
}

function traLoi(chon, element) {

    if (daTraLoi || botDaTraLoi) return;

    daTraLoi = true;

    clearInterval(timerBan);

    let dung = danhSach[cau].d;
    let cacNut = document.querySelectorAll(".answer");

    if (chon === dung) {

        diemBan++;

        element.classList.add("correct");

        document.getElementById("status").innerText =
            "✅ Bạn trả lời chính xác!";

    } else {

        element.classList.add("wrong");

        cacNut[dung].classList.add("correct");

        document.getElementById("status").innerText =
            "❌ Bạn trả lời chưa chính xác!";

    }

    cacNut.forEach(nut => nut.disabled = true);

    document.getElementById("playerScore").innerText =
        diemBan;

}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    let dung = danhSach[cau].d;

    let cacNut = document.querySelectorAll(".answer");

    cacNut[dung].classList.add("correct");

    cacNut.forEach(nut => nut.disabled = true);

    document.getElementById("status").innerText =
        "⏰ Bạn hết thời gian!";

}

function botTraLoi() {

    if (botDaTraLoi) return;

    botDaTraLoi = true;

    let dung = Math.random() < 0.50;

    if (dung) {

        diemBot++;

        document.getElementById("status").innerText =
            "🤖 Bot trả lời đúng!";

    } else {

        document.getElementById("status").innerText =
            "🤖 Bot trả lời sai!";

    }

    document.getElementById("botScore").innerText =
        diemBot;

    setTimeout(() => {

        cau++;

        if (cau >= 10) {

            ketThucTran();

        } else {

            hienThiCau();

        }

    }, 1000);
}

function ketThucTran() {

    clearInterval(timerBan);
    clearInterval(timerBot);

    document.getElementById("game").style.display =
        "none";

    document.querySelector(".info").style.display =
        "none";

    document.querySelector(".title").style.display =
        "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>🎉 Bạn đã đánh bại Bot!</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>🤖 Bot đã chiến thắng!</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🔥 HÒA!</h1>
            <p>Hai bên có cùng số điểm!</p>
        `;

    }

    result.innerHTML = `

        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>⏱ Bạn: 15 giây/câu</p>

        <p>🤖 Bot: 15 giây/câu</p>

        <p>📚 Bộ câu hỏi: 20 câu</p>

        <p>🎯 Bot có 50% khả năng trả lời đúng</p>

        <br>

        <button onclick="location.href='capdo_van_khoi9.html'">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='khoi9.html'">
            🏠 Về chọn môn
        </button>

    `;
}

hienThiCau();

</script>

</body>
</html>
