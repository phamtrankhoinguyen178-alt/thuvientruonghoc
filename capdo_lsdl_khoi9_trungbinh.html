<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LỊCH SỬ VÀ ĐỊA LÝ KHỐI 9 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.back:hover {
    background: #333;
}
.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}
.player {
    color: #2878e8;
}
.bot {
    color: #e74c3c;
}
.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}
.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}
.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}
.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}
.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}
.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}
.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}
.result h1 {
    color: #2878e8;
}
.win {
    color: #2ecc71;
}
.lose {
    color: #e74c3c;
}
.draw {
    color: #f39c12;
}
.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_lsdl_khoi9.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ LỊCH SỬ VÀ ĐỊA LÝ KHỐI 9 - CHẾ ĐỘ TINH ANH
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
 {
        q: "Nguyên nhân trực tiếp dẫn đến sự ra đời của Đảng Cộng sản Việt Nam là gì?",
        a: ["Sự kết hợp giữa chủ nghĩa Mác - Lênin với phong trào công nhân và phong trào yêu nước", "Chiến tranh thế giới thứ hai kết thúc", "Pháp rút khỏi Việt Nam", "Nhật đầu hàng Đồng minh"],
        d: 0
    },

    {
        q: "Đặc điểm nổi bật của dân cư Việt Nam là gì?",
        a: ["Phân bố đồng đều", "Phân bố không đồng đều giữa các vùng", "Chỉ tập trung ở miền núi", "Chỉ tập trung ở ven biển"],
        d: 1
    },

    {
        q: "Phong trào Xô viết Nghệ - Tĩnh diễn ra trong thời gian nào?",
        a: ["1925 - 1926", "1930 - 1931", "1936 - 1939", "1941 - 1945"],
        d: 1
    },

    {
        q: "Nguyên nhân chủ yếu khiến Đồng bằng sông Cửu Long trở thành vùng sản xuất lúa lớn nhất nước ta là gì?",
        a: ["Có nhiều núi cao", "Có khí hậu lạnh", "Có đất phù sa, địa hình bằng phẳng và nguồn nước phong phú", "Có ít sông ngòi"],
        d: 2
    },

    {
        q: "Nguyễn Ái Quốc tìm thấy con đường cứu nước đúng đắn cho cách mạng Việt Nam vào thời gian nào?",
        a: ["1911", "1917", "1920", "1930"],
        d: 2
    },

    {
        q: "Đông Nam Bộ có thế mạnh nổi bật về ngành kinh tế nào?",
        a: ["Trồng lúa nước trên diện rộng", "Khai thác băng tuyết", "Chăn nuôi tuần lộc", "Công nghiệp và dịch vụ"],
        d: 3
    },

    {
        q: "Hội nghị thành lập Đảng Cộng sản Việt Nam được tổ chức ở đâu?",
        a: ["Hương Cảng (Trung Quốc)", "Hà Nội", "Sài Gòn", "Cao Bằng"],
        d: 0
    },

    {
        q: "Vùng nào có tiềm năng lớn để phát triển du lịch biển đảo?",
        a: ["Trung du miền núi Bắc Bộ", "Duyên hải Nam Trung Bộ", "Tây Nguyên", "Đồng bằng sông Hồng"],
        d: 1
    },

    {
        q: "Chiến dịch Biên giới Thu - Đông năm 1950 có ý nghĩa gì?",
        a: ["Kết thúc chiến tranh", "Giải phóng hoàn toàn miền Nam", "Khai thông biên giới Việt - Trung và mở rộng căn cứ địa", "Thành lập ASEAN"],
        d: 2
    },

    {
        q: "Vùng nào có thế mạnh đặc biệt về khai thác dầu khí ở nước ta?",
        a: ["Tây Bắc", "Đồng bằng sông Hồng", "Tây Nguyên", "Đông Nam Bộ"],
        d: 3
    },

    {
        q: "Hiệp định Pa-ri về Việt Nam được kí kết vào ngày nào?",
        a: ["27/1/1973", "7/5/1954", "30/4/1975", "2/9/1945"],
        d: 0
    },

    {
        q: "Nhân tố nào ảnh hưởng lớn đến sự phát triển và phân bố nông nghiệp?",
        a: ["Màu sắc nhà cửa", "Đất đai và khí hậu", "Ngôn ngữ", "Múi giờ"],
        d: 1
    },

    {
        q: "Chiến thắng Điện Biên Phủ năm 1954 đã kết thúc thắng lợi cuộc kháng chiến nào?",
        a: ["Chống quân Thanh", "Chống quân Nguyên", "Chống thực dân Pháp", "Chống quân Minh"],
        d: 2
    },

    {
        q: "Vùng nào có nhiều điều kiện thuận lợi để phát triển nuôi trồng thủy sản nước lợ?",
        a: ["Tây Nguyên", "Trung du miền núi Bắc Bộ", "Đông Nam Bộ", "Đồng bằng sông Cửu Long"],
        d: 3
    },

    {
        q: "Công cuộc Đổi mới ở Việt Nam được khởi xướng từ Đại hội nào?",
        a: ["Đại hội VI năm 1986", "Đại hội IV năm 1976", "Đại hội V năm 1982", "Đại hội VII năm 1991"],
        d: 0
    },

    {
        q: "Vùng nào có mật độ dân số cao nhất nước ta?",
        a: ["Tây Nguyên", "Đồng bằng sông Hồng", "Trung du miền núi Bắc Bộ", "Bắc Trung Bộ"],
        d: 1
    },

    {
        q: "Phong trào cách mạng 1936 - 1939 ở Việt Nam có nhiệm vụ trực tiếp nào?",
        a: ["Đánh đổ ngay thực dân Pháp bằng vũ trang", "Giành độc lập hoàn toàn ngay lập tức", "Đấu tranh chống chế độ phản động thuộc địa, chống phát xít và chiến tranh", "Thành lập chính quyền Xô viết"],
        d: 2
    },

    {
        q: "Tuyến đường bộ nào chạy dọc chiều dài đất nước?",
        a: ["Quốc lộ 5", "Quốc lộ 18", "Quốc lộ 9", "Quốc lộ 1"],
        d: 3
    },

    {
        q: "Ai là người chỉ huy chiến dịch Điện Biên Phủ năm 1954?",
        a: ["Võ Nguyên Giáp", "Trần Hưng Đạo", "Nguyễn Huệ", "Phan Đình Phùng"],
        d: 0
    },

    {
        q: "Loại đất chủ yếu ở vùng đồi núi nước ta là gì?",
        a: ["Đất phù sa", "Đất feralit", "Đất mặn", "Đất phèn"],
        d: 1
    },
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.5;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        
        <br>
        <button onclick="location.href='capdo_lsdl_khoi9_trungbinh.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_lsdl_khoi9.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
