<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiếng Anh 6 - Cấp độ Khó</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9966, #ff5e62);
    min-height: 100vh;
}

.top {
    background: white;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.bot-time {
    background: #e74c3c;
    color: white;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.main {
    max-width: 900px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #ffe0d6;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.status {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    font-size: 38px;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result h2 {
    margin: 12px;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

@media(max-width:600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 15px;
    }

    .title {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="top">

    <div class="player">
        👤 Bạn: <span id="playerScore">0</span>
    </div>

    <div class="time">
        ⏱ Bạn: <span id="timer">15</span>s
    </div>

    <div class="bot">
        🤖 Bot: <span id="botScore">0</span>
    </div>

    <div class="bot-time">
        ⏱ Bot: <span id="botTimer">7</span>s
    </div>

</div>

<div class="main">

    <div class="title">
        ⚔️ TIẾNG ANH KHỐI 6 - CẤP ĐỘ KHÓ
    </div>

    <div id="game" class="card">

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="status" id="status">
            🤖 Bot đang suy nghĩ...
        </div>

    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [

{
    q: "My sister usually ___ to school by bike.",
    a: ["go", "goes", "going", "is go"],
    d: 1
},

{
    q: "Look! The children ___ football in the playground.",
    a: ["play", "plays", "are playing", "is playing"],
    d: 2
},

{
    q: "Nam ___ his homework at the moment.",
    a: ["does", "do", "is doing", "doing"],
    d: 2
},

{
    q: "My parents ___ TV every evening.",
    a: ["watch", "watches", "are watching", "watching"],
    d: 0
},

{
    q: "We ___ dinner now.",
    a: ["have", "has", "are having", "having"],
    d: 2
},

{
    q: "She often ___ her room at weekends.",
    a: ["clean", "cleans", "is cleaning", "cleaning"],
    d: 1
},

{
    q: "There isn't ___ orange juice in the bottle.",
    a: ["some", "many", "any", "a"],
    d: 2
},

{
    q: "How ___ rice do you need?",
    a: ["many", "much", "few", "long"],
    d: 1
},

{
    q: "How ___ apples are there on the table?",
    a: ["much", "many", "any", "some"],
    d: 1
},

{
    q: "My house is ___ than your house.",
    a: ["big", "bigger", "biggest", "more big"],
    d: 1
},

{
    q: "This exercise is ___ than the previous one.",
    a: ["difficult", "more difficult", "most difficult", "difficulter"],
    d: 1
},

{
    q: "The Nile is one of the ___ rivers in the world.",
    a: ["long", "longer", "longest", "most long"],
    d: 2
},

{
    q: "This is ___ interesting book.",
    a: ["a", "an", "some", "any"],
    d: 1
},

{
    q: "My father is good ___ fixing things.",
    a: ["at", "in", "on", "for"],
    d: 0
},

{
    q: "I am interested ___ learning English.",
    a: ["at", "on", "in", "for"],
    d: 2
},

{
    q: "You should ___ more water every day.",
    a: ["drink", "drinks", "drinking", "to drinking"],
    d: 0
},

{
    q: "You shouldn't ___ too much candy.",
    a: ["eating", "eat", "eats", "to eat"],
    d: 1
},

{
    q: "Would you like ___ tea?",
    a: ["some", "any", "a", "an"],
    d: 0
},

{
    q: "There are ___ students in my class.",
    a: ["much", "a little", "many", "any"],
    d: 2
},

{
    q: "My mother works ___ a hospital.",
    a: ["on", "at", "in", "to"],
    d: 2
},

{
    q: "The bank is ___ the supermarket and the post office.",
    a: ["next", "between", "under", "opposite"],
    d: 1
},

{
    q: "The cinema is ___ the restaurant.",
    a: ["opposite", "between", "under", "inside"],
    d: 0
},

{
    q: "We have English ___ Tuesday afternoon.",
    a: ["at", "in", "on", "from"],
    d: 2
},

{
    q: "I usually get up ___ 6:30.",
    a: ["in", "on", "at", "from"],
    d: 2
},

{
    q: "My birthday is ___ the fifteenth of May.",
    a: ["at", "in", "on", "from"],
    d: 2
},

{
    q: "What ___ your brother doing now?",
    a: ["are", "is", "am", "be"],
    d: 1
},

{
    q: "They ___ not watching TV now.",
    a: ["is", "am", "are", "be"],
    d: 2
},

{
    q: "___ there any milk in the fridge?",
    a: ["Are", "Is", "Am", "Be"],
    d: 1
},

{
    q: "___ you like playing badminton?",
    a: ["Are", "Does", "Do", "Is"],
    d: 2
},

{
    q: "How often ___ you go swimming?",
    a: ["are", "is", "do", "does"],
    d: 2
},

{
    q: "She goes to the library ___ a week.",
    a: ["two", "twice", "second", "double"],
    d: 1
},

{
    q: "Which sentence is correct?",
    a: [
        "He don't like football.",
        "He doesn't likes football.",
        "He doesn't like football.",
        "He not like football."
    ],
    d: 2
},

{
    q: "Which sentence is correct?",
    a: [
        "They is playing games.",
        "They are playing games.",
        "They playing games.",
        "They plays games."
    ],
    d: 1
},

{
    q: "What does your father do?",
    a: [
        "He is a doctor.",
        "He is fine.",
        "He likes football.",
        "He is at home."
    ],
    d: 0
},

{
    q: "How can I get to the museum?",
    a: [
        "It's very interesting.",
        "Go straight and turn left.",
        "I like museums.",
        "It's Sunday."
    ],
    d: 1
}

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);

danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;

let thoiGianBan = 15;
let thoiGianBot = 7;

let timerBan;
let timerBot;

let daTraLoi = false;
let botDaTraLoi = false;

function hienThiCau() {

    daTraLoi = false;
    botDaTraLoi = false;

    thoiGianBan = 15;
    thoiGianBot = 7;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = 15;
    document.getElementById("botTimer").innerText = 7;

    document.getElementById("question").innerText =
        danhSach[cau].q;

    document.getElementById("status").innerText =
        "🤖 Bot đang suy nghĩ...";

    let html = "";

    danhSach[cau].a.forEach((x, i) => {

        html += `
        <div class="answer" onclick="traLoi(${i}, this)">
            ${String.fromCharCode(65 + i)}. ${x}
        </div>
        `;

    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timerBan);
    clearInterval(timerBot);

    timerBan = setInterval(() => {

        thoiGianBan--;

        document.getElementById("timer").innerText =
            thoiGianBan;

        if (thoiGianBan <= 0) {

            clearInterval(timerBan);

            hetThoiGian();

        }

    }, 1000);

    timerBot = setInterval(() => {

        thoiGianBot--;

        document.getElementById("botTimer").innerText =
            thoiGianBot;

        if (thoiGianBot <= 0) {

            clearInterval(timerBot);

            botTraLoi();

        }

    }, 1000);
}

function traLoi(chon, element) {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timerBan);

    let dung = danhSach[cau].d;

    if (chon === dung) {

        diemBan++;

        element.classList.add("correct");

    } else {

        element.classList.add("wrong");

        document.querySelectorAll(".answer")[dung]
        .classList.add("correct");

    }

    document.getElementById("playerScore").innerText =
        diemBan;

    document.getElementById("status").innerText =
        "👤 Bạn đã trả lời! Bot vẫn đang suy nghĩ...";

}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    let dung = danhSach[cau].d;

    document.querySelectorAll(".answer")[dung]
    .classList.add("correct");

    document.getElementById("status").innerText =
        "⏰ Bạn hết thời gian! Bot vẫn đang suy nghĩ...";

}

function botTraLoi() {

    if (botDaTraLoi) return;

    botDaTraLoi = true;

    let dung = Math.random() < 0.75;

    if (dung) {

        diemBot++;

        document.getElementById("status").innerText =
            "🤖 Bot trả lời đúng!";

    } else {

        document.getElementById("status").innerText =
            "🤖 Bot trả lời sai!";

    }

    document.getElementById("botScore").innerText =
        diemBot;

    setTimeout(() => {

        cau++;

        if (cau >= 10) {

            ketThucTran();

        } else {

            hienThiCau();

        }

    }, 1000);
}

function ketThucTran() {

    clearInterval(timerBan);
    clearInterval(timerBot);

    document.getElementById("game").style.display =
        "none";

    document.querySelector(".info").style.display =
        "none";

    document.querySelector(".title").style.display =
        "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng!</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có cùng số điểm.</p>
        `;

    }

    result.innerHTML = `

        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>⏱ Bạn: 15 giây/câu</p>

        <p>🤖 Bot: 7 giây/câu</p>

        <br>

        <button onclick="location.href='capdo_anh_khoi6.html'">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='khoi6.html'">
            🏠 Về chọn môn
        </button>

    `;
}

hienThiCau();

</script>

</body>
</html>
