<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chọn chế độ GIÁO DỤC CÔNG DÂN khối 6</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    text-align: center;
}
h1 {
    color: white;
    padding-top: 45px;
    font-size: 38px;
}
h2 {
    color: white;
    margin-top: 10px;
}
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 25px;
    margin-top: 55px;
}
.box {
    width: 220px;
    padding: 30px 15px;
    background: white;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 8px 20px #0003;
    transition: 0.3s;
}
.box:hover {
    transform: translateY(-10px) scale(1.03);
}
.icon {
    font-size: 55px;
    margin-bottom: 15px;
}
.box h3 {
    font-size: 25px;
    margin: 10px;
}
.box p {
    color: #666;
}
.de {
    border-top: 8px solid #2ecc71;
}
.tb {
    border-top: 8px solid #3498db;
}
.kho {
    border-top: 8px solid #f39c12;
}
.dia-nguc {
    border-top: 8px solid #e74c3c;
}
button {
    margin-top: 45px;
    padding: 13px 28px;
    border: none;
    border-radius: 12px;
    background: #555;
    color: white;
    font-size: 17px;
    cursor: pointer;
}
button:hover {
    background: #333;
}
</style>
</head>
<body>
<h1>⚔️ THI ĐẤU GIÁO DỤC CÔNG DÂN KHỐI 6</h1>
<h2>🤖 Chọn chế độ thi đấu với Bot</h2>

<div class="container">

    <div class="box de" onclick="location.href='capdo_gdcd_khoi6_de.html'">
        <div class="icon">🟢</div>
        <h3>Dễ</h3>
        <p>Bot yếu</p>
    </div>

    <div class="box tb" onclick="location.href='capdo_gdcd_khoi6_trungbinh.html'">
        <div class="icon">🔵</div>
        <h3>Trung bình</h3>
        <p>Bot bình thường</p>
    </div>

    <div class="box kho" onclick="location.href='capdo_gdcd_khoi6_kho.html'">
        <div class="icon">🟠</div>
        <h3>Khó</h3>
        <p>Bot mạnh</p>
    </div>

    <div class="box dia-nguc" onclick="location.href='capdo_gdcd_khoi6_dianguc.html'">
        <div class="icon">🔥</div>
        <h3>Địa ngục</h3>
        <p>Bot cực mạnh</p>
    </div>

</div>

<button onclick="location.href='index.html'">
    ⬅ Quay lại
</button>

</body>
</html>
