<title>Trắc nghiệm Toán 6 - Đua xe</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#2193b0,#6dd5ed);
    overflow-x:hidden;
}

.back{
    position:fixed;
    top:15px;
    left:15px;
    background:#ff6a00;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    z-index:100;
}

h1{
    text-align:center;
    color:white;
    margin-top:65px;
    font-size:38px;
}

.info{
    text-align:center;
    color:white;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.game{
    width:95%;
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.road{
    position:relative;
    height:300px;
    overflow:hidden;
    border-radius:15px;
    background:#555;
    border:6px solid #333;
}

.road::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
    repeating-linear-gradient(
        to right,
        transparent 0px,
        transparent 60px,
        white 60px,
        white 120px
    );
    background-size:240px 10px;
    background-position:0 150px;
    background-repeat:repeat-x;
    opacity:.8;
}

.grass1,
.grass2{
    position:absolute;
    width:100%;
    height:45px;
    background:#38a852;
    z-index:2;
}

.grass1{
    top:0;
}

.grass2{
    bottom:0;
}

.car{
    position:absolute;
    left:60px;
    top:112px;
    width:110px;
    height:65px;
    z-index:10;
    transition:left .15s linear;
}

.car-body{
    position:absolute;
    left:5px;
    top:20px;
    width:100px;
    height:38px;
    background:#e53935;
    border-radius:12px 20px 8px 8px;
}

.car-top{
    position:absolute;
    left:28px;
    top:2px;
    width:55px;
    height:30px;
    background:#e53935;
    border-radius:20px 20px 0 0;
}

.window{
    position:absolute;
    left:38px;
    top:7px;
    width:35px;
    height:18px;
    background:#81d4fa;
    border-radius:8px 8px 2px 2px;
}

.wheel{
    position:absolute;
    width:24px;
    height:24px;
    background:#111;
    border-radius:50%;
    bottom:0;
}

.wheel1{
    left:18px;
}

.wheel2{
    right:15px;
}

.light{
    position:absolute;
    right:3px;
    top:30px;
    width:8px;
    height:10px;
    background:#fff176;
    border-radius:3px;
}

.rock{
    display:none;
    position:absolute;
    right:70px;
    top:112px;
    width:75px;
    height:65px;
    z-index:9;
}

.rock.show{
    display:block;
}

.rock-shape{
    width:70px;
    height:55px;
    background:#777;
    border-radius:45% 55% 50% 40%;
    border:5px solid #444;
    transform:rotate(-10deg);
}

.rock-shape::after{
    content:"";
    position:absolute;
    width:20px;
    height:15px;
    background:#999;
    border-radius:50%;
    top:10px;
    left:15px;
}

.start-area{
    text-align:center;
    margin:20px 0;
}

.start{
    background:#00a86b;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.start:hover{
    background:#008f5a;
    transform:scale(1.05);
}

.progress-box{
    margin:15px 0;
}

.progress-text{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#185a9d;
}

.progress{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#00a86b;
    transition:.4s;
}

.status{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#ff6a00;
    min-height:25px;
}

.question-box{
    display:none;
    position:fixed;
    z-index:200;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:700px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.question-box.show{
    display:block;
}

.question-box h2{
    text-align:center;
    color:#185a9d;
}

.question{
    font-size:23px;
    font-weight:bold;
    line-height:1.5;
    margin:20px 0;
}

.answer{
    display:block;
    width:100%;
    padding:15px;
    margin:10px 0;
    border:2px solid #ddd;
    border-radius:10px;
    background:#f8f8f8;
    text-align:left;
    font-size:18px;
    cursor:pointer;
}

.answer:hover{
    background:#e3f2fd;
    border-color:#2196f3;
}

.answer.selected{
    background:#bbdefb;
    border-color:#1976d2;
}

.check{
    display:block;
    margin:20px auto 0;
    padding:13px 30px;
    border:none;
    border-radius:10px;
    background:#00a86b;
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    position:fixed;
    z-index:300;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:550px;
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.result h2{
    font-size:35px;
    color:#00a86b;
}

.result.lose h2{
    color:#e53935;
}

.result p{
    font-size:21px;
}

.again{
    background:#ff6a00;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:10px;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:150;
}

.overlay.show{
    display:block;
}

@media(max-width:600px){

h1{
    font-size:28px;
}

.road{
    height:230px;
}

.car{
    top:80px;
}

.rock{
    top:80px;
}

.question-box{
    padding:20px;
}

.question{
    font-size:19px;
}

.answer{
    font-size:16px;
}

}

</style>

a:["4 cm","6 cm","8 cm","9 cm"],
c:1
},

{
q:"Tổng của hai số nguyên là -5. Một số là 8. Số còn lại là:",
a:["-13","-3","3","13"],
c:0
}

];



let gameQuestions=[];

let currentQuestion=0;

let selectedAnswer=null;

let gameRunning=false;

let waiting=false;

let carPosition=60;

let carTimer=null;

let obstacleTimer=null;


function startGame(){

    gameRunning=true;

    currentQuestion=0;

    selectedAnswer=null;

    carPosition=60;

    document.getElementById("car").style.left=carPosition+"px";

    document.getElementById("rock").classList.remove("show");

    document.getElementById("questionBox").classList.remove("show");

    document.getElementById("result").style.display="none";

    document.getElementById("overlay").classList.remove("show");

    document.getElementById("startButton").innerHTML="🔄 CHƠI LẠI";

    document.getElementById("status").innerHTML=
    "🚗 Xe đang chạy... Chướng ngại vật sẽ xuất hiện!";


    let shuffled=[...questionBank];

    shuffled.sort(()=>Math.random()-0.5);

    gameQuestions=shuffled.slice(0,10);

    updateProgress();

    clearInterval(carTimer);

    clearTimeout(obstacleTimer);


    carTimer=setInterval(moveCar,100);


    obstacleTimer=setTimeout(showObstacle,5000);

}


function moveCar(){

    if(!gameRunning || waiting){
        return;
    }

    carPosition+=2;

    let roadWidth=document.querySelector(".road").clientWidth;

    if(carPosition>roadWidth-170){
        carPosition=60;
    }

    document.getElementById("car").style.left=
    carPosition+"px";

}


function showObstacle(){

    if(!gameRunning){
        return;
    }

    waiting=true;

    document.getElementById("rock").classList.add("show");

    document.getElementById("status").innerHTML=
    "🪨 Có chướng ngại vật! Hãy trả lời câu hỏi!";

    clearInterval(carTimer);

    showQuestion();

}


function showQuestion(){

    if(currentQuestion>=10){
        winGame();
        return;
    }

    selectedAnswer=null;

    let q=gameQuestions[currentQuestion];

    document.getElementById("question").innerHTML=
    "Câu "+(currentQuestion+1)+": "+q.q;

    let answerHTML="";

    q.a.forEach((answer,index)=>{

        answerHTML+=
        `
        <button class="answer"
        onclick="selectAnswer(${index})">
        ${String.fromCharCode(65+index)}. ${answer}
        </button>
        `;

    });

    document.getElementById("answers").innerHTML=answerHTML;

    document.getElementById("overlay").classList.add("show");

    document.getElementById("questionBox").classList.add("show");

}


function selectAnswer(index){

    selectedAnswer=index;

    let buttons=document.querySelectorAll(".answer");

    buttons.forEach(function(button){
        button.classList.remove("selected");
    });

    buttons[index].classList.add("selected");

}


function checkAnswer(){

    if(selectedAnswer===null){

        alert("⚠️ Hãy chọn một đáp án!");

        return;

    }

    let correct=
    gameQuestions[currentQuestion].c;


    if(selectedAnswer!==correct){

        loseGame();

        return;

    }


    currentQuestion++;

    document.getElementById("rock").classList.remove("show");

    document.getElementById("questionBox").classList.remove("show");

    document.getElementById("overlay").classList.remove("show");

    updateProgress();

    if(currentQuestion>=10){

        winGame();

        return;

    }


    waiting=false;

    document.getElementById("status").innerHTML=
    "✅ Chính xác! Xe tiếp tục chạy...";

    carTimer=setInterval(moveCar,100);

    obstacleTimer=setTimeout(showObstacle,5000);

}


function updateProgress(){

    let percent=
    (currentQuestion/10)*100;

    document.getElementById("progressBar").style.width=
    percent+"%";

    document.getElementById("progressText").innerHTML=
    "🏁 Đã vượt qua "+currentQuestion+"/10 chướng ngại vật";

}



function loseGame(){

    gameRunning=false;

    waiting=false;

    clearInterval(carTimer);

    clearTimeout(obstacleTimer);

    document.getElementById("questionBox").classList.remove("show");

    document.getElementById("overlay").classList.remove("show");

    document.getElementById("rock").classList.remove("show");

    document.getElementById("result").style.display="block";

    document.getElementById("result").classList.add("lose");

    document.getElementById("resultTitle").innerHTML=
    "💥 GAME OVER!";

    document.getElementById("resultText").innerHTML=
    "❌ Bạn đã trả lời sai!<br><br>"+
    "🏁 Bạn vượt qua được "+
    currentQuestion+
    "/10 chướng ngại vật.";

}

function winGame(){

    gameRunning=false;

    waiting=false;

    clearInterval(carTimer);

    clearTimeout(obstacleTimer);

    document.getElementById("questionBox").classList.remove("show");

    document.getElementById("overlay").classList.remove("show");

    document.getElementById("rock").classList.remove("show");

    document.getElementById("progressBar").style.width="100%";

    document.getElementById("progressText").innerHTML=
    "🏆 Hoàn thành 10/10!";

    document.getElementById("status").innerHTML=
    "🎉 Bạn đã hoàn thành màn chơi!";

    document.getElementById("result").style.display="block";

    document.getElementById("result").classList.remove("lose");

    document.getElementById("resultTitle").innerHTML=
    "🏆 CHIẾN THẮNG!";

    document.getElementById("resultText").innerHTML=
    "🎉 Tuyệt vời!<br><br>"+
    "Bạn đã vượt qua cả 10 chướng ngại vật!<br>"+
    "⭐ Bạn đã hoàn thành màn chơi Toán 6.";

}

</script>
