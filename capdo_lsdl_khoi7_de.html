<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lịch Sử và Địa Lý KHỐI 7 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #e74c3c;
}

.draw {
    color: #f39c12;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_lsdl_khoi7_de.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ Lịch Sử và Địa Lý KHỐI 7 - CHẾ ĐỘ DỄ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
 {
        q: "Xã hội phong kiến Tây Âu hình thành sau sự kiện nào?",
        a: ["Đế quốc Tây La Mã sụp đổ", "Chiến tranh thế giới thứ nhất", "Cách mạng tư sản Pháp", "Cách mạng công nghiệp"],
        d: 0
    },
    {
        q: "Châu Á là châu lục có diện tích đứng thứ mấy thế giới?",
        a: ["Thứ hai", "Thứ nhất", "Thứ ba", "Thứ tư"],
        d: 1
    },
    {
        q: "Phong trào Văn hóa Phục hưng bắt đầu ở đâu?",
        a: ["Anh", "Pháp", "Italia", "Đức"],
        d: 2
    },
    {
        q: "Đại dương lớn nhất thế giới là gì?",
        a: ["Đại Tây Dương", "Ấn Độ Dương", "Bắc Băng Dương", "Thái Bình Dương"],
        d: 3
    },
    {
        q: "Ai là người sáng lập nhà Lý ở Việt Nam?",
        a: ["Lý Công Uẩn", "Lê Hoàn", "Đinh Bộ Lĩnh", "Ngô Quyền"],
        d: 0
    },
    {
        q: "Hoang mạc lớn nhất châu Phi là gì?",
        a: ["Gô-bi", "Xa-ha-ra", "A-ta-ca-ma", "Ca-la-ha-ri"],
        d: 1
    },
    {
        q: "Kinh đô của nước Đại Việt dưới thời Lý là ở đâu?",
        a: ["Hoa Lư", "Phú Xuân", "Thăng Long", "Cổ Loa"],
        d: 2
    },
    {
        q: "Dãy núi Hi-ma-lay-a nằm ở châu lục nào?",
        a: ["Châu Âu", "Châu Phi", "Châu Mỹ", "Châu Á"],
        d: 3
    },
    {
        q: "Ai là người lãnh đạo cuộc khởi nghĩa Lam Sơn?",
        a: ["Lê Lợi", "Nguyễn Huệ", "Trần Hưng Đạo", "Ngô Quyền"],
        d: 0
    },
    {
        q: "Châu lục nào có diện tích nhỏ nhất thế giới?",
        a: ["Châu Phi", "Châu Đại Dương", "Châu Á", "Châu Mỹ"],
        d: 1
    },
    {
        q: "Nhà Trần được thành lập vào năm nào?",
        a: ["1009", "1010", "1225", "1400"],
        d: 2
    },
    {
        q: "Đỉnh núi cao nhất thế giới là gì?",
        a: ["Phú Sĩ", "An-pơ", "An-đét", "Ê-vơ-rét"],
        d: 3
    },
    {
        q: "Ai là người chỉ huy quân dân Đại Việt chống quân Tống năm 1075–1077?",
        a: ["Lý Thường Kiệt", "Trần Quốc Tuấn", "Lê Lợi", "Nguyễn Trãi"],
        d: 0
    },
    {
        q: "Châu Phi nằm chủ yếu trong đới khí hậu nào?",
        a: ["Hàn đới", "Nhiệt đới", "Ôn đới", "Cực đới"],
        d: 1
    },
    {
        q: "Chiến thắng Bạch Đằng năm 1288 gắn với vị tướng nào?",
        a: ["Lý Công Uẩn", "Ngô Quyền", "Trần Quốc Tuấn", "Lê Hoàn"],
        d: 2
    },
    {
        q: "Thành phố nào là thủ đô của nước Pháp?",
        a: ["Luân Đôn", "Rô-ma", "Béc-lin", "Pa-ri"],
        d: 3
    },
    {
        q: "Ai là người sáng lập nhà Hồ?",
        a: ["Hồ Quý Ly", "Lê Lợi", "Trần Thủ Độ", "Lý Công Uẩn"],
        d: 0
    },
    {
        q: "Sông Nin nằm ở châu lục nào?",
        a: ["Châu Á", "Châu Phi", "Châu Âu", "Châu Mỹ"],
        d: 1
    },
    {
        q: "Quang Trung đại phá quân Thanh vào năm nào?",
        a: ["1428", "1785", "1789", "1802"],
        d: 2
    },
    {
        q: "Châu lục nào có rừng mưa nhiệt đới A-ma-dôn?",
        a: ["Châu Phi", "Châu Á", "Châu Âu", "Châu Mỹ"],
        d: 3
    },
];
let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
       
        <br>
        <button onclick="location.href='capdo_lsdl_khoi7_de.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_lsdl_khoi7.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
