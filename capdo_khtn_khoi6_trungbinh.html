<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHTN 6 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.back:hover {
    background: #333;
}
.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}
.player {
    color: #2878e8;
}
.bot {
    color: #e74c3c;
}
.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}
.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}
.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}
.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}
.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}
.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}
.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}
.result h1 {
    color: #2878e8;
}
.win {
    color: #2ecc71;
}
.lose {
    color: #e74c3c;
}
.draw {
    color: #f39c12;
}
.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_khtn_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ KHTN KHỐI 6 - CHẾ ĐỘ TRUNG BÌNH
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
    {
        q: "Quá trình nào giúp thực vật tạo ra chất hữu cơ?",
        a: ["Hô hấp", "Quang hợp", "Thoát hơi nước", "Tiêu hóa"],
        d: 1
    },
    {
        q: "Thành phần nào chiếm tỉ lệ lớn nhất trong không khí?",
        a: ["Oxi", "Cacbonic", "Nitơ", "Hiđro"],
        d: 2
    },
    {
        q: "Tế bào thực vật có thành phần nào mà tế bào động vật không có?",
        a: ["Màng tế bào", "Tế bào chất", "Thành tế bào", "Nhân"],
        d: 2
    },
    {
        q: "Dụng cụ nào dùng để đo thể tích chất lỏng?",
        a: ["Cân đồng hồ", "Ống đong", "Nhiệt kế", "Thước dây"],
        d: 1
    },
    {
        q: "Hiện tượng nước chuyển từ thể lỏng sang thể khí gọi là gì?",
        a: ["Đông đặc", "Ngưng tụ", "Bay hơi", "Nóng chảy"],
        d: 2
    },
    {
        q: "Cơ quan nào thực hiện chức năng trao đổi khí ở cá?",
        a: ["Phổi", "Mang", "Da", "Mũi"],
        d: 1
    },
    {
        q: "Đơn vị đo lực là gì?",
        a: ["Mét", "Niutơn", "Kilôgam", "Giây"],
        d: 1
    },
    {
        q: "Lực ma sát xuất hiện khi nào?",
        a: ["Hai bề mặt tiếp xúc và cản trở chuyển động", "Vật đứng riêng lẻ", "Vật không có khối lượng", "Không có tiếp xúc"],
        d: 0
    },
    {
        q: "Hệ Mặt Trời có bao nhiêu hành tinh?",
        a: ["7", "8", "9", "10"],
        d: 1
    },
    {
        q: "Loại tế bào nào có khả năng sinh sản tạo tế bào mới?",
        a: ["Tế bào chết", "Tế bào sống", "Tế bào không nhân", "Không có tế bào nào"],
        d: 1
    },
    {
        q: "Đâu là nhiên liệu hóa thạch?",
        a: ["Gió", "Ánh sáng Mặt Trời", "Than đá", "Nước"],
        d: 2
    },
    {
        q: "Bộ phận nào của cây chủ yếu thực hiện quang hợp?",
        a: ["Rễ", "Thân gỗ", "Lá", "Hoa"],
        d: 2
    },
    {
        q: "Vật liệu nào dẫn điện tốt?",
        a: ["Cao su", "Nhựa", "Đồng", "Gỗ khô"],
        d: 2
    },
    {
        q: "Sinh vật nào thuộc nhóm nấm?",
        a: ["Cây lúa", "Nấm rơm", "Cá chép", "Con kiến"],
        d: 1
    },
    {
        q: "Âm thanh được tạo ra bởi gì?",
        a: ["Vật dao động", "Vật đứng yên", "Ánh sáng", "Nhiệt độ"],
        d: 0
    },
    {
        q: "Cơ quan nào giúp cây hút nước và muối khoáng?",
        a: ["Lá", "Hoa", "Rễ", "Quả"],
        d: 2
    },
    {
        q: "Hiện tượng nào là biến đổi hóa học?",
        a: ["Nước đá tan", "Muối tan trong nước", "Sắt bị gỉ", "Nước bay hơi"],
        d: 2
    },
    {
        q: "Động vật nào thuộc nhóm lưỡng cư?",
        a: ["Cá rô", "Ếch đồng", "Chim sẻ", "Thằn lằn"],
        d: 1
    },
    {
        q: "Trái Đất tự quay quanh trục theo hướng nào?",
        a: ["Từ Đông sang Tây", "Từ Tây sang Đông", "Từ Bắc xuống Nam", "Từ Nam lên Bắc"],
        d: 1
    },
    {
        q: "Quá trình hô hấp ở sinh vật thường lấy khí nào?",
        a: ["Oxi", "Nitơ", "Hiđro", "Cacbonic"],
        d: 0
    }
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.5;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        <p>Bot có 50% xác suất trả lời đúng mỗi câu.</p>
        <br>
        <button onclick="location.href='capdo_khtn_khoi6_trungbinh.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_khtn_khoi6.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
