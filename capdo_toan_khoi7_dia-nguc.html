<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toán 7 - BẤT TỬ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #000000, #4b0000, #a00000);
    min-height: 100vh;
}

.top {
    background: #111;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 3px 15px #000;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #4da6ff;
}

.bot {
    color: #ff3333;
}

.time {
    background: #333;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.bot-time {
    background: #b00000;
    padding: 10px 22px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
}

.main {
    max-width: 950px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: #fff;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
    text-shadow: 0 0 10px red;
}

.card {
    background: #171717;
    color: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px #000;
    border: 2px solid #8b0000;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 30px;
    line-height: 1.5;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #555;
    border-radius: 12px;
    background: #242424;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #420000;
    border-color: red;
    transform: scale(1.02);
}

.answer.correct {
    background: #155d25;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #700000;
    border-color: #ff3333;
}

.status {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: #171717;
    color: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 30px #000;
    border: 2px solid #8b0000;
}

.result h1 {
    font-size: 40px;
}

.win {
    color: #2ecc71;
}

.lose {
    color: #ff3333;
}

.draw {
    color: #f39c12;
}

.result h2 {
    margin: 12px;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #b00000;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #e00000;
}

@media(max-width:600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 15px;
    }

    .title {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="top">

    <div class="player">
        👤 Bạn: <span id="playerScore">0</span>
    </div>

    <div class="time">
        ⏱ Bạn: <span id="timer">15</span>s
    </div>

    <div class="bot">
        🤖 Bot: <span id="botScore">0</span>
    </div>

    <div class="bot-time">
        🔥 Bot: <span id="botTimer">5</span>s
    </div>

</div>

<div class="main">

    <div class="title">
        ☠️ TOÁN KHỐI 7 - BẤT TỬ ☠️
    </div>

    <div id="game" class="card">

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="status" id="status">
            ☠️ Bot đang suy nghĩ...
        </div>

    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>

const cauHoi = [

{
    q: "Tính: (-3)² + 2³ - 5 × 2 = ?",
    a: ["7", "9", "11", "13"],
    d: 2
},

{
    q: "Tính: 3/4 - 5/6 + 7/12 = ?",
    a: ["1/4", "5/12", "7/12", "1/2"],
    d: 1
},

{
    q: "Tính: (-2)⁴ - 3² × 2 = ?",
    a: ["-2", "2", "7", "14"],
    d: 1
},

{
    q: "Tính: 2⁵ - 3² + 4³ : 8 = ?",
    a: ["23", "31", "41", "55"],
    d: 2
},

{
    q: "Tìm x: 3(2x - 5) = 4x + 7",
    a: ["9", "10", "11", "12"],
    d: 2
},

{
    q: "Tìm x: 5(x - 2) - 2(x + 1) = 19",
    a: ["5", "6", "7", "8"],
    d: 2
},

{
    q: "Tìm x: 4x - 3(2x - 1) = 9",
    a: ["-4", "-3", "3", "4"],
    d: 0
},

{
    q: "Nếu x + y = 20 và x - y = 6 thì x bằng?",
    a: ["7", "10", "13", "14"],
    d: 2
},

{
    q: "Tính: 2/3 : 4/9 - 1/2 = ?",
    a: ["1/2", "1", "3/2", "2"],
    d: 1
},

{
    q: "Tính: 1/2 + 2/3 - 3/4 + 5/6 = ?",
    a: ["5/4", "7/6", "4/3", "3/2"],
    d: 2
},

{
    q: "Tìm x biết: (x - 2)/3 = (x + 4)/5",
    a: ["9", "10", "11", "12"],
    d: 2
},

{
    q: "Tìm x biết: 2x/3 - 5 = 7",
    a: ["12", "15", "18", "21"],
    d: 2
},

{
    q: "Tìm x biết: 3/4x = 12",
    a: ["9", "12", "16", "18"],
    d: 2
},

{
    q: "Một số tăng 20% rồi giảm 20%. So với ban đầu số đó thay đổi thế nào?",
    a: ["Không đổi", "Giảm 4%", "Tăng 4%", "Giảm 2%"],
    d: 1
},

{
    q: "Một cửa hàng giảm giá 20% một chiếc áo 500 000 đồng. Giá sau giảm là?",
    a: ["350 000", "400 000", "420 000", "450 000"],
    d: 1
},

{
    q: "Hai đại lượng x và y tỉ lệ thuận. Khi x = 4 thì y = 12. Khi x = 10 thì y bằng?",
    a: ["20", "24", "30", "36"],
    d: 2
},

{
    q: "Hai đại lượng x và y tỉ lệ nghịch. Khi x = 6 thì y = 8. Khi x = 12 thì y bằng?",
    a: ["2", "4", "6", "8"],
    d: 1
},

{
    q: "Một tam giác có hai góc bằng 65° và 45°. Góc còn lại bằng?",
    a: ["60°", "70°", "80°", "90°"],
    d: 1
},

{
    q: "Một tam giác cân có góc ở đỉnh bằng 40°. Mỗi góc ở đáy bằng?",
    a: ["60°", "65°", "70°", "75°"],
    d: 2
},

{
    q: "Hai đường thẳng song song bị cắt bởi một đường thẳng. Một góc bằng 65°. Góc đồng vị với nó bằng?",
    a: ["25°", "65°", "115°", "125°"],
    d: 1
},

{
    q: "Hai góc kề bù, một góc bằng 37°. Góc còn lại bằng?",
    a: ["143°", "153°", "127°", "137°"],
    d: 0
},

{
    q: "Một góc bằng 3 lần góc phụ với nó. Góc đó bằng?",
    a: ["45°", "60°", "67,5°", "75°"],
    d: 2
},

{
    q: "Số nào sau đây là số vô tỉ?",
    a: ["0,25", "√2", "3/5", "1,75"],
    d: 1
},

{
    q: "Giá trị của √144 + √81 là?",
    a: ["19", "20", "21", "22"],
    d: 2
},

{
    q: "Nếu a² = 49 và a > 0 thì a bằng?",
    a: ["-7", "0", "7", "14"],
    d: 2
},

{
    q: "Tính: |−7| + |3 − 10| = ?",
    a: ["7", "10", "12", "14"],
    d: 3
},

{
    q: "Tìm x: |x| = 5. Có bao nhiêu giá trị của x?",
    a: ["1", "2", "3", "5"],
    d: 1
},

{
    q: "Một hình chữ nhật có chiều dài 15 cm, chiều rộng 8 cm. Độ dài đường chéo là?",
    a: ["16 cm", "17 cm", "18 cm", "19 cm"],
    d: 1
},

{
    q: "Một tam giác có ba cạnh 5 cm, 12 cm, 13 cm. Tam giác đó là?",
    a: [
        "Tam giác đều",
        "Tam giác cân",
        "Tam giác vuông",
        "Tam giác tù"
    ],
    d: 2
},

{
    q: "Tổng ba góc của một đa giác có 5 cạnh bằng?",
    a: ["360°", "450°", "540°", "720°"],
    d: 2
},

{
    q: "Một số có dạng 2ⁿ = 32. Giá trị của n là?",
    a: ["3", "4", "5", "6"],
    d: 2
},

{
    q: "Tính: 2⁶ : 2³ × 2² = ?",
    a: ["16", "24", "32", "64"],
    d: 2
},

{
    q: "Tính: 3² × 3³ : 3⁴ = ?",
    a: ["1", "3", "9", "27"],
    d: 1
},

{
    q: "Nếu x² = 121 thì x có thể bằng?",
    a: ["11", "-11", "0", "11 hoặc -11"],
    d: 3
},

{
    q: "Một lớp có 40 học sinh, trong đó 35% là học sinh nữ. Số học sinh nữ là?",
    a: ["12", "14", "16", "18"],
    d: 1
},

{
    q: "Một chiếc xe đi 120 km trong 2 giờ. Vận tốc trung bình là?",
    a: ["40 km/h", "50 km/h", "60 km/h", "70 km/h"],
    d: 2
},

{
    q: "Một người đi xe đạp với vận tốc 15 km/h trong 40 phút. Quãng đường đi được là?",
    a: ["8 km", "10 km", "12 km", "15 km"],
    d: 2
},

{
    q: "Tìm x: 2(x - 3) + 4 = 3(x - 1)",
    a: ["-1", "1", "2", "3"],
    d: 1
},

{
    q: "Tìm x: 5x - 2 = 3x + 10",
    a: ["4", "5", "6", "7"],
    d: 2
},

{
    q: "Tìm x: (2x + 1)/3 = 5",
    a: ["6", "7", "8", "9"],
    d: 1
},

{
    q: "Nếu 3x + 2y = 18 và x = 2 thì y bằng?",
    a: ["5", "6", "7", "8"],
    d: 1
}

];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);

danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;

let thoiGianBan = 15;
let thoiGianBot = 5;

let timerBan;
let timerBot;

let daTraLoi = false;
let botDaTraLoi = false;

function hienThiCau() {

    daTraLoi = false;
    botDaTraLoi = false;

    thoiGianBan = 15;
    thoiGianBot = 5;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = 15;
    document.getElementById("botTimer").innerText = 5;

    document.getElementById("question").innerText =
        danhSach[cau].q;

    document.getElementById("status").innerText =
        "☠️ Bot đang suy nghĩ...";

    let html = "";

    danhSach[cau].a.forEach((x, i) => {

        html += `
        <div class="answer" onclick="traLoi(${i}, this)">
            ${String.fromCharCode(65 + i)}. ${x}
        </div>
        `;

    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timerBan);
    clearInterval(timerBot);

    timerBan = setInterval(() => {

        thoiGianBan--;

        document.getElementById("timer").innerText =
            thoiGianBan;

        if (thoiGianBan <= 0) {

            clearInterval(timerBan);

            hetThoiGian();

        }

    }, 1000);

    timerBot = setInterval(() => {

        thoiGianBot--;

        document.getElementById("botTimer").innerText =
            thoiGianBot;

        if (thoiGianBot <= 0) {

            clearInterval(timerBot);

            botTraLoi();

        }

    }, 1000);
}

function traLoi(chon, element) {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timerBan);

    let dung = danhSach[cau].d;

    if (chon === dung) {

        diemBan++;

        element.classList.add("correct");

    } else {

        element.classList.add("wrong");

        document.querySelectorAll(".answer")[dung]
        .classList.add("correct");

    }

    document.getElementById("playerScore").innerText =
        diemBan;

    document.getElementById("status").innerText =
        "👤 Bạn đã trả lời! Bot vẫn đang suy nghĩ...";

}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    let dung = danhSach[cau].d;

    document.querySelectorAll(".answer")[dung]
    .classList.add("correct");

    document.getElementById("status").innerText =
        "⏰ Bạn hết thời gian! Bot vẫn đang suy nghĩ...";

}

function botTraLoi() {

    if (botDaTraLoi) return;

    botDaTraLoi = true;

    let dung = Math.random() < 0.9;

    if (dung) {

        diemBot++;

        document.getElementById("status").innerText =
            "🤖 Bot trả lời đúng!";

    } else {

        document.getElementById("status").innerText =
            "🤖 Bot trả lời sai!";

    }

    document.getElementById("botScore").innerText =
        diemBot;

    setTimeout(() => {

        cau++;

        if (cau >= 10) {

            ketThucTran();

        } else {

            hienThiCau();

        }

    }, 1000);
}

function ketThucTran() {

    clearInterval(timerBan);
    clearInterval(timerBot);

    document.getElementById("game").style.display =
        "none";

    document.querySelector(".info").style.display =
        "none";

    document.querySelector(".title").style.display =
        "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Không thể tin được! Bạn đã đánh bại Bot BẤT TỬ!</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">☠️ BẠN THUA!</h1>
            <p>Bot BẤT TỬ đã chiến thắng!</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🔥 HÒA!</h1>
            <p>Bạn đã sống sót trước Bot BẤT TỬ!</p>
        `;

    }

    result.innerHTML = `

        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>⏱ Bạn: 15 giây/câu</p>

        <p>🔥 Bot: 5 giây/câu</p>

        

        <br>

        <button onclick="location.href='capdo_toan_khoi7.html'">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='khoi7.html'">
            🏠 Về chọn môn
        </button>

    `;
}

hienThiCau();

</script>

</body>
</html>
