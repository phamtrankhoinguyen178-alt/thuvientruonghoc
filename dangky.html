
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b2a88, #ff6a00);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.signup {
    width: 100%;
    max-width: 550px;
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

h1 {
    text-align: center;
    color: #0b2a88;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    color: #444;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 20px;
    border: 2px solid #eee;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #0b2a88;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 75px;
}

.toggle {
    position: absolute;
    right: 12px;
    top: 15px;
    color: #0b2a88;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
}

.note {
    font-size: 13px;
    color: #777;
    line-height: 1.7;
    margin-top: -12px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #ff6a00;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #e85d00;
}

.login {
    text-align: center;
    margin-top: 25px;
    color: #777;
}

.login a {
    color: #0b2a88;
    font-weight: bold;
    text-decoration: none;
}

.home {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #777;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="signup">

    <h1>📝 Đăng ký tài khoản</h1>

    <p class="subtitle">Tạo tài khoản để sử dụng website</p>

    <form id="signupForm">

        <label>Họ và tên</label>
        <input type="text" id="fullname"
        placeholder="Nhập họ và tên" required>

        <label>Mật khẩu</label>

        <div class="password-box">
            <input type="password" id="password"
            placeholder="Nhập mật khẩu" required>

            <span class="toggle"
            onclick="togglePassword('password', this)">Hiện</span>
        </div>

        <div class="note">
            🔒 Mật khẩu cần đáp ứng:
            <br>• Ít nhất 8 ký tự
            <br>• Có ít nhất 1 chữ in hoa
            <br>• Có ít nhất 1 ký tự đặc biệt
        </div>

        <label>Xác nhận mật khẩu</label>

        <div class="password-box">
            <input type="password" id="confirmPassword"
            placeholder="Nhập lại mật khẩu" required>

            <span class="toggle"
            onclick="togglePassword('confirmPassword', this)">Hiện</span>
        </div>

        <button type="submit">📝 Đăng ký</button>

    </form>

    <p class="login">
        Đã có tài khoản?
        <a href="dangnhap.html">Đăng nhập</a>
    </p>

    <a href="index.html" class="home">
        ← Quay về trang chủ
    </a>

</div>

<script>

function togglePassword(id, element) {
    let input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        element.innerText = "Ẩn";
    } else {
        input.type = "password";
        element.innerText = "Hiện";
    }
}

document.getElementById("signupForm").addEventListener("submit", function(e) {

    e.preventDefault();

    let fullname = document.getElementById("fullname").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (password.length < 8) {
        alert("❌ Mật khẩu phải có ít nhất 8 ký tự!");

        document.getElementById("password").value = "";
        document.getElementById("confirmPassword").value = "";
        document.getElementById("password").focus();

        return;
    }

    if (!/[A-Z]/.test(password)) {
        alert("❌ Mật khẩu phải có ít nhất 1 chữ in hoa!");

        document.getElementById("password").value = "";
        document.getElementById("confirmPassword").value = "";
        document.getElementById("password").focus();

        return;
    }

    if (!/[^A-Za-z0-9]/.test(password)) {
        alert("❌ Mật khẩu phải có ít nhất 1 ký tự đặc biệt!");

        document.getElementById("password").value = "";
        document.getElementById("confirmPassword").value = "";
        document.getElementById("password").focus();

        return;
    }

    if (password !== confirmPassword) {
        alert("❌ Mật khẩu xác nhận không trùng khớp!");

        document.getElementById("confirmPassword").value = "";
        document.getElementById("confirmPassword").focus();

        return;
    }

    let accounts = JSON.parse(localStorage.getItem("accounts")) || [];

    let exists = accounts.find(account =>
        account.fullname.toLowerCase() === fullname.toLowerCase()
    );

    if (exists) {
        alert("❌ Tên tài khoản này đã được đăng ký!");
        return;
    }

    let account = {
        fullname: fullname,
        password: password
    };

    accounts.push(account);

    localStorage.setItem("accounts", JSON.stringify(accounts));

    alert("✅ Đăng ký tài khoản thành công!");

    window.location.href = "dangnhap.html";

});

</script>

</body>
</html>
