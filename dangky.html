<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký - Thư viện THCS Quảng Trạch</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b2a88, #ff6a00);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.signup {
    width: 100%;
    max-width: 550px;
    background: white;
    padding: 45px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

h1 {
    text-align: center;
    color: #0b2a88;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    color: #444;
}

input {
    width: 100%;
    padding: 16px;
    margin-bottom: 20px;
    border: 2px solid #eee;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #0b2a88;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #ff6a00;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #e85d00;
}

.login {
    text-align: center;
    margin-top: 25px;
    color: #777;
}

.login a {
    color: #0b2a88;
    font-weight: bold;
    text-decoration: none;
}

.home {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #777;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="signup">

    <h1>Đăng ký</h1>

    <p class="subtitle">
        Thư viện THCS Quảng Trạch
    </p>

    <form id="signupForm">

        <label>Họ và tên</label>
        <input type="text" id="fullname" placeholder="Nhập họ và tên" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Nhập email" required>

        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" required>

        <label>Xác nhận mật khẩu</label>
        <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>

        <button type="submit">📝 Đăng ký</button>

    </form>

    <p class="login">
        Đã có tài khoản?
        <a href="dangnhap.html">Đăng nhập</a>
    </p>

    <a href="index.html" class="home">
        ← Quay về trang chủ
    </a>

</div>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {

    e.preventDefault();

    let fullname = document.getElementById("fullname").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("❌ Mật khẩu xác nhận không trùng khớp!");
        return;
    }

    let accounts = JSON.parse(localStorage.getItem("accounts")) || [];

    let exists = accounts.find(account => account.email === email);

    if (exists) {
        alert("❌ Email này đã được đăng ký!");
        return;
    }

    let account = {
        fullname: fullname,
        email: email,
        password: password
    };

    accounts.push(account);

    localStorage.setItem("accounts", JSON.stringify(accounts));

    alert("✅ Đăng ký thành công!");

    window.location.href = "dangnhap.html";
});
</script>

</body>
</html>
