<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LỊCH SỬ VÀ ĐỊA LÝ KHỐI 6 - CHẾ ĐỘ KHÓ</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.back:hover {
    background: #333;
}
.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}
.player {
    color: #2878e8;
}
.bot {
    color: #e74c3c;
}
.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}
.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}
.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}
.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}
.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}
.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}
.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}
.result h1 {
    color: #2878e8;
}
.win {
    color: #2ecc71;
}
.lose {
    color: #e74c3c;
}
.draw {
    color: #f39c12;
}
.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_lsdl_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        ⚔️ LỊCH SỬ VÀ ĐỊA LÝ KHỐI 6 - CHẾ ĐỘ KHÓ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
 {
        q: "Người Ai Cập cổ đại viết chữ trên vật liệu nào?",
        a: ["Giấy cói", "Nhựa", "Thủy tinh", "Kim loại"],
        d: 0
    },

    {
        q: "Một bản đồ có tỉ lệ 1:100.000. Khoảng cách 1 cm trên bản đồ tương ứng bao nhiêu ngoài thực tế?",
        a: ["100 m", "1 km", "10 km", "100 km"],
        d: 1
    },

    {
        q: "Công cụ lao động đầu tiên của người nguyên thủy chủ yếu được làm bằng gì?",
        a: ["Sắt", "Đồng", "Đá", "Nhựa"],
        d: 2
    },

    {
        q: "Thời gian Trái Đất chuyển động một vòng quanh Mặt Trời là bao lâu?",
        a: ["24 giờ", "30 ngày", "365 ngày 6 giờ", "12 giờ"],
        d: 2
    },

    {
        q: "Cư dân Văn Lang – Âu Lạc làm nghề gì là chủ yếu?",
        a: ["Trồng lúa nước", "Khai thác dầu mỏ", "Sản xuất ô tô", "Đánh cá biển sâu"],
        d: 0
    },

    {
        q: "Đường xích đạo chia Trái Đất thành hai bán cầu nào?",
        a: ["Đông và Tây", "Bắc và Nam", "Trái và Phải", "Trên và Dưới"],
        d: 1
    },

    {
        q: "Công trình kiến trúc nổi tiếng của La Mã cổ đại là gì?",
        a: ["Kim tự tháp", "Vạn Lý Trường Thành", "Đấu trường Cô-li-dê", "Ăng-co Vát"],
        d: 2
    },

    {
        q: "Khí ô-xi chiếm khoảng bao nhiêu phần trăm thể tích không khí?",
        a: ["21%", "78%", "1%", "50%"],
        d: 0
    },

    {
        q: "Văn hóa Óc Eo gắn liền với vương quốc cổ nào?",
        a: ["Văn Lang", "Phù Nam", "Âu Lạc", "Đại Việt"],
        d: 1
    },

    {
        q: "Đồng bằng thường có đặc điểm địa hình như thế nào?",
        a: ["Dốc đứng", "Nhiều đỉnh nhọn", "Tương đối bằng phẳng", "Cao và hiểm trở"],
        d: 2
    },

    {
        q: "Phát minh nào sau đây có nguồn gốc từ Trung Quốc cổ đại?",
        a: ["Máy bay", "Điện thoại", "Động cơ điện", "Giấy"],
        d: 3
    },

    {
        q: "Núi lửa phun trào thường đưa vật chất gì lên bề mặt?",
        a: ["Băng tuyết", "Dung nham và tro bụi", "Nước ngọt", "Cát biển"],
        d: 1
    },

    {
        q: "Nhà nước Văn Lang – Âu Lạc hình thành ở khu vực nào?",
        a: ["Lưu vực sông Hồng và sông Cả", "Lưu vực sông Nin", "Lưu vực sông Hằng", "Lưu vực sông Ti-grơ"],
        d: 0
    },

    {
        q: "Nhiệt độ không khí thường được đo bằng dụng cụ nào?",
        a: ["Phong vũ biểu", "Vũ kế", "Nhiệt kế", "La bàn"],
        d: 2
    },

    {
        q: "Hai bộ sử thi nổi tiếng của Ấn Độ là gì?",
        a: ["I-li-át và Ô-đi-xê", "Ra-ma-y-a-na và Ma-ha-bha-ra-ta", "Tam Quốc và Tây Du Kí", "Truyện Kiều và Chinh phụ ngâm"],
        d: 1
    },

    {
        q: "Sông là gì?",
        a: ["Dòng chảy thường xuyên tương đối ổn định trên bề mặt lục địa", "Một vùng nước đứng yên", "Một hồ nước nhân tạo", "Một vùng đất khô hạn"],
        d: 0
    },

    {
        q: "Người nguyên thủy đã biết tạo ra lửa có ý nghĩa quan trọng như thế nào?",
        a: ["Giúp chế tạo máy móc", "Giúp sưởi ấm, nấu chín thức ăn và xua đuổi thú dữ", "Giúp xây dựng thành phố", "Giúp sản xuất điện"],
        d: 1
    },

    {
        q: "Hồ là gì?",
        a: ["Dòng nước chảy ra biển", "Một vùng núi cao", "Vùng trũng chứa nước trong lục địa", "Một dòng sông lớn"],
        d: 2
    },

    {
        q: "Vương quốc Phù Nam phát triển mạnh nhờ hoạt động kinh tế nào?",
        a: ["Thương mại đường biển", "Sản xuất ô tô", "Công nghiệp điện tử", "Khai thác than đá"],
        d: 0
    },

    {
        q: "Sinh vật trên Trái Đất gồm những nhóm nào?",
        a: ["Chỉ có con người", "Chỉ có động vật", "Thực vật và động vật cùng nhiều nhóm sinh vật khác", "Đất và đá"],
        d: 2
    },
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 15;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 15;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.75;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        
        <br>
        <button onclick="location.href='capdo_lsdl_khoi6_kho.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_lsdl_khoi6.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
