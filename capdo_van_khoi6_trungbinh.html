<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn 6 - TINH ANH</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
}

.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.back:hover {
    background: #333;
}

.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}

.player {
    color: #2878e8;
}

.bot {
    color: #e74c3c;
}

.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}

.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}

.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.5;
    color: #222;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}

.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}

.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}

.answer:disabled {
    cursor: not-allowed;
}

.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}

.result h1 {
    color: #2878e8;
}

.result p {
    font-size: 19px;
}

.win {
    color: #2ecc71 !important;
}

.lose {
    color: #e74c3c !important;
}

.draw {
    color: #f39c12 !important;
}

.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}

.result button:hover {
    background: #155bb5;
}

@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .title {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_van_khoi6.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">15</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">
    <div class="title">📚 NGỮ VĂN 6 - CẤP ĐỘ TINH ANH</div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>
</div>

<script>
const cauHoi = [
 {
        question: "Vì sao Dế Mèn cảm thấy ân hận sau cái chết của Dế Choắt?",
        answers: [
            "Vì trò đùa nghịch của mình đã gây ra hậu quả nghiêm trọng",
            "Vì Dế Choắt không giúp đỡ mình",
            "Vì bị mất thức ăn",
            "Vì không được đi chơi"
        ],
        correct: 0
    },
    {
        question: "Bài học lớn mà Dế Mèn nhận được là gì?",
        answers: [
            "Không nên kết bạn",
            "Không được kiêu căng, xốc nổi và cần biết suy nghĩ về hành động",
            "Phải luôn tránh xa mọi người",
            "Chỉ cần quan tâm đến bản thân"
        ],
        correct: 1
    },
    {
        question: "Chi tiết Gióng vươn vai thành tráng sĩ thể hiện điều gì?",
        answers: [
            "Sự yếu đuối",
            "Sự sợ hãi",
            "Sức mạnh phi thường của người anh hùng",
            "Sự lười biếng"
        ],
        correct: 2
    },
    {
        question: "Hình tượng Thánh Gióng thể hiện ước mơ nào của nhân dân?",
        answers: [
            "Ước mơ giàu có",
            "Ước mơ được đi xa",
            "Ước mơ có nhiều của cải",
            "Ước mơ về người anh hùng đánh giặc cứu nước"
        ],
        correct: 3
    },
    {
        question: "Chi tiết Sơn Tinh nâng núi cao hơn mực nước thể hiện điều gì?",
        answers: [
            "Khát vọng chiến thắng thiên tai",
            "Sự sợ hãi trước thiên nhiên",
            "Sự yếu đuối của con người",
            "Cuộc sống khó khăn ở miền núi"
        ],
        correct: 0
    },
    {
        question: "Ý nghĩa của chi tiết Rùa Vàng đòi lại gươm trong Sự tích Hồ Gươm là gì?",
        answers: [
            "Thể hiện sự giàu có",
            "Thể hiện quan niệm đất nước đã hòa bình, vũ khí cần được trả lại",
            "Thể hiện sức mạnh của động vật",
            "Giải thích nguồn gốc các loài rùa"
        ],
        correct: 1
    },
    {
        question: "Qua truyện Thạch Sanh, nhân dân đề cao phẩm chất nào?",
        answers: [
            "Sự tham lam",
            "Tính ích kỉ",
            "Lòng dũng cảm và sự thật thà",
            "Sự gian dối"
        ],
        correct: 2
    },
    {
        question: "Người em trong truyện Cây khế có phẩm chất gì?",
        answers: [
            "Tham lam",
            "Kiêu ngạo",
            "Lười biếng",
            "Hiền lành, chăm chỉ và thật thà"
        ],
        correct: 3
    },
    {
        question: "Truyện cổ tích thường thể hiện ước mơ gì của nhân dân?",
        answers: [
            "Cái thiện chiến thắng cái ác, người tốt được hạnh phúc",
            "Người giàu luôn chiến thắng",
            "Người xấu luôn được thưởng",
            "Không có sự công bằng"
        ],
        correct: 0
    },
    {
        question: "Tác dụng của yếu tố tưởng tượng trong truyện là gì?",
        answers: [
            "Làm câu chuyện khô khan",
            "Tạo sự hấp dẫn và thể hiện ý nghĩa câu chuyện",
            "Làm mất đi nội dung",
            "Khiến nhân vật không có tính cách"
        ],
        correct: 1
    },
    {
        question: "Biện pháp nhân hóa có tác dụng gì?",
        answers: [
            "Làm câu văn ngắn hơn",
            "Chỉ dùng để kể chuyện",
            "Làm sự vật trở nên gần gũi, sinh động",
            "Làm mất hình ảnh của sự vật"
        ],
        correct: 2
    },
    {
        question: "Biện pháp so sánh giúp người đọc điều gì?",
        answers: [
            "Không hiểu được sự vật",
            "Chỉ biết tên sự vật",
            "Không hình dung được hình ảnh",
            "Tân binh hình dung và cảm nhận đặc điểm của sự vật"
        ],
        correct: 3
    },
    {
        question: "Từ láy thường có đặc điểm nào?",
        answers: [
            "Có sự lặp lại âm hoặc vần giữa các tiếng",
            "Luôn chỉ có một tiếng",
            "Không có nghĩa",
            "Chỉ xuất hiện trong văn bản khoa học"
        ],
        correct: 0
    },
    {
        question: "Cụm danh từ là gì?",
        answers: [
            "Một từ chỉ hoạt động",
            "Tổ hợp từ có danh từ làm trung tâm",
            "Một câu hoàn chỉnh",
            "Tổ hợp từ có tính từ làm trung tâm"
        ],
        correct: 1
    },
    {
        question: "Cụm động từ có thành phần trung tâm là gì?",
        answers: [
            "Danh từ",
            "Tính từ",
            "Động từ",
            "Số từ"
        ],
        correct: 2
    },
    {
        question: "Trạng ngữ trong câu thường bổ sung thông tin gì?",
        answers: [
            "Tên tác giả",
            "Tên nhân vật",
            "Số tiếng trong câu",
            "Thời gian, nơi chốn, nguyên nhân, mục đích..."
        ],
        correct: 3
    },
    {
        question: "Chủ đề của văn bản là gì?",
        answers: [
            "Vấn đề chính được thể hiện trong văn bản",
            "Tên người viết",
            "Số lượng đoạn văn",
            "Tên nhà xuất bản"
        ],
        correct: 0
    },
    {
        question: "Người kể chuyện ngôi thứ nhất thường xưng là gì?",
        answers: [
            "Nó",
            "Tôi",
            "Họ",
            "Chúng nó"
        ],
        correct: 1
    },
    {
        question: "Người kể chuyện ngôi thứ ba thường kể như thế nào?",
        answers: [
            "Chỉ kể những việc của bản thân",
            "Luôn xưng tôi",
            "Gọi nhân vật bằng tên hoặc đại từ ở ngôi thứ ba",
            "Không được kể về nhân vật"
        ],
        correct: 2
    },
    {
        question: "Tác dụng của việc sử dụng từ ngữ gợi hình, gợi cảm là gì?",
        answers: [
            "Làm văn bản khó đọc",
            "Làm mất cảm xúc",
            "Chỉ tăng số lượng từ",
            "Giúp hình ảnh và cảm xúc trở nên sinh động"
        ],
        correct: 3
    },
];

let ds = [...cauHoi].sort(() => Math.random() - 0.5).slice(0, 10);
let cau = 0;
let diemBan = 0;
let diemBot = 0;
let tg = 15;
let timer;
let daTraLoi = false;

function hienThiCau() {
    clearInterval(timer);
    daTraLoi = false;
    tg = 15;

    document.getElementById("timer").textContent = tg;
    document.getElementById("playerScore").textContent = diemBan;
    document.getElementById("botScore").textContent = diemBot;
    document.getElementById("number").textContent = cau + 1;

    let c = ds[cau];

    document.getElementById("question").textContent =
        "Câu " + (cau + 1) + "/10: " + c.q;

    document.getElementById("answers").innerHTML = c.a.map((x, j) => `
        <button class="answer" onclick="traLoi(${j}, this)">
            ${String.fromCharCode(65 + j)}. ${x}
        </button>
    `).join("");

    timer = setInterval(() => {
        tg--;
        document.getElementById("timer").textContent = tg;

        if (tg <= 0) {
            hetThoiGian();
        }
    }, 1000);
}

function traLoi(chon, el) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    if (chon === c.d) {
        diemBan++;
        el.classList.add("correct");
    } else {
        el.classList.add("wrong");
        nut[c.d].classList.add("correct");
    }

    document.getElementById("playerScore").textContent = diemBan;

    setTimeout(botTraLoi, 700);
}

function hetThoiGian() {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let c = ds[cau];
    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);
    nut[c.d].classList.add("correct");

    setTimeout(botTraLoi, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").textContent = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">😢 BẠN THUA!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        
        <br>
        <button onclick="location.reload()">🔄 Chơi lại</button>
        <button onclick="location.href='capdo_van_khoi6.html'">🎚️ Chọn cấp độ</button>
        <button onclick="location.href='khoi6.html'">🏠 Về chọn môn</button>
    `;
}

hienThiCau();
</script>

</body>
</html>
