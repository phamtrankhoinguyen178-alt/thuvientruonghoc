q:"Trong văn học, sự mơ hồ có thể có giá trị nghệ thuật khi nào?",
a:["Khi nó mở ra nhiều khả năng diễn giải có căn cứ và kích thích người đọc suy nghĩ","Khi tác giả không biết mình viết gì","Khi không có chủ đề","Khi câu chữ sai"],
d:0
},
{
q:"Một tác phẩm càng giàu sức gợi càng đòi hỏi người đọc điều gì?",
a:["Khả năng liên tưởng, suy luận và kết nối các chi tiết thay vì chỉ tiếp nhận thông tin trực tiếp","Chỉ học thuộc","Chỉ đọc nhanh","Không cần phân tích"],
d:0
},
{
q:"Khi một tác phẩm khiến người đọc thay đổi cách nhìn về một vấn đề quen thuộc, đó có thể là biểu hiện của điều gì?",
a:["Sức mạnh nhận thức của văn học trong việc mở rộng góc nhìn và làm sâu sắc suy nghĩ về cuộc sống","Văn học chỉ để giải trí","Tác phẩm không có thông điệp","Chỉ là yếu tố hình thức"],

let ds = [...cauHoi]
    .sort(() => Math.random() - 0.5)
    .slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let tg = 15;
let timer;
let daTraLoi = false;

function hienThiCau() {

    clearInterval(timer);

    daTraLoi = false;
    tg = 15;

    document.getElementById("timer").textContent = tg;

    document.getElementById("playerScore").textContent = diemBan;
    document.getElementById("botScore").textContent = diemBot;

    document.getElementById("number").textContent = cau + 1;

    let c = ds[cau];

    document.getElementById("question").textContent =
        "Câu " + (cau + 1) + "/10: " + c.q;

    document.getElementById("answers").innerHTML =
        c.a.map((x, j) => `
            <button class="answer" onclick="traLoi(${j}, this)">
                ${String.fromCharCode(65 + j)}. ${x}
            </button>
        `).join("");

    timer = setInterval(() => {

        tg--;

        document.getElementById("timer").textContent = tg;

        if (tg <= 0) {
            hetThoiGian();
        }

    }, 1000);
}

function traLoi(chon, el) {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timer);

    let c = ds[cau];

    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    if (chon === c.d) {

        diemBan++;

        el.classList.add("correct");

    } else {

        el.classList.add("wrong");

        nut[c.d].classList.add("correct");

    }

    document.getElementById("playerScore").textContent = diemBan;

    setTimeout(botTraLoi, 700);
}

function hetThoiGian() {

    if (daTraLoi) return;

    daTraLoi = true;

    clearInterval(timer);

    let c = ds[cau];

    let nut = document.querySelectorAll(".answer");

    nut.forEach(button => button.disabled = true);

    nut[c.d].classList.add("correct");

    setTimeout(botTraLoi, 700);
}

function botTraLoi() {

    let dung = Math.random() < 0.25;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").textContent = diemBot;

    cau++;

    if (cau >= 10) {

        ketThucTran();

    } else {

        hienThiCau();

    }
}

function ketThucTran() {

    clearInterval(timer);

    document.getElementById("game").style.display = "none";

    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");

    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {

        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Chúc mừng! Bạn đã đánh bại Bot.</p>
        `;

    } else if (diemBan < diemBot) {

        ketQua = `
            <h1 class="lose">🤖 BOT THẮNG!</h1>
            <p>Bot đã chiến thắng lần này.</p>
        `;

    } else {

        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Hai bên có số điểm bằng nhau.</p>
        `;

    }

    result.innerHTML = `
        ${ketQua}

        <h2>👤 Bạn: ${diemBan} điểm</h2>

        <h2>🤖 Bot: ${diemBot} điểm</h2>

        <p>🔥 Cấp độ: KHÓ</p>

        <p>Bot có 25% xác suất trả lời đúng mỗi câu.</p>

        <br>

        <button onclick="location.reload()">
            🔄 Chơi lại
        </button>

        <button onclick="location.href='capdo_van_khoi7.html'">
            🎚️ Chọn cấp độ
        </button>

        <button onclick="location.href='khoi7.html'">
            🏠 Về chọn môn
        </button>
    `;
}

hienThiCau();

</script>
