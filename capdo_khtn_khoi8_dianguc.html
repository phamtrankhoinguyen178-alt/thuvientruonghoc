<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHTN 8 - Thi đấu với Bot</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff512f, #dd2476);
    min-height: 100vh;
}
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.back:hover {
    background: #111;
}
.top {
    background: white;
    padding: 65px 15px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    font-size: 20px;
    font-weight: bold;
}
.player {
    color: #2878e8;
}
.bot {
    color: #e74c3c;
}
.time {
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
}
.main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
.title {
    text-align: center;
    color: white;
    font-size: 30px;
    margin-bottom: 20px;
    font-weight: bold;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px #0003;
}
.question {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.answer {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f5f7ff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.answer:hover {
    background: #dce8ff;
    transform: scale(1.02);
}
.answer.correct {
    background: #b8f5c5;
    border-color: #2ecc71;
}
.answer.wrong {
    background: #ffc4c4;
    border-color: #e74c3c;
}
.info {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 18px;
}
.result {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px #0003;
}
.result h1 {
    color: #2878e8;
}
.win {
    color: #2ecc71;
}
.lose {
    color: #e74c3c;
}
.draw {
    color: #f39c12;
}
.result button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #2878e8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 5px;
}
@media(max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .top {
        font-size: 16px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<button class="back" onclick="location.href='capdo_khtn_khoi8.html'">
    ⬅ Quay về
</button>

<div class="top">
    <div class="player">👤 Bạn: <span id="playerScore">0</span></div>
    <div class="time">⏱ <span id="timer">10</span></div>
    <div class="bot">🤖 Bot: <span id="botScore">0</span></div>
</div>

<div class="main">

    <div class="title">
        🔥 KHTN KHỐI 8 - CHẾ ĐỘ BẤT TỬ
    </div>

    <div id="game" class="card">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
    </div>

    <div class="info">
        Câu <span id="number">1</span>/10
    </div>

    <div id="result" class="result"></div>

</div>

<script>
const cauHoi = [
{
    q: "Cho 5,6 g Fe phản ứng hoàn toàn với sulfur tạo thành FeS. Biết Fe = 56. Số mol Fe là bao nhiêu?",
    a: ["0,05 mol", "0,1 mol", "0,2 mol", "1 mol"],
    d: 1
},
{
    q: "Theo phản ứng Fe + S → FeS, nếu có 0,1 mol Fe phản ứng vừa đủ thì tạo ra bao nhiêu mol FeS?",
    a: ["0,05 mol", "0,1 mol", "0,2 mol", "0,3 mol"],
    d: 1
},
{
    q: "Đốt cháy hoàn toàn 12 g carbon tạo thành CO2. Khối lượng CO2 thu được là bao nhiêu?",
    a: ["22 g", "32 g", "44 g", "56 g"],
    d: 2
},
{
    q: "Hòa tan 20 g NaCl vào nước thu được 200 g dung dịch. Nồng độ phần trăm là bao nhiêu?",
    a: ["5%", "10%", "15%", "20%"],
    d: 1
},
{
    q: "Muốn pha 200 g dung dịch NaCl 5% cần bao nhiêu gam NaCl?",
    a: ["5 g", "10 g", "15 g", "20 g"],
    d: 1
},
{
    q: "Cho 6,5 g Zn phản ứng vừa đủ với HCl theo phương trình Zn + 2HCl → ZnCl2 + H2. Biết Zn = 65. Số mol H2 tạo ra là bao nhiêu?",
    a: ["0,05 mol", "0,1 mol", "0,2 mol", "0,5 mol"],
    d: 1
},
{
    q: "Trong phản ứng hóa học, chất oxi hóa là chất như thế nào?",
    a: ["Nhường electron", "Nhận electron", "Không thay đổi", "Luôn là kim loại"],
    d: 1
},
{
    q: "Phản ứng tỏa nhiệt là phản ứng như thế nào?",
    a: ["Hấp thụ nhiệt từ môi trường", "Giải phóng nhiệt ra môi trường", "Không trao đổi nhiệt", "Chỉ xảy ra ở nhiệt độ thấp"],
    d: 1
},
{
    q: "Một vật chịu lực 200 N tác dụng lên diện tích 0,02 m². Áp suất tác dụng là bao nhiêu?",
    a: ["1 000 Pa", "5 000 Pa", "10 000 Pa", "20 000 Pa"],
    d: 2
},
{
    q: "Một vật có thể tích 0,002 m³ được nhúng hoàn toàn trong nước. Lấy trọng lượng riêng của nước là 10 000 N/m³. Lực đẩy Archimedes là bao nhiêu?",
    a: ["2 N", "10 N", "20 N", "40 N"],
    d: 2
},
{
    q: "Một vật có trọng lượng 30 N, lực đẩy Archimedes tác dụng lên vật là 20 N. Khi vật được thả tự do trong nước, vật có xu hướng như thế nào?",
    a: ["Nổi lên", "Chìm xuống", "Lơ lửng", "Biến mất"],
    d: 1
},
{
    q: "Một vật có khối lượng 2 kg được nâng lên độ cao 5 m. Lấy g = 10 N/kg. Thế năng trọng trường tăng thêm bao nhiêu?",
    a: ["10 J", "50 J", "100 J", "200 J"],
    d: 2
},
{
    q: "Một máy thực hiện công 600 J trong 10 giây. Công suất của máy là bao nhiêu?",
    a: ["6 W", "60 W", "100 W", "600 W"],
    d: 1
},
{
    q: "Một vật chịu tác dụng của hai lực cân bằng sẽ có trạng thái chuyển động như thế nào?",
    a: ["Luôn tăng tốc", "Luôn giảm tốc", "Đứng yên hoặc chuyển động thẳng đều", "Luôn đổi hướng"],
    d: 2
},
{
    q: "Khi đứng trên nền đất mềm, người ta thường dùng ván đặt dưới chân để làm gì?",
    a: ["Tăng áp suất", "Giảm diện tích tiếp xúc", "Giảm áp suất", "Tăng trọng lượng"],
    d: 2
},
{
    q: "Vì sao khi vận động mạnh, nhịp tim và nhịp thở thường tăng?",
    a: ["Cơ thể cần nhiều oxygen và chất dinh dưỡng hơn", "Cơ thể ngừng trao đổi chất", "Phổi ngừng hoạt động", "Máu không còn lưu thông"],
    d: 0
},
{
    q: "Khi lượng đường trong máu tăng cao, hormone nào được tiết ra để giúp điều hòa đường huyết?",
    a: ["Adrenaline", "Insulin", "Thyroxine", "Estrogen"],
    d: 1
},
{
    q: "Nếu thận bị suy giảm chức năng nghiêm trọng, quá trình nào bị ảnh hưởng trực tiếp?",
    a: ["Lọc máu và tạo nước tiểu", "Trao đổi khí ở phổi", "Co bóp của tim", "Tiêu hóa thức ăn trong miệng"],
    d: 0
},
{
    q: "Tại sao vaccine có thể giúp cơ thể phòng chống một số bệnh truyền nhiễm?",
    a: ["Tiêu diệt tất cả vi khuẩn ngay lập tức", "Kích thích hệ miễn dịch hình thành trí nhớ miễn dịch", "Thay thế hoàn toàn bạch cầu", "Ngăn cơ thể tạo kháng thể"],
    d: 1
},
{
    q: "Một người có chế độ ăn thiếu iodine kéo dài có thể mắc bệnh nào?",
    a: ["Bướu cổ", "Còi xương do thiếu vitamin D", "Thiếu máu do thiếu sắt", "Quáng gà"],
    d: 0
}
];

let danhSach = [...cauHoi];

danhSach.sort(() => Math.random() - 0.5);
danhSach = danhSach.slice(0, 10);

let cau = 0;
let diemBan = 0;
let diemBot = 0;
let thoiGian = 10;
let daTraLoi = false;
let timer;

function hienThiCau() {
    daTraLoi = false;
    thoiGian = 10;

    document.getElementById("number").innerText = cau + 1;
    document.getElementById("timer").innerText = thoiGian;
    document.getElementById("question").innerText = danhSach[cau].q;

    let html = "";

    danhSach[cau].a.forEach((x, i) => {
        html += `
            <div class="answer" onclick="traLoi(${i}, this)">
                ${String.fromCharCode(65 + i)}. ${x}
            </div>
        `;
    });

    document.getElementById("answers").innerHTML = html;

    clearInterval(timer);

    timer = setInterval(() => {
        thoiGian--;

        document.getElementById("timer").innerText = thoiGian;

        if (thoiGian <= 0) {
            clearInterval(timer);
            ketThucCau();
        }
    }, 1000);
}

function traLoi(chon, element) {
    if (daTraLoi) return;

    daTraLoi = true;
    clearInterval(timer);

    let dung = danhSach[cau].d;

    if (chon === dung) {
        diemBan++;
        element.classList.add("correct");
    } else {
        element.classList.add("wrong");
        document.querySelectorAll(".answer")[dung]
            .classList.add("correct");
    }

    document.getElementById("playerScore").innerText = diemBan;

    ketThucCau();
}

function ketThucCau() {
    if (!daTraLoi) {
        daTraLoi = true;

        document.querySelectorAll(".answer")[danhSach[cau].d]
            .classList.add("correct");
    }

    setTimeout(() => {
        botTraLoi();
    }, 700);
}

function botTraLoi() {
    let dung = Math.random() < 0.85;

    if (dung) {
        diemBot++;
    }

    document.getElementById("botScore").innerText = diemBot;

    cau++;

    if (cau >= 10) {
        ketThucTran();
    } else {
        hienThiCau();
    }
}

function ketThucTran() {
    clearInterval(timer);

    document.getElementById("game").style.display = "none";
    document.querySelector(".info").style.display = "none";

    let result = document.getElementById("result");
    result.style.display = "block";

    let ketQua = "";

    if (diemBan > diemBot) {
        ketQua = `
            <h1 class="win">🏆 BẠN THẮNG!</h1>
            <p>Không thể tin được! Bạn đã đánh bại Bot BẤT TỬ!</p>
        `;
    } else if (diemBan < diemBot) {
        ketQua = `
            <h1 class="lose">🔥 BẠN THUA!</h1>
            <p>Bot BẤT TỬ đã chiến thắng!</p>
        `;
    } else {
        ketQua = `
            <h1 class="draw">🤝 HÒA!</h1>
            <p>Bạn đã ngang tài ngang sức với Bot!</p>
        `;
    }

    result.innerHTML = `
        ${ketQua}
        <h2>👤 Bạn: ${diemBan} điểm</h2>
        <h2>🤖 Bot: ${diemBot} điểm</h2>
        
        <br>
        <button onclick="location.href='capdo_khtn_khoi8_dianguc.html'">
            Chơi lại
        </button>
        <button onclick="location.href='capdo_khtn_khoi8.html'">
            Về chọn chế độ
        </button>
    `;
}

hienThiCau();
</script>

</body>
</html>
