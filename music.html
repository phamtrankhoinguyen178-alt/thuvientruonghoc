<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP3 Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <link rel="stylesheet" href="./music.css">
</head>

<body>

  <a href="./index.html" class="back-home">← Quay về trang chủ</a>

  <div class="music-layout">

    <div class="playlist">
      <h2>🎵 Danh sách nhạc</h2>
      <div id="playlist"></div>
    </div>

    <div class="music">

      <div class="music-thumb">
        <img
          id="musicImage"
          src="https://images.unsplash.com/photo-1614624532983-4ce03382d63d?auto=format&fit=crop&w=500&q=80"
          alt="Music"
        >
      </div>

      <h3 class="music-name">Holo</h3>

      <input
        type="range"
        id="range"
        class="range"
        min="0"
        max="100"
        value="0"
      >

      <audio id="song"></audio>

      <div class="timer">
        <span class="remaining">00:00</span>
        <span class="duration">00:00</span>
      </div>

      <div class="controls">

        <ion-icon
          name="play-back"
          class="play-back">
        </ion-icon>

        <div class="play">
          <div class="player-inner">
            <ion-icon name="play"></ion-icon>
          </div>
        </div>

        <ion-icon
          name="play-forward"
          class="play-forward">
        </ion-icon>

        <ion-icon
          name="repeat-outline"
          class="play-repeat">
        </ion-icon>

      </div>

    </div>

  </div>

  <script src="./music.js"></script>

</body>
</html>
